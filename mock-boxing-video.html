<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>今天不低头 · 拳击派对</title>
<style>
  /* ============================================================
     关卡 HUD 设计系统 v1 · 拳击皮肤(黑红金)
     token + 液态玻璃 + 线性SVG图标,三关共用同一套,只换分支色
  ============================================================ */
  :root{
    --gold:#ffd66b;
    --gold-bright:#ffe89b;
    --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --fs-display:60px; --fs-num:44px;
    --glass-blur:14px;
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.18);
    --shadow-1:0 2px 8px rgba(0,0,0,.18);
    --shadow-2:0 8px 24px rgba(0,0,0,.28);
    --ok:#6bff9d;
    /* 判定三态(光球命中反馈) */
    --perfect:#6bff9d;
    --good:#ffd66b;
    --miss:#8a8f99;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

    /* 拳击 · 黑红金皮肤 */
    --brand:#ff3b3b;
    --brand-deep:#c81f2d;
    --ink:#1a0608;
    --glass-bg:rgba(38,10,14,.42);
    --overlay-bg:radial-gradient(circle at 50% 42%, rgba(90,16,22,.72), rgba(15,3,5,.94));
    --title-txt:#3a0c10;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;font-family:var(--font);background:#1a0608;color:#fff;-webkit-font-smoothing:antialiased;}
  #app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%, #2a0a0e 0%, #150406 70%, #0d0204 100%);}

  /* ===== 底层视频 ===== */
  #bgvid{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);
    min-width:100%;min-height:100%;width:auto;height:auto;max-width:none;max-height:none;
    object-fit:cover;z-index:1;background:#1a0608;
  }
  .vignette{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg, rgba(20,4,6,.4) 0%, rgba(20,4,6,0) 18%, rgba(20,4,6,0) 80%, rgba(20,4,6,.38) 100%);
  }

  /* ============================================================
     通用玻璃面:液态玻璃(通透+提色+边缘镜面光+顶部光泽)
  ============================================================ */
  .glass{
    position:relative;
    background:
      linear-gradient(135deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.03) 38%, rgba(255,255,255,.07) 100%),
      var(--glass-bg);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.45),
      inset 0 -10px 22px rgba(255,255,255,.04),
      var(--shadow-2);
    backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  }
  .glass::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    padding:1px;
    background:linear-gradient(135deg,
      rgba(255,255,255,.7) 0%, rgba(255,255,255,.08) 34%,
      rgba(255,255,255,0) 58%, rgba(255,255,255,.32) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }

  /* 线性 SVG 图标 */
  .ico{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* ==================== HUD ==================== */
  /* ==================== 顶部动作队列(预告+当前+汇总 三合一,替代标题)==================== */
  /* 主旨「不低头」:核心信息全部上移到屏幕顶部 */
  .action-queue{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:30;
    display:flex;align-items:center;gap:10px;
    padding:12px 20px;border-radius:var(--r-pill);
  }
  .aq-chip{
    position:relative;width:58px;height:58px;border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);
    color:rgba(255,255,255,.5);font-size:30px;font-weight:900;line-height:1;
    transition:transform .2s, background .25s, border-color .25s, color .25s, box-shadow .25s;
  }
  /* 未到(预告态):暗淡 */
  .aq-chip.upcoming{opacity:.55;}
  /* 当前拳:金色高亮 + 呼吸放大,一眼看出"该做这个" */
  .aq-chip.active{
    opacity:1;color:var(--title-txt);
    background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    border-color:var(--gold-bright);
    box-shadow:0 0 18px rgba(255,214,107,.55);
    transform:scale(1.26);
    animation:aqBreath .6s ease-in-out infinite alternate;
  }
  @keyframes aqBreath{from{transform:scale(1.2);}to{transform:scale(1.34);}}
  /* 判定三态染色(汇总) */
  .aq-chip.perfect{opacity:1;color:#0a2b18;background:var(--perfect);border-color:#eafff2;box-shadow:0 0 10px var(--perfect);}
  .aq-chip.good{opacity:1;color:var(--title-txt);background:var(--good);border-color:#fff6de;box-shadow:0 0 9px var(--good);}
  .aq-chip.miss{opacity:.5;color:rgba(255,255,255,.6);background:rgba(120,124,132,.35);border-color:rgba(255,255,255,.18);}

  /* ===== 左上英雄:大号分数(参考 Active Arcade,信息当主角不当角标)===== */
  .hud-left{position:absolute;top:20px;left:20px;z-index:30;
    display:flex;flex-direction:column;gap:12px;align-items:flex-start;}
  .score-hero{
    display:flex;flex-direction:column;align-items:flex-start;gap:4px;
    padding:14px 32px 18px;border-radius:var(--r-lg);min-width:186px;
  }
  .score-hero .sh-label{
    display:flex;align-items:center;gap:8px;
    font-size:17px;font-weight:800;letter-spacing:2px;color:var(--gold-bright);opacity:.9;
  }
  .score-hero .sh-label .ico{width:20px;height:20px;}
  .score-hero .sh-num{
    font-size:82px;font-weight:900;line-height:1;color:#fff;letter-spacing:1px;
    text-shadow:0 2px 10px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;
  }
  .score-hero .sh-num.bump{animation:scoreBump .42s cubic-bezier(.34,1.56,.64,1);}
  @keyframes scoreBump{0%{transform:scale(1);}42%{transform:scale(1.26);color:var(--gold-bright);}100%{transform:scale(1);}}
  /* 连击小胶囊(副信息) */
  .chip{
    display:flex;align-items:center;gap:10px;
    padding:11px 22px;border-radius:var(--r-pill);
    color:var(--gold-bright);font-size:18px;font-weight:800;letter-spacing:.5px;
  }
  .chip .ico{width:22px;height:22px;}
  .chip .lb{opacity:.9;}
  .chip .val{color:#fff;font-size:26px;font-weight:900;min-width:26px;text-align:center;}
  .chip .unit{font-size:15px;opacity:.7;font-weight:700;}
  .combo-chip.hot{border-color:rgba(255,214,107,.4);box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 0 14px rgba(255,214,107,.35),var(--shadow-2);}
  .combo-chip.hot .val{color:var(--gold-bright);}

  /* ===== 右上英雄:大号倒计时 ===== */
  .timer-hero{
    position:absolute;top:20px;right:20px;z-index:30;
    display:flex;flex-direction:column;align-items:flex-end;gap:4px;
    padding:14px 32px 18px;border-radius:var(--r-lg);min-width:186px;
  }
  .timer-hero .th-label{
    display:flex;align-items:center;gap:8px;
    font-size:17px;font-weight:800;letter-spacing:2px;color:var(--gold-bright);opacity:.9;
  }
  .timer-hero .th-label .ico{width:20px;height:20px;}
  .timer-hero .th-num{
    font-size:76px;font-weight:900;line-height:1;color:#fff;letter-spacing:1px;
    text-shadow:0 2px 10px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;transition:color .3s;
  }
  /* 最后 10 秒转暖金提醒(克制,不闪红,守治愈基调) */
  .timer-hero.ending .th-num{color:var(--gold-bright);}

  /* 判定飘字 · 击打感(屏幕正中,做大做干脆——判语的主舞台)*/
  .floater{
    position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:28;
    text-align:center;pointer-events:none;font-weight:900;
  }
  .floater .big{
    font-size:150px;letter-spacing:3px;line-height:.9;
    background:linear-gradient(135deg,#fff,var(--gold-bright));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 18px rgba(0,0,0,.8)) drop-shadow(0 0 30px var(--brand));
  }
  .floater .sub{font-size:30px;color:#fff;margin-top:8px;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.85);}
  /* 干脆:快进快出,冲击力更强 */
  .floater.play{animation:floatHit 1s cubic-bezier(.15,.9,.2,1) forwards;}
  @keyframes floatHit{
    0%{opacity:0;transform:translateX(-50%) scale(.4);}
    14%{opacity:1;transform:translateX(-50%) scale(1.5);}
    28%{transform:translateX(-50%) scale(1);}
    72%{opacity:1;transform:translateX(-50%) scale(1);}
    100%{opacity:0;transform:translateX(-50%) scale(1.02);}
  }

  /* ============================================================
     闪避光球场:四方位光球 + 逼近缩圈(有氧拳击式动作引导)
     箭头 = 你的头往哪边动(◀左倾 ▶右倾 ▲抬头 ▼收下巴)
  ============================================================ */
  .orb-field{position:absolute;inset:0;z-index:26;pointer-events:none;}
  .dodge-orb{
    position:absolute;width:126px;height:126px;
    transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;
  }
  /* 径向读秒环(参考 Active Arcade):一圈够粗的白环从满被"吃"到空 = 剩余反应时间。
     白环加粗当主角、底轨极淡收边 —— 整体读成"一枚硬币",不堆细线 */
  .orb-timer{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible;}
  .orb-timer .ot-track{fill:none;stroke:rgba(0,0,0,.2);stroke-width:11;}
  .orb-timer .ot-prog{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;}
  /* 内核:扁平纯色金盘 —— 一色到底,深色箭头拉满对比,不做glossy高光,靠粗白环收边 */
  .orb-core{
    position:relative;width:100px;height:100px;border-radius:50%;
    background:linear-gradient(180deg, #ffe08a 0%, #ffc63f 55%, #f2ab26 100%);
    display:flex;align-items:center;justify-content:center;
    color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.4);transition:box-shadow .15s;
  }
  .orb-core .arrow{font-size:50px;font-weight:900;line-height:1;color:var(--title-txt);}
  /* 目标标签(左倾/右倾…):挂在球正下方,放大到一眼可读 */
  .dodge-orb .tag{
    position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:17px;font-weight:900;letter-spacing:1px;color:#fff;
    padding:3px 12px;border-radius:var(--r-pill);background:rgba(20,6,8,.6);
    text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  /* 命中区:去掉多余的虚线靶圈,判定窗口交给读秒环表达(做减法,不堆层) */
  .hit-zone{display:none;}
  /* 当前活跃球:呼吸,和未到球拉开对比 */
  .dodge-orb.active .orb-core{animation:orbBreath .6s ease-in-out infinite alternate;}
  .dodge-orb:not(.active) .orb-core{opacity:.5;}
  .dodge-orb:not(.active) .orb-timer{opacity:.4;}
  @keyframes orbBreath{from{transform:scale(1);}to{transform:scale(1.06);}}
  /* 准星压到活跃球:金→绿,读秒环也转绿(金=目标,绿=对准/奖励,守住品牌层次) */
  .dodge-orb.locked .orb-core{box-shadow:0 0 24px var(--perfect),0 3px 12px rgba(0,0,0,.4);}
  .dodge-orb.locked .orb-timer .ot-prog{stroke:var(--perfect);}

  /* 命中三态(挂在 resolve,砸在对应光球上)—— 扁平纯色,和新硬币风格统一 */
  .dodge-orb.hit-perfect .orb-core{
    background:linear-gradient(180deg,#9dffc2,#6bff9d 60%,#3fe07f);
    box-shadow:0 0 24px rgba(107,255,157,.65),0 3px 12px rgba(0,0,0,.4);
    animation:orbBounce .5s ease-out both;
  }
  .dodge-orb.hit-perfect .orb-core .arrow{color:#0a2b18;}
  .dodge-orb.hit-good .orb-core{
    background:linear-gradient(180deg,#ffe08a,#ffc63f 60%,#f2ab26);
    box-shadow:0 0 20px rgba(255,214,107,.55),0 3px 12px rgba(0,0,0,.4);
    animation:orbBounce .5s ease-out both;
  }
  .dodge-orb.hit-miss{opacity:.45;}
  .dodge-orb.hit-miss .orb-core{
    background:linear-gradient(180deg,#b6bac2,#8a8f99);box-shadow:none;animation:orbMissShake .4s ease-in-out both;
  }
  .dodge-orb.hit-miss .orb-core .arrow{color:rgba(255,255,255,.75);}
  /* 判定后读秒环隐去 */
  .dodge-orb.hit-perfect .orb-timer,.dodge-orb.hit-good .orb-timer,.dodge-orb.hit-miss .orb-timer{opacity:0;transition:opacity .3s;}
  @keyframes orbBounce{0%{transform:scale(1);}42%{transform:scale(1.32);}100%{transform:scale(1);}}
  @keyframes orbMissShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

  /* ===== 头部准星:你身体的替身,全场"你在哪"的唯一线索,做大做亮不能丢 ===== */
  #reticle{
    position:absolute;left:50%;top:50%;width:74px;height:74px;z-index:27;
    transform:translate(-50%,-50%);pointer-events:none;
    transition:opacity .3s, border-color .2s;will-change:transform;
  }
  /* 外光晕环:一圈淡实底,把准星从背景里"托"出来 */
  #reticle .ret-halo{
    position:absolute;inset:-6px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 68%);
  }
  #reticle .ret-ring{
    position:absolute;inset:0;border-radius:50%;
    border:3px solid #fff;
    box-shadow:0 0 12px rgba(0,0,0,.55), 0 0 6px rgba(255,255,255,.5), inset 0 0 8px rgba(255,255,255,.35);
  }
  #reticle .ret-cross{position:absolute;background:#fff;box-shadow:0 0 5px rgba(0,0,0,.6);}
  #reticle .ret-cross.h{top:50%;left:16px;right:16px;height:2.5px;transform:translateY(-50%);}
  #reticle .ret-cross.v{left:50%;top:16px;bottom:16px;width:2.5px;transform:translateX(-50%);}
  #reticle .ret-dot{position:absolute;top:50%;left:50%;width:8px;height:8px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(0,0,0,.55);}
  /* 对准活跃球:准星整体变绿 + 放大一点点,强化"锁上了"的爽感 */
  #reticle.locked{transform:translate(-50%,-50%) scale(1.12);}
  #reticle.locked .ret-ring{border-color:var(--perfect);box-shadow:0 0 22px var(--perfect),0 0 8px var(--perfect);}
  #reticle.locked .ret-cross,#reticle.locked .ret-dot{background:var(--perfect);}
  #reticle.locked .ret-halo{background:radial-gradient(circle, rgba(107,255,157,.28) 0%, rgba(107,255,157,0) 68%);}
  /* 无脸/键盘态:淡化并归中 */
  #reticle.lost{opacity:.3;}

  /* 命中冲击波(判定点扩散,搬自老拳击版)—— 细环,克制 */
  .shockwave{
    position:absolute;transform:translate(-50%,-50%);
    width:20px;height:20px;border-radius:50%;border:2px solid;
    pointer-events:none;z-index:26;
    animation:shockwaveExpand .5s ease-out both;
  }
  .shockwave.perfect{border-color:var(--perfect);}
  .shockwave.good{border-color:var(--good);}
  .shockwave.miss{border-color:var(--miss);}
  @keyframes shockwaveExpand{0%{width:20px;height:20px;opacity:.9;}100%{width:200px;height:200px;opacity:0;}}

  /* 右下角 · 真人点阵脸小窗(与拳击关统一) */
  .you-cam{
    position:absolute;bottom:20px;right:20px;z-index:30;
    width:168px;height:126px;
    border:3px solid #ffcc00;border-radius:12px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%,#0b0512 0%,#000 100%);
    box-shadow:0 0 22px rgba(255,204,0,.4),0 4px 20px rgba(0,0,0,.6);
  }
  .you-cam video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .you-cam .you-mesh{width:100%;height:100%;display:block;}
  .you-cam .you-label{
    position:absolute;top:8px;right:8px;
    display:flex;align-items:center;gap:5px;
    color:#ff4d5e;font-size:11px;font-weight:900;letter-spacing:2px;
    padding:3px 8px;background:rgba(0,0,0,.55);border-radius:5px;
  }
  .you-cam .you-dot{width:7px;height:7px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e;animation:youBlink 1.2s infinite;}
  @keyframes youBlink{50%{opacity:.3;}}

  /* 开场隐私提示 — 打消面部采集顾虑 */
  .privacy-note{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:14px;
    font-size:13px;color:rgba(255,255,255,.62);letter-spacing:.3px;
  }
  .privacy-note svg{width:15px;height:15px;color:var(--gold,#ffcc00);flex-shrink:0;}
  .privacy-note b{color:rgba(255,255,255,.9);font-weight:700;}

  /* ==================== 开场 / 结算 ==================== */
  .overlay{
    position:absolute;inset:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:16px;padding:24px;
    background:var(--overlay-bg);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .8s;
  }
  .overlay.hide{opacity:0;pointer-events:none;}
  .brand{
    border:1px solid var(--gold);color:var(--gold-bright);
    padding:6px 20px;border-radius:var(--r-pill);
    font-size:13px;font-weight:800;letter-spacing:3px;
    display:flex;align-items:center;gap:8px;
  }
  .brand .ico{width:15px;height:15px;}
  .big-title{
    font-size:var(--fs-display);font-weight:900;letter-spacing:2px;line-height:1.1;
    background:linear-gradient(135deg,#fff 0%,var(--gold-bright) 48%,var(--brand) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .subtitle{font-size:15px;color:rgba(255,255,255,.82);line-height:1.7;max-width:440px;}
  .subtitle b{color:var(--gold-bright);}
  .how-grid{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
  .how-item{
    background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);
    border-radius:var(--r-md);padding:22px 20px;min-width:150px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .how-item .arrow{font-size:44px;line-height:1;color:#fff;font-weight:900;}
  .how-item .lb{font-size:17px;color:var(--gold-bright);font-weight:800;}
  .how-item .sub2{font-size:13px;color:rgba(255,255,255,.65);}
  .btn{
    margin-top:8px;border:none;cursor:pointer;
    background:var(--brand);
    color:#fff;padding:16px 46px;border-radius:var(--r-pill);
    font-size:18px;font-weight:900;letter-spacing:1.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .12s,filter .12s;
    display:inline-flex;align-items:center;gap:9px;
  }
  .btn .ico{stroke:#fff;}
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn-ghost{
    margin-top:2px;border:none;cursor:pointer;background:transparent;
    color:rgba(255,255,255,.6);font-family:var(--font);
    font-size:14px;font-weight:700;letter-spacing:.5px;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s;
  }
  .btn-ghost:hover{color:var(--gold-bright);}
  .btn-ghost .ico{width:15px;height:15px;stroke:currentColor;}
  .status{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;}

  .result-card{
    border-radius:var(--r-lg);padding:26px 34px;
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .result-stat{display:flex;gap:34px;}
  .result-stat .item{text-align:center;}
  .result-stat .num{font-size:var(--fs-num);font-weight:900;color:var(--gold-bright);line-height:1;}
  .result-stat .lb{font-size:13px;color:rgba(255,255,255,.75);margin-top:7px;}
  .result-up{font-size:14px;color:var(--ok);font-weight:700;display:flex;align-items:center;gap:6px;}
  .result-up .ico{width:15px;height:15px;stroke:var(--ok);}

  /* ---- 结算 · 判语 + 星级并排一行 ---- */
  #result{gap:10px;overflow-y:auto;}
  .res-verdict-row{display:flex;align-items:center;gap:14px;}
  .res-verdict{font-size:19px;font-weight:900;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);letter-spacing:.5px;}
  .res-stars{display:inline-flex;gap:7px;filter:drop-shadow(0 3px 10px rgba(255,201,77,.32));}
  .res-stars svg{width:30px;height:30px;opacity:1;transition:opacity .3s;}
  .res-stars svg.dim{opacity:.22;}
  .res-stars svg.lit{animation:starPop .55s ease-out;}
  .res-stars svg.lit:nth-child(1){animation-delay:.10s;}
  .res-stars svg.lit:nth-child(2){animation-delay:.24s;}
  .res-stars svg.lit:nth-child(3){animation-delay:.38s;}
  @keyframes starPop{0%{transform:scale(0) rotate(-160deg);opacity:0;}60%{transform:scale(1.2) rotate(12deg);}100%{transform:scale(1) rotate(0);opacity:1;}}

  /* ---- 练完感觉 ---- */
  .feel-block{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .feel-q{font-size:13px;color:rgba(255,255,255,.68);font-weight:700;letter-spacing:.5px;}
  .feel-row{display:flex;gap:8px;}
  .feel-btn{
    border:2px solid transparent;background:rgba(255,255,255,.07);
    border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font);
    transition:background .18s,border-color .18s;
  }
  .feel-btn:hover{background:rgba(255,255,255,.13);}
  .feel-btn .em{font-size:22px;line-height:1;}
  .feel-btn .fl{font-size:11px;color:rgba(255,255,255,.68);font-weight:700;}
  .feel-btn.on{background:rgba(255,214,107,.16);border-color:var(--gold);}
  .feel-btn.on .fl{color:var(--gold-bright);}

  /* ---- 看完整报告入口(尺寸与主按钮一致,描边区分主次) ---- */
  .btn-report{
    margin-top:2px;border:1px solid rgba(255,214,107,.42);cursor:pointer;
    background:rgba(255,214,107,.08);color:var(--gold-bright);
    font-family:var(--font);padding:16px 46px;border-radius:var(--r-pill);
    font-size:18px;font-weight:900;letter-spacing:1.5px;
    display:inline-flex;align-items:center;gap:9px;transition:background .15s;
  }
  .btn-report:hover{background:rgba(255,214,107,.17);}
  .btn-report .ico{width:18px;height:18px;stroke:var(--gold-bright);}

  /* 结算页:按钮组整体下移;两个主按钮固定同宽 */
  #result .btn{margin-top:30px;}
  #result .btn,#result .btn-report{width:300px;justify-content:center;padding-left:0;padding-right:0;}
  #result .feel-block{margin-top:18px;}
  #result .btn-ghost{margin-top:20px;}

  .toast{
    position:absolute;top:78px;left:50%;transform:translateX(-50%) translateY(-10px);
    z-index:35;
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 22px;border-radius:var(--r-pill);
    color:var(--gold-bright);font-size:14px;font-weight:700;letter-spacing:.5px;
    opacity:0;transition:all .5s;
  }
  .toast .ico{width:16px;height:16px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- 3秒倒计时(参考老拳击版:超大弹跳数字 + 品牌辉光) ---- */
  .countdown{
    position:absolute;inset:0;z-index:70;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 50%, rgba(0,0,0,.35), rgba(0,0,0,.62));
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .countdown.hide{display:none;}
  .countdown .cd-num{
    font-size:150px;font-weight:900;line-height:1;
    color:var(--gold-bright);
    text-shadow:0 0 50px var(--brand),0 0 100px var(--brand),0 8px 20px rgba(0,0,0,.7);
  }
  .countdown .cd-num.go{
    font-size:96px;letter-spacing:6px;
    background:linear-gradient(135deg,#fff,var(--gold-bright));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 40px var(--brand));
  }
  .cd-pop{animation:cdPop 1s ease-out;}
  @keyframes cdPop{
    0%{transform:scale(.35);opacity:0;letter-spacing:24px;}
    28%{transform:scale(1.25);opacity:1;letter-spacing:2px;}
    70%{transform:scale(1);opacity:1;}
    100%{transform:scale(.82);opacity:0;}
  }

  /* ==================== 动作提示浮层(浮在真实游戏画面上,5秒后自动进倒计时)==================== */
  .howto{
    position:absolute;inset:0;z-index:68;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(ellipse at 50% 46%, rgba(30,4,6,.5), rgba(15,3,5,.16) 72%, rgba(15,3,5,0) 100%);
    transition:opacity .4s;
  }
  .howto.hide{opacity:0;pointer-events:none;}
  .howto-card{
    display:flex;flex-direction:column;align-items:center;gap:16px;
    padding:22px 30px 24px;border-radius:var(--r-lg);
    background:linear-gradient(180deg, rgba(48,12,16,.62), rgba(28,7,10,.68));
    border:1px solid rgba(255,120,120,.22);
    box-shadow:0 20px 56px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    animation:howtoPop .5s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes howtoPop{0%{transform:scale(.9);opacity:0;}100%{transform:none;opacity:1;}}
  .demo-stage{width:min(400px,80vw);aspect-ratio:320/188;}
  .demo-svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));}
  .demo-svg .you-head{fill:#eaf6ff;stroke:var(--gold-bright);stroke-width:2.5;
    transform-origin:160px 96px;animation:dodgeHead 3.2s ease-in-out infinite;}
  .demo-svg .you-eye{fill:#2a1f05;}
  .demo-svg .you-grp{transform-origin:160px 96px;animation:dodgeHead 3.2s ease-in-out infinite;}
  @keyframes dodgeHead{
    0%,8%{transform:translate(0,0) rotate(0deg);}
    18%,26%{transform:translate(-26px,0) rotate(-16deg);}  /* 躲左钩 */
    36%,44%{transform:translate(26px,0) rotate(16deg);}    /* 躲右钩 */
    54%,62%{transform:translate(0,14px);}                  /* 收下巴躲上勾 */
    72%,80%{transform:translate(0,-14px);}                 /* 抬头躲下勾 */
    90%,100%{transform:translate(0,0) rotate(0deg);}}
  .demo-svg .glove{fill:var(--brand);stroke:#fff;stroke-width:2;opacity:0;}
  .demo-svg .g-left{animation:gLeft 3.2s ease-in-out infinite;}
  .demo-svg .g-right{animation:gRight 3.2s ease-in-out infinite;}
  .demo-svg .g-up{animation:gUp 3.2s ease-in-out infinite;}
  .demo-svg .g-down{animation:gDown 3.2s ease-in-out infinite;}
  @keyframes gLeft{0%,8%{opacity:0;transform:translateX(-70px);}15%{opacity:1;transform:translateX(0);}24%,100%{opacity:0;transform:translateX(-70px);}}
  @keyframes gRight{26%{opacity:0;transform:translateX(70px);}33%{opacity:1;transform:translateX(0);}42%,100%,0%{opacity:0;transform:translateX(70px);}}
  @keyframes gUp{44%{opacity:0;transform:translateY(-64px);}51%{opacity:1;transform:translateY(0);}60%,100%,0%{opacity:0;transform:translateY(-64px);}}
  @keyframes gDown{62%{opacity:0;transform:translateY(64px);}69%{opacity:1;transform:translateY(0);}78%,100%,0%{opacity:0;transform:translateY(64px);}}

  .howto-cap{font-size:19px;font-weight:800;color:#fff;text-align:center;line-height:1.65;
    text-shadow:0 2px 14px rgba(0,0,0,.75);animation:howtoPop .5s cubic-bezier(.2,.9,.3,1.3) .06s both;}
  .howto-cap b{color:var(--gold-bright);}
  .howto-timer{width:min(300px,64vw);height:4px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;}
  .howto-timer i{display:block;height:100%;width:100%;transform-origin:left;
    background:linear-gradient(90deg,var(--gold),var(--gold-bright));animation:howtoTimer 6s linear forwards;}
  @keyframes howtoTimer{from{transform:scaleX(1);}to{transform:scaleX(0);}}

  /* ---- 结算页 streak 火苗 +1(多邻国式成就动画) ---- */
  .streak-win{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px;}
  .flame-stage{position:relative;width:120px;height:130px;display:flex;align-items:flex-end;justify-content:center;}
  .flame{width:78px;height:96px;transform-origin:50% 100%;
    filter:drop-shadow(0 0 20px rgba(255,152,0,.75)) drop-shadow(0 0 44px rgba(255,152,0,.4));
    animation:flameGrow 1s cubic-bezier(.2,.9,.25,1) both, flameFlicker 1.8s ease-in-out 1s infinite;}
  @keyframes flameGrow{0%{transform:scale(.2) translateY(20px);opacity:0;}45%{transform:scale(1.25) translateY(0);opacity:1;}68%{transform:scale(.92);}100%{transform:scale(1);opacity:1;}}
  @keyframes flameFlicker{0%,100%{transform:scale(1) skewX(0deg);}30%{transform:scale(1.04,.98) skewX(-2deg);}60%{transform:scale(.98,1.03) skewX(2deg);}}
  .flame-plus{position:absolute;top:-6px;left:50%;font-size:34px;font-weight:900;color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.5),0 0 18px #FF9800;
    transform:translateX(-50%) scale(0);animation:plusPop .6s cubic-bezier(.2,.8,.2,1) .55s both;}
  @keyframes plusPop{0%{transform:translateX(-50%) translateY(6px) scale(0);opacity:0;}55%{transform:translateX(-50%) translateY(-10px) scale(1.3);opacity:1;}100%{transform:translateX(-50%) translateY(-14px) scale(1);opacity:1;}}
  .flame-spark{position:absolute;top:40%;left:50%;width:8px;height:8px;border-radius:50%;
    background:#FFD54F;box-shadow:0 0 8px #FFD54F;opacity:0;animation:sparkFly .9s ease-out .5s forwards;}
  @keyframes sparkFly{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(0) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(-70px) scale(.3);}}
  .streak-days{font-size:19px;font-weight:900;color:#FFB74D;letter-spacing:.5px;display:flex;align-items:center;gap:7px;
    opacity:0;animation:daysIn .5s ease-out .9s both;}
  .streak-days .big{font-size:26px;color:#FFD54F;}
  @keyframes daysIn{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
  .streak-sub{font-size:12px;color:rgba(255,255,255,.6);opacity:0;animation:daysIn .5s ease-out 1.1s both;}
  /* 触发前隐藏,加 .go 才播放 */
  .streak-win{visibility:hidden;}
  .streak-win.go{visibility:visible;}

  /* ============================================================
     响应式 · 手机端适配(照首页三件套底座 + 本页专属断点)
     全屏 fixed 游戏:光球/准星/冲击波是百分比定位会自动跟随缩放,
     这里只把固定 px 的 HUD 与开场/结算浮层在窄屏收小、避免溢出遮挡。
     安全区:顶栏用 env() 顶部内边距,底部小窗避开 Home 指示条。
  ============================================================ */
  @media (max-width: 768px){
    /* 顶部两角(分数/倒计时)各占一角;动作队列 10 拳一行放不下,
       照首页顶栏手机端「换行重排」的做法,把队列移到两角下方第二行、全宽平铺。
       左上「分数+连击」原为纵积(会占到 ~138px 挡住第二行队列),手机端改横排,
       让第一行高度压到 ~86px,队列第二行(top:98)即可无遮挡平铺。 */
    .action-queue{
      top:calc(98px + var(--app-safe-top,0px));
      left:max(8px,var(--app-safe-left,0px));
      right:max(8px,var(--app-safe-right,0px));
      transform:none;justify-content:space-between;
      gap:4px;padding:6px 8px;
    }
    .aq-chip{width:clamp(26px,7.6vw,34px);height:clamp(26px,7.6vw,34px);border-radius:10px;font-size:19px;}
    /* 第二行全宽平铺:active 用静态放大(去呼吸动画),避免顶到相邻/溢出行 */
    .aq-chip.active{animation:none;transform:scale(1.12);}
    .hud-left{top:calc(10px + var(--app-safe-top,0px));left:max(10px,var(--app-safe-left,0px));
      flex-direction:row;align-items:flex-start;gap:8px;}
    .score-hero{padding:8px 16px 10px;min-width:0;border-radius:var(--r-md);}
    .score-hero .sh-label{font-size:12px;letter-spacing:1px;gap:5px;}
    .score-hero .sh-label .ico{width:15px;height:15px;}
    .score-hero .sh-num{font-size:42px;}
    .chip{padding:7px 14px;font-size:14px;gap:7px;align-self:stretch;}
    .chip .ico{width:16px;height:16px;}
    .chip .val{font-size:18px;min-width:18px;}
    .timer-hero{top:calc(10px + var(--app-safe-top,0px));right:max(10px,var(--app-safe-right,0px));padding:8px 16px 10px;min-width:0;border-radius:var(--r-md);}
    .timer-hero .th-label{font-size:12px;letter-spacing:1px;gap:5px;}
    .timer-hero .th-label .ico{width:15px;height:15px;}
    .timer-hero .th-num{font-size:40px;}

    /* 判定飘字:150px 在手机上会撑满屏,收到可读且有冲击的尺寸 */
    .floater .big{font-size:84px;}
    .floater .sub{font-size:20px;}

    /* 光球 + 准星:整体缩一档,给窄屏留活动空间 */
    .dodge-orb{width:100px;height:100px;}
    .orb-core{width:78px;height:78px;}
    .orb-core .arrow{font-size:38px;}
    .orb-timer .ot-track,.orb-timer .ot-prog{stroke-width:9;}
    .dodge-orb .tag{font-size:13px;bottom:-26px;padding:2px 9px;}
    #reticle{width:56px;height:56px;}

    /* 右下真人小窗:缩小并避开底部安全区 */
    .you-cam{
      width:118px;height:90px;
      bottom:max(12px,var(--app-safe-bottom,0px));
      right:max(12px,var(--app-safe-right,0px));
      border-width:2px;
    }

    /* 3 秒倒计时数字 */
    .countdown .cd-num{font-size:96px;}
    .countdown .cd-num.go{font-size:64px;letter-spacing:4px;}

    /* ---- 开场 / 结算浮层:可滚动 + 元素收小,防止被裁切 ---- */
    .overlay{padding:20px 16px;gap:12px;overflow-y:auto;justify-content:flex-start;}
    #intro{padding-top:calc(28px + var(--app-safe-top,0px));padding-bottom:calc(24px + var(--app-safe-bottom,0px));}
    .big-title{font-size:40px;}
    .subtitle{font-size:14px;line-height:1.6;}
    .how-grid{gap:10px;}
    .how-item{min-width:0;flex:1 1 40%;padding:14px 10px;gap:6px;}
    .how-item .arrow{font-size:34px;}
    .how-item .lb{font-size:15px;}
    .how-item .sub2{font-size:12px;}
    .btn{padding:14px 32px;font-size:16px;}
    .btn-report{padding:14px 32px;font-size:16px;}

    /* 结算:统计卡与按钮改成不超过视口宽,数字收小 */
    #result{padding-top:calc(24px + var(--app-safe-top,0px));padding-bottom:calc(24px + var(--app-safe-bottom,0px));}
    .result-card{padding:20px 22px;gap:12px;}
    .result-stat{gap:20px;}
    .result-stat .num{font-size:34px;}
    #result .btn,#result .btn-report{width:min(300px,84vw);}
    #result .btn{margin-top:20px;}
    .res-verdict{font-size:17px;}
    .res-stars svg{width:26px;height:26px;}
    .flame-stage{width:96px;height:104px;}
    .flame{width:62px;height:76px;}
    .streak-days{font-size:17px;}
    .streak-days .big{font-size:23px;}
    .feel-row{gap:6px;}
    .feel-btn{padding:6px 10px;}
    .feel-btn .em{font-size:20px;}
  }

  /* 小屏手机(≤380px):再收一档,顶部三块进一步瘦身 */
  @media (max-width: 380px){
    .aq-chip{width:34px;height:34px;font-size:18px;border-radius:9px;}
    .action-queue{gap:5px;padding:7px 10px;}
    .score-hero .sh-num{font-size:36px;}
    .timer-hero .th-num{font-size:34px;}
    .score-hero,.timer-hero{padding:7px 12px 9px;}
    .score-hero .sh-label,.timer-hero .th-label{font-size:11px;letter-spacing:.5px;gap:4px;}
    .floater .big{font-size:68px;}
    .how-item .arrow{font-size:30px;}
    .btn,.btn-report{padding:13px 24px;font-size:15px;letter-spacing:1px;}
  }
</style>
<link rel="stylesheet" href="styles/tokens.css">

</head>
<body>
<div id="app">

  <!-- 线性 SVG 图标库 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
    <symbol id="i-dodge" viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M12 9v7M12 11l-5 3M12 11l5 3M12 16l-3 5M12 16l3 5"/></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 3c1 3-1 4-1 6a3 3 0 0 0 3 3c1-1 1-2 1-3 2 2 3 4 3 6a6 6 0 1 1-12 0c0-3 2-5 3-7 .8 1 1 2 3 2z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></symbol>
    <symbol id="i-boxglove" viewBox="0 0 24 24"><path d="M7 11V7a3 3 0 0 1 6 0v3M13 8h2a3 3 0 0 1 3 3v3a5 5 0 0 1-5 5H9a4 4 0 0 1-4-4v-3a2 2 0 0 1 2-2M6 16h7"/></symbol>
    <symbol id="i-body-dodge" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M12 7.5v6M12 9l-4 2M12 9l4 2M12 13.5l-3 5M12 13.5l3 5"/></symbol>
  </svg>

  <!-- 底层视频 -->
  <video id="bgvid" src="img/boxing.mp4" muted loop playsinline></video>
  <div class="vignette"></div>

  <!-- HUD -->
  <!-- 顶部动作队列:预告+当前+汇总三合一,替代标题(主旨「不低头」信息全上移) -->
  <div class="action-queue glass" id="actionQueue"></div>
  <!-- 左上英雄:大号分数(信息当主角);连击作副信息 -->
  <div class="hud-left">
    <div class="score-hero glass">
      <span class="sh-label"><svg class="ico"><use href="#i-dodge"/></svg>闪避</span>
      <span class="sh-num" id="scoreVal">0</span>
    </div>
    <div class="chip combo-chip glass" id="comboChip"><svg class="ico"><use href="#i-fire"/></svg><span class="lb">连击</span><span class="val" id="comboVal">0</span></div>
  </div>
  <!-- 右上英雄:大号倒计时 -->
  <div class="timer-hero glass" id="timerHero">
    <span class="th-label"><svg class="ico"><use href="#i-boxglove"/></svg>剩余</span>
    <span class="th-num" id="timerVal">0:40</span>
  </div>

  <!-- 闪避光球场:四方位光球 + 逼近缩圈 + 头部准星 -->
  <div class="orb-field" id="orbField">
    <div id="reticle" class="lost">
      <div class="ret-ring"></div>
      <div class="ret-cross h"></div>
      <div class="ret-cross v"></div>
      <div class="ret-dot"></div>
    </div>
  </div>

  <!-- 右下角 · 真人点阵脸小窗 -->
  <div class="you-cam" data-mask>
    <video autoplay playsinline muted></video>
    <canvas class="you-mesh" width="336" height="252"></canvas>
    <div class="you-label"><span class="you-dot"></span>YOU</div>
  </div>

  <!-- 开场 -->
  <div class="overlay" id="intro">
    <div class="brand"><svg class="ico"><use href="#i-flag"/></svg>JOY · 拳击派对</div>
    <div class="big-title">拳击派对</div>
    <div class="subtitle">Joy 会挥拳过来，你用<b>头部动作</b>躲开<br>转头、抬头、收下巴——40 秒的舒缓颈椎训练</div>
    <div class="how-grid">

<script type="module">

import { track } from "./js/telemetry.js";

const vid=document.getElementById('bgvid');

let dodges=0, combo=0, maxCombo=0, playing=false;
let gameMs=0;            // 本局总时长(倒计时基准)
let timers=[];
function T(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id;}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

const PUNCH_MS=4300;      // 每拳间隔 4.3s（配合视频 0.7 倍速，3000/0.7≈4300）
const TOTAL_PUNCHES=10;   // 演示 10 拳

// 头姿轴向 —— 实测结论,勿改(与 mock-joy-boxing.html 一致)
// 应用 AX 后约定: yaw<0=向左转 / pitch<0=抬头 / pitch>0=收下巴 / roll<0=向左倾 / roll>0=向右倾
const AX = { yaw:-1, pitch:1, roll:1 };
const SMOOTH = 0.35;
// 判定阈值(颈椎训练:轻微舒服的头动就该达标,不该靠极限扭头)
const JUDGE = {
  windowPerfect: 500,   // ±500ms 内到位 = Perfect
  windowGood: 1000,     // ±1000ms = Good;超时 = Miss
  angleGood: 7,         // ≥7° = Good(轻偏头即达标)
  anglePerfect: 11,     // ≥11° = Perfect
  angleMax: 28,         // >28° = Miss(过头护栏,别真扭断)
};
const VEL_SPIKE = 14;   // 度/帧 = 甩头护栏(略放宽,避免正常动作误判)

// 四方位闪避 → 期望头姿轴向。cueX/cueY = 光球位置(球摆在头要去的方向)
// tag = 内核小标签;箭头 = 头往哪动;头偏对方向→该球变绿锁定
const PUNCHES=[
  {name:'左钩拳',dodge:'头向左倾',dir:'left', cue:'◀',tag:'左倾',cueX:15,cueY:50,expect:'roll-', key:'ArrowLeft'},
  {name:'右钩拳',dodge:'头向右倾',dir:'right',cue:'▶',tag:'右倾',cueX:85,cueY:50,expect:'roll+', key:'ArrowRight'},
  {name:'下勾拳',dodge:'抬起头',  dir:'up',   cue:'▲',tag:'抬头',cueX:50,cueY:13,expect:'pitch-',key:'ArrowUp'},
  {name:'上勾拳',dodge:'收下巴',  dir:'down', cue:'▼',tag:'收下巴',cueX:50,cueY:84,expect:'pitch+',key:'ArrowDown'},
];

// URL 实时旋钮(真机标定用):?kx=&ky=&lock=&dead=
const _q=new URLSearchParams(location.search);
const _num=(k,d)=>{ const v=parseFloat(_q.get(k)); return isFinite(v)?v:d; };

// ===== 头部准星:头姿角度 → 屏幕百分比偏移(显示运动幅度)=====
// 治抖三招:①强平滑(慢跟随)②静止死区(小于阈值当没动)③无脸归中
const RETICLE={
  kx:_num('kx',5.0), ky:_num('ky',3.8),     // 灵敏度:角度→屏幕%(x 提高,让转同样的头准星移得更远,够得到远处的球)
  maxX:46, maxY:40,                          // 最大偏移(x 留余量,远球在 15/85,准星能到 4/96 才好锁)
  smooth:_num('sm',0.18),                    // 平滑系数:越小越稳(治拖影/抖动的主开关)
  dead:_num('dead',1.5),                     // 静止死区(度):小于此角度视为没动,准星回中
  lockRadius:_num('lock',19),                // 准星距球心多近算对准(%)——放宽,不用精准压中远球
};
let reticlePos={ x:50, y:50 };              // 准星当前屏幕百分比(50,50=中心)

// ===== 头姿检测桥接(内核 → 游戏侧,每帧 syncPose 刷新)=====
let kernel=null, camOK=false;
let pose={ facePresent:false, haveMatrix:false, rel:{yaw:0,pitch:0,roll:0}, angle:{yaw:0,pitch:0,roll:0}, landmarks:null };
let prevRel={ yaw:0, pitch:0, roll:0 };
let angleVel=0;
let facePresent=false, latestLandmarks=null;
function syncPose(p){
  if(!p) return;
  pose=p; facePresent=p.facePresent; latestLandmarks=p.landmarks;
}
function relAngle(){ return pose.rel; }
function axisValue(rel,expect){
  if(expect==='roll+')  return  rel.roll;
  if(expect==='roll-')  return -rel.roll;
  if(expect==='pitch+') return  rel.pitch;
  if(expect==='pitch-') return -rel.pitch;
  return 0;
}
const DEBUG = location.search.indexOf('debug=1')>=0;
if(DEBUG && dbgAngle) dbgAngle.style.display='block';

// ---- 右下角点阵头 mesh:每帧把 MediaPipe 478 landmarks 画成金色点云(搬自老拳击版)----
const faceMeshCanvas=document.querySelector('.you-cam .you-mesh');
const faceMeshCtx=faceMeshCanvas?faceMeshCanvas.getContext('2d'):null;
const FACE_MESH_TRIS=[
  [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109,10],
  [70,63,105,66,107],
  [336,296,334,293,300],
  [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246,33],
  [263,249,390,373,374,380,381,382,362,398,384,385,386,387,388,466,263],
  [168,6,197,195,5,4],
  [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185,61],
];
const MASK_MODE = (location.search.indexOf('mesh=1')<0);   // 默认 Joy 面具;?mesh=1 强制点阵调试
function drawFaceMesh(){
  if(!faceMeshCtx||!faceMeshCanvas) return;
  const w=faceMeshCanvas.width, h=faceMeshCanvas.height;
  const camBox=faceMeshCanvas.closest('.you-cam');
  const maskMode=(!camBox || camBox.dataset.faceMode!=='mesh') && MASK_MODE;
  faceMeshCtx.clearRect(0,0,w,h);
  if(!facePresent||!latestLandmarks||latestLandmarks.length===0){
    if(!maskMode){
      faceMeshCtx.fillStyle='rgba(255,204,0,0.03)'; faceMeshCtx.fillRect(0,0,w,h);
      faceMeshCtx.fillStyle='rgba(255,204,0,0.35)';
      faceMeshCtx.font='11px -apple-system, sans-serif';
      faceMeshCtx.textAlign='center';
      faceMeshCtx.fillText(camOK?'SEARCHING…':'键盘模式 ←→↑↓',w/2,h/2);
    }
    return;
  }
  if(maskMode){ if(window.JoyMask) JoyMask.draw(faceMeshCtx, latestLandmarks, w, h); return; }
  const project=p=>({ x:(1-p.x)*w, y:p.y*h });   // 镜像 x,与用户视觉一致
  faceMeshCtx.fillStyle='rgba(255,204,0,0.03)'; faceMeshCtx.fillRect(0,0,w,h);
  faceMeshCtx.fillStyle='rgba(255,204,0,0.55)';
  for(let i=0;i<latestLandmarks.length;i++){ const p=project(latestLandmarks[i]); faceMeshCtx.fillRect(p.x-0.5,p.y-0.5,1.4,1.4); }
  faceMeshCtx.strokeStyle='rgba(255,230,120,0.9)'; faceMeshCtx.lineWidth=1;
  for(const path of FACE_MESH_TRIS){
    faceMeshCtx.beginPath();
    for(let i=0;i<path.length;i++){ const idx=path[i]; if(idx>=latestLandmarks.length)continue; const p=project(latestLandmarks[idx]); i?faceMeshCtx.lineTo(p.x,p.y):faceMeshCtx.moveTo(p.x,p.y); }
    faceMeshCtx.stroke();
  }
  faceMeshCtx.fillStyle='rgba(255,255,255,0.95)';
  for(const idx of [1,33,263]){ if(idx>=latestLandmarks.length)continue; const p=project(latestLandmarks[idx]); faceMeshCtx.beginPath(); faceMeshCtx.arc(p.x,p.y,1.8,0,Math.PI*2); faceMeshCtx.fill(); }
}

function showToast(txt,dur=2200){
  toast.innerHTML=`<svg class="ico"><use href="#i-boxglove"/></svg>${txt}`;toast.classList.add('show');
  T(()=>toast.classList.remove('show'),dur);

// ===== 光球场:生成/命中/清理 =====
function clearOrbs(){ if(orbField) orbField.querySelectorAll('.dodge-orb,.shockwave').forEach(el=>el.remove()); }

// ===== 汇总层:一拳一点 =====
// 顶部动作队列:一拳一个 chip,显示方向箭头。预告态/当前高亮/判定后三态染色三合一
function buildQueue(){
  if(!actionQueue) return;
  actionQueue.innerHTML='';
  for(let i=0;i<TOTAL_PUNCHES;i++){
    const p=PUNCHES[i%PUNCHES.length];
    const c=document.createElement('div');
    c.className='aq-chip upcoming';
    c.textContent=p.cue;   // 方向箭头 ◀▶▲▼
    actionQueue.appendChild(c);
  }
}
// 当前拳高亮(其余保持各自态)
function setActiveChip(idx){
  if(!actionQueue) return;
  [...actionQueue.children].forEach((c,i)=>{
    if(c.classList.contains('perfect')||c.classList.contains('good')||c.classList.contains('miss')) return;
    c.classList.toggle('active', i===idx);
    c.classList.toggle('upcoming', i!==idx);
  });
}
// 判定后给该 chip 染三态色
function markChip(idx,kind){
  if(!actionQueue) return;
  const c=actionQueue.children[idx];
  if(c) c.className='aq-chip '+kind;
}

// 在 appearAt 生成光球:白色径向读秒环从满被"吃"到空(缩到 0 那刻 = hitTime 最佳躲避点)
const ORB_R=71, ORB_C=2*Math.PI*ORB_R;   // 读秒环半径/周长(viewBox 150 映射进 .dodge-orb 126px,环贴合金币核)
function spawnOrb(beat){
  if(!orbField) return;
  const orb=document.createElement('div');
  orb.className='dodge-orb active';
  orb.style.left=beat.cueX+'%';
  orb.style.top=beat.cueY+'%';
  orb.innerHTML=`<div class="hit-zone"></div>`+
    `<svg class="orb-timer" viewBox="0 0 150 150">`+
      `<circle class="ot-track" cx="75" cy="75" r="${ORB_R}"/>`+
      `<circle class="ot-prog" cx="75" cy="75" r="${ORB_R}" stroke-dasharray="${ORB_C}" stroke-dashoffset="0"/>`+
    `</svg>`+
    `<div class="orb-core"><span class="arrow">${beat.cue}</span></div>`+
    `<div class="tag">${beat.tag}</div>`;
  orbField.appendChild(orb);
  beat._orb=orb;
  setActiveChip(beat.idx);   // 顶部队列高亮当前拳
  // 径向读秒:appear → hit 期间白弧线性从满(offset 0)吃到空(offset=周长)
  const dur=Math.max(300, beat.hitTime-(performance.now()-sessionStart));
  const prog=orb.querySelector('.ot-prog');
  prog.animate(
    [{strokeDashoffset:'0'},{strokeDashoffset:String(ORB_C)}],
    {duration:dur,easing:'linear',fill:'forwards'}
  );
}

// 判定后把结果砸在对应光球上:变色 + 弹跳/抖 + 戳记 + 冲击波
function stampOrb(beat,kind){
  const orb=beat._orb;
  if(!orb) return;
  orb.classList.remove('active');
  orb.classList.add('hit-'+kind);
  if(kind!=='miss') spawnShockwave(beat.cueX, beat.cueY, kind);
  T(()=>{ orb.style.transition='opacity .4s'; orb.style.opacity='0'; }, 550);
  T(()=>orb.remove(), 1000);
}

function spawnShockwave(xPct,yPct,kind){
  if(!orbField) return;
  const sw=document.createElement('div');
  sw.className='shockwave '+kind;
  sw.style.left=xPct+'%'; sw.style.top=yPct+'%';
  orbField.appendChild(sw);
  T(()=>sw.remove(),520);
}

// ===== 运行时状态 =====
let beats=[];            // 本局 10 拳的判定状态
let resolvedCount=0;     // 已判定拳数(进度条按此推进)
let sessionStart=0;      // 本局起点(beat.hitTime 相对它)

// ===== 判定核心(搬自 mock-joy-boxing.html)=====
function tickJudge(now){
  const t=now-sessionStart;
  const rel=relAngle();
  for(const beat of beats){
    if(beat._judged) continue;
    const dt=t-beat.hitTime;
    if(dt < -JUDGE.windowGood) continue;                 // 未进窗
    if(dt >  JUDGE.windowGood){ beat._reason='timeout'; resolve(beat,'miss'); continue; }  // 超时
    // 摄像头未就绪 / 无脸:交给键盘或超时,不做角度判定
    if(!camOK || !facePresent) continue;

    const signedAngle=axisValue(rel,beat.expect);
    beat._maxAngleSeen=Math.max(beat._maxAngleSeen||0,signedAngle);
    beat._peakVel=Math.max(beat._peakVel||0,angleVel);

    // 护栏一:过头(医学安全,别拧断脖子)
    if(signedAngle>JUDGE.angleMax){ beat._reason='over-rotation'; resolve(beat,'miss'); continue; }
    // 护栏二:甩头
    if(beat._peakVel>VEL_SPIKE && signedAngle>JUDGE.angleGood*0.7){ beat._reason='whiplash'; resolve(beat,'miss'); continue; }
    // 达标
    if(signedAngle>=JUDGE.angleGood){
      const inPerfectWin=Math.abs(dt)<=JUDGE.windowPerfect;
      const isPerfectAngle=signedAngle>=JUDGE.anglePerfect && signedAngle<=JUDGE.angleMax;
      resolve(beat,(inPerfectWin && isPerfectAngle)?'perfect':'good');
    }
  }
}

function resolve(beat,kind){
  if(beat._judged) return;
  beat._judged=kind;
  resolvedCount++;
  if(kind==='perfect'||kind==='good'){
    dodges++; combo++; maxCombo=Math.max(maxCombo,combo);
    scoreVal.textContent=dodges; comboVal.textContent=combo;
    // 分数跳一下(击中反馈,当英雄元素)
    scoreVal.classList.remove('bump'); void scoreVal.offsetWidth; scoreVal.classList.add('bump');
    comboChip.classList.toggle('hot', combo>=3);   // 连击≥3 点亮金框
    floatBig(kind==='perfect'?'PERFECT':'GOOD','完美闪避 · '+beat.dodge);
  } else {
    // 治愈不惩罚:只断连击,不扣闪避数
    combo=0; comboVal.textContent=0; comboChip.classList.remove('hot');
    if(beat._reason==='over-rotation' || beat._reason==='whiplash'){ beat._soft='轻一点'; floatBig('轻一点','慢慢躲 · 别甩头'); }
    else{ beat._soft='慢慢来'; floatBig('跟上','没关系 · 下一拳再来'); }
  }
  stampOrb(beat,kind);
  markChip(beat.idx,kind);
}

// 键盘兜底:按对应方向键 = 手动躲对当前活跃拳(走同一判定入口)
function keyDodge(code){
  if(!playing) return;
  const t=performance.now()-sessionStart;
  let best=null, bestAbs=Infinity;
  for(const beat of beats){
    if(beat._judged || beat.key!==code) continue;
    const d=Math.abs(t-beat.hitTime);
    if(d<=JUDGE.windowGood && d<bestAbs){ best=beat; bestAbs=d; }
  }
  if(best) resolve(best, bestAbs<=JUDGE.windowPerfect?'perfect':'good');
}

// 头部准星:显示玩家运动幅度。治抖=死区+强平滑;无脸/键盘态归中淡化
function updateReticle(){
  if(!reticle) return;
  const rel=relAngle();
  const live = camOK && facePresent;
  if(!live){
    // 归中(慢慢回),淡化
    reticlePos.x += (50-reticlePos.x)*0.15;
    reticlePos.y += (50-reticlePos.y)*0.15;
    reticle.classList.add('lost'); reticle.classList.remove('locked');
    applyReticleTransform();
    for(const b of beats){ if(b._orb) b._orb.classList.remove('locked'); }
    return;
  }
  reticle.classList.remove('lost');
  // 静止死区:角度小于 dead 视为没动(消除 MediaPipe 每帧噪声导致的抖)
  const dz=v=>Math.abs(v)<RETICLE.dead ? 0 : v;
  // roll<0 左倾→左移 / roll>0 右倾→右移;pitch<0 抬头→上移(球在上) / pitch>0 收下巴→下移(球在下)
  const tx=clamp(50 + dz(rel.roll)*RETICLE.kx, 50-RETICLE.maxX, 50+RETICLE.maxX);
  const ty=clamp(50 + dz(rel.pitch)*RETICLE.ky, 50-RETICLE.maxY, 50+RETICLE.maxY);
  // 强平滑:慢跟随,消拖影抖动
  reticlePos.x += (tx-reticlePos.x)*RETICLE.smooth;
  reticlePos.y += (ty-reticlePos.y)*RETICLE.smooth;
  applyReticleTransform();
  // 对准:准星落在活跃球命中范围内 → 双方变绿(用屏幕距离判断锁定视觉,真判定另走 tickJudge)
  let lockedAny=false;
  for(const b of beats){
    if(!b._orb || b._judged) continue;
    const near=Math.hypot(reticlePos.x-b.cueX, reticlePos.y-b.cueY) <= RETICLE.lockRadius;
    b._orb.classList.toggle('locked', near);
    if(near) lockedAny=true;
  }
  reticle.classList.toggle('locked', lockedAny);
}
function applyReticleTransform(){
  const fw=orbField.clientWidth||window.innerWidth, fh=orbField.clientHeight||window.innerHeight;
  const px=(reticlePos.x-50)/100*fw, py=(reticlePos.y-50)/100*fh;
  reticle.style.transform=`translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
}

// 主循环:每帧刷新头姿 + 画点阵头 + 跑判定(全程常驻)
function loop(now){
  requestAnimationFrame(loop);
  now=now||performance.now();
  if(kernel && kernel.ready()){
    syncPose(kernel.tick(now));
    const rel=relAngle();
    angleVel=Math.max(Math.abs(rel.yaw-prevRel.yaw),Math.abs(rel.pitch-prevRel.pitch),Math.abs(rel.roll-prevRel.roll));
    prevRel={...rel};
  }
  drawFaceMesh();
  updateReticle();
  if(playing){ tickJudge(now); updateTimer(gameMs-(now-sessionStart)); }
  if(DEBUG && dbgAngle){
    const rel=relAngle();
    dbgAngle.textContent=`roll:${rel.roll.toFixed(0)}° pitch:${rel.pitch.toFixed(0)}° yaw:${rel.yaw.toFixed(0)}° vel:${angleVel.toFixed(1)} face:${facePresent?1:0} ret:${reticlePos.x.toFixed(0)},${reticlePos.y.toFixed(0)}`;
  }
}
requestAnimationFrame(loop);

function runShow(){
  playing=true;
  dodges=0;combo=0;maxCombo=0;resolvedCount=0;
  scoreVal.textContent=0;comboVal.textContent=0;
  comboChip.classList.remove('hot');
  scoreVal.classList.remove('bump');
  timerHero.classList.remove('ending');
  clearOrbs();
  buildQueue();

  showToast(camOK?'看读秒环缩满,到位就躲':'摄像头没就绪 · 用方向键 ←→↑↓ 躲',2600);

  sessionStart=performance.now();
  const clock=1600;
  gameMs=clock+TOTAL_PUNCHES*PUNCH_MS+800;   // 本局总时长 → 倒计时基准
  updateTimer(gameMs);
  beats=[];
  for(let i=0;i<TOTAL_PUNCHES;i++){
    const p=PUNCHES[i%PUNCHES.length];
    const appearAt=clock+i*PUNCH_MS;
    const hitTime=appearAt+PUNCH_MS*0.5;      // 拳出现 ~2.15s 后是最佳躲避时刻
    const beat={ ...p, idx:i, hitTime, _judged:null, _reason:null, _maxAngleSeen:0, _peakVel:0, _orb:null };
    beats.push(beat);
    T(()=>spawnOrb(beat), appearAt);
  }
  T(endShow, gameMs);
}

// 倒计时显示:剩余毫秒 → M:SS,最后 10 秒转暖金提醒(不闪红,守治愈基调)
function updateTimer(remainMs){
  const s=Math.max(0,Math.ceil(remainMs/1000));
  timerVal.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  timerHero.classList.toggle('ending', s<=10);
}


/* ============ 结算页 streak 火苗 +1(数据出现后延迟触发) ============ */
function playStreakFlame(){
  const win=document.getElementById('streakWin');
  if(!win) return;
  win.querySelectorAll('.flame,.flame-plus,.flame-spark,.streak-days,.streak-sub').forEach(el=>{
    el.style.animation='none';void el.offsetWidth;el.style.animation='';
  });
  win.classList.add('go');
}

/* ============ 本局评级(完美闪避比例 → 星星数 + 判语) ============ */
const RANK_TABLE = [
  { min:0.9,  stars:3, verdict:'烦恼全被打飞' },
  { min:0.6,  stars:3, verdict:'打飞了大半烦恼' },
  { min:0.3,  stars:2, verdict:'还有几拳没接住' },
  { min:0,    stars:1, verdict:'先热个身也不错' },
];
function gradeRun(){
  const ratio = TOTAL_PUNCHES ? dodges/TOTAL_PUNCHES : 0;
  return RANK_TABLE.find(t=>ratio>=t.min) || RANK_TABLE[RANK_TABLE.length-1];
}
function pickFeel(el){
  document.querySelectorAll('.feel-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}
window.pickFeel = pickFeel;

function endShow(){
  playing=false;
  if(kernel) kernel.stopCamera();   // 隐私红线:关卡结束立即释放摄像头
  camOK=false; facePresent=false; latestLandmarks=null;
  clearOrbs();
  document.getElementById('rDodge').textContent=dodges;
  document.getElementById('rCombo').textContent=maxCombo;

  // 判语 + 星级:按完美闪避比例点亮
  const g = gradeRun();
  document.getElementById('rVerdict').textContent = g.verdict;
  document.querySelectorAll('#resStars svg').forEach((s,i)=>{
    s.classList.remove('lit','dim');
    s.classList.add(i<g.stars ? 'lit' : 'dim');
  });

  // 试点埋点:一局完成(用于算游玩次数/留存)
  track('level_finish', { level:'boxing', dodges, combo:maxCombo, stars:g.stars });

  result.classList.remove('hide');
  setTimeout(playStreakFlame,800);   // 数据出现后再点燃火苗
}


/* ============ 3秒倒计时(三关统一) ============ */
function runCountdown(done){
  const cd=document.getElementById('countdown');
  const cdNum=document.getElementById('cdNum');
  cd.classList.remove('hide');
  let n=3;
  (function step(){
    if(n>0){ cdNum.textContent=n; cdNum.className='cd-num cd-pop'; }
    else{ cdNum.textContent='GO!'; cdNum.className='cd-num go cd-pop'; }
    void cdNum.offsetWidth;
    if(n>=0){ n--; setTimeout(step,1000); }
    else{ cd.classList.add('hide'); done&&done(); }
  })();
}

// 点「开始」:立刻进入真实游戏画面,浮动作提示 3 秒,期间并行加载摄像头,然后倒计时开打
async function start(){
  intro.classList.add('hide');
  result.classList.add('hide');
  clearTimers();
  clearOrbs();
  vid.currentTime=0;
  vid.playbackRate=0.7;    // 放慢到 0.7 倍速
  vid.play().catch(()=>{});

  // 真实游戏画面上浮动作提示浮层,6 秒后自动进倒计时
  showHowtoThenCountdown();

  // 并行:唤起摄像头 + 头姿检测(失败则降级为纯键盘,不阻断游戏)——不阻塞提示浮层
  camOK=false;
  const statusEl=document.querySelector('#intro .status');
  try{
    if(!kernel){
      kernel=createPoseKernel({ video:document.querySelector('.you-cam video'), axis:AX, smooth:SMOOTH });
      await kernel.loadModel(txt=>{ if(statusEl && txt) statusEl.textContent=txt; });
    }
    await kernel.startCamera();
    kernel.beginCalibration();          // 用提示浮层+倒计时这几秒采基线(坐直看屏幕)
    camOK=true;
  }catch(e){
    camOK=false;                        // 摄像头被拒/无设备 → 键盘兜底
  }
}

/* 动作提示浮层:显示 6 秒(重播演示动画),然后隐藏 → 倒计时 → 开打 */
let _howtoTimer=null;
function showHowtoThenCountdown(){
  const howto=document.getElementById('howto');
  howto.classList.remove('hide');
  const bar=howto.querySelector('.howto-timer i');
  if(bar){ bar.style.animation='none'; void bar.offsetWidth; bar.style.animation=''; }
  clearTimeout(_howtoTimer);
  _howtoTimer=setTimeout(()=>{
    howto.classList.add('hide');
    runCountdown(()=>{                     // 3 秒倒计时结束后:结束校准 → 开打
      if(camOK && kernel) kernel.endCalibration();
      prevRel={ yaw:0, pitch:0, roll:0 };
      runShow();
    });
  }, 6000);
}
document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('againBtn').addEventListener('click',start);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); start(); return; }
  if(e.code==='ArrowLeft'||e.code==='ArrowRight'||e.code==='ArrowUp'||e.code==='ArrowDown'){
    e.preventDefault(); keyDodge(e.code);
  }
});

if(location.search.indexOf('auto=1')>=0){ T(start,300); }
// end=1 调试入口:直接看结算页(满分演示,走 endShow 填判语+星星)
if(location.search.indexOf('end=1')>=0){
  intro.classList.add('hide'); intro.style.display='none';
  dodges=TOTAL_PUNCHES; maxCombo=TOTAL_PUNCHES;
  endShow();
  result.style.transition='none'; result.style.opacity='1';
}

</script>
