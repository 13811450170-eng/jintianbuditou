<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今天不低头 · 举臂摘星</title>
<style>
  :root {
    /* Doga 家族配色(沿用夜晚关) */
    --joy: #ea3323;
    --max: #5c6470;
    --chill: #f39c1f;
    --blink: #ff7a29;
    --yummy: #1f3fe6;
    --snow: #eb7fa8;

    /* 夜空 */
    --night-sky-top: #070b28;
    --night-sky-mid: #141a4a;
    --night-sky-bot: #2e2a5e;

    /* 海面 */
    --sea-far: #16305a;
    --sea-near: #0d1e3d;

    --gold: #ffd66b;
    --gold-bright: #ffe89b;
    --star-glow: #cad6ff;

    /* ===== 关卡 HUD 设计系统 v1 · 摘星皮肤(深蓝金) ===== */
    --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --fs-display:56px; --fs-num:44px;
    --glass-blur:14px;
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.18);
    --shadow-1:0 2px 8px rgba(0,0,0,.18);
    --shadow-2:0 8px 24px rgba(0,0,0,.28);
    --ok:#6bff9d;
    --brand:#7c86ff;
    --brand-deep:#141a4a;
    --glass-bg:rgba(12,16,44,.5);
    --overlay-bg:radial-gradient(circle at 50% 42%, rgba(26,32,86,.76), rgba(5,6,20,.95));
    --title-txt:#0a1030;

    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html, body {
    height:100%; overflow:hidden;
    font-family:var(--font); color:#e8ecf5;
    background:#04030f;
  }

  /* ==================== 舞台 ==================== */
  #stage {
    position: fixed; inset: 0;
    overflow: hidden;
    background: #04030f;
  }
  /* 视频底层:六只狗蹦跳欢呼(星星烟花由代码层生成) */
  #bgvid {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
  }
  /* 庆祝脉冲:整场景轻微放大回弹 + 一层暖光泛起 */
  #stage.celebrate { animation: stagePulse .7s ease-out; }
  @keyframes stagePulse {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.012); }
    100% { transform: scale(1); }
  }
  #stage.celebrate::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse 60% 40% at 50% 42%, rgba(255,220,150,.16), transparent 70%);
    animation: celebGlow .7s ease-out;
  }
  @keyframes celebGlow{ 0%{opacity:0;} 35%{opacity:1;} 100%{opacity:0;} }

  /* 举臂保持中:整场景泛起一层柔和暖光(判定同源的"做对了"氛围) */
  #stage.reaching::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
    background: radial-gradient(ellipse 70% 50% at 50% 34%, rgba(255,220,150,.14), transparent 72%);
    animation: reachGlow .5s ease-out forwards;
  }
  @keyframes reachGlow{ from{opacity:0;} to{opacity:1;} }

  /* 银河 / 星云带 */
  .galaxy {
    position:absolute;
    top: 4%; left: 50%;
    width: 120%; height: 44%;
    transform: translateX(-50%) rotate(-14deg);
    background:
      radial-gradient(ellipse 60% 40% at 40% 50%, rgba(150,130,255,.16), transparent 70%),
      radial-gradient(ellipse 50% 30% at 65% 45%, rgba(120,180,255,.12), transparent 70%);
    filter: blur(6px);
    pointer-events:none;
    z-index:1;
  }

  /* 背景星点 */
  .star-static {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
    pointer-events: none;
    filter: blur(0.3px);
    z-index:1;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.45; transform: scale(1); }
    50%     { opacity: 1;   transform: scale(1.25); }
  }

  /* 月亮 */
  .moon {
    position: absolute;
    top: 7%; right: 11%;
    width: 84px; height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fffce0 0%, #e6e0bc 60%, rgba(216,212,176,0) 84%);
    box-shadow: 0 0 46px rgba(255,232,155,.42), 0 0 96px rgba(255,232,155,.2);
    z-index: 2;
  }
  .moon::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 62% 66%, rgba(200,195,160,.5), transparent 42%),
               radial-gradient(circle at 44% 40%, rgba(200,195,160,.35), transparent 30%);
    opacity:.5;
  }

  /* ==================== 海面 ==================== */
  .sea {
    position:absolute;
    left:0; right:0;
    top: 52%; height: 20%;
    background: linear-gradient(180deg, var(--sea-far) 0%, var(--sea-near) 100%);
    z-index:2;
    overflow:hidden;
  }
  /* 海平线微光 */
  .sea::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg, transparent, rgba(180,200,255,.5), transparent);
  }
  /* 月光在海面的反光柱 */
  .sea-glint{
    position:absolute;
    top:0; bottom:0;
    right: 12%;
    width: 90px;
    transform: translateX(50%);
    background: linear-gradient(180deg, rgba(255,240,180,.55), rgba(255,240,180,.06) 90%);
    filter: blur(3px);
    z-index:3;
    -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 3px, transparent 3px 8px);
            mask-image: repeating-linear-gradient(180deg, #000 0 3px, transparent 3px 8px);
    animation: glint 4s ease-in-out infinite;
  }
  @keyframes glint {
    0%,100% { opacity:.75; }
    50%     { opacity:1; }
  }

  /* ==================== 草丛栏(海堤上的草) ==================== */
  .grass-belt{
    position:absolute;
    left:0; right:0;
    top: 68%; height: 8%;
    z-index:5;
  }

  /* ==================== 堤道地面 ==================== */
  .promenade{
    position:absolute;
    left:0; right:0; bottom:0;
    height: 26%;
    background: linear-gradient(180deg, #2a2740 0%, #201d33 60%, #17142a 100%);
    z-index:6;
    box-shadow: 0 -10px 30px rgba(0,0,0,.45);
  }
  /* 堤道铺装横缝 */
  .promenade::before{
    content:"";position:absolute;inset:0;
    background: repeating-linear-gradient(90deg, transparent 0 78px, rgba(0,0,0,.28) 78px 80px);
    opacity:.6;
  }
  /* 堤道与草丛的护栏边 */
  .rail{
    position:absolute;
    left:0; right:0;
    top: 74.5%;
    height: 6px;
    background: linear-gradient(180deg, #4a4668, #2c2942);
    z-index:6;
  }

  /* ==================== HUD ==================== */
  /* 通用玻璃面:液态玻璃(通透+提色+边缘镜面光+顶部光泽) */
  .glass{
    position:relative;
    background:
      linear-gradient(135deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.03) 38%, rgba(255,255,255,.07) 100%),
      var(--glass-bg);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.45),
      inset 0 -10px 22px rgba(255,255,255,.04),
      var(--shadow-2);
    backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  }
  .glass::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    padding:1px;
    background:linear-gradient(135deg,
      rgba(255,255,255,.7) 0%, rgba(255,255,255,.08) 34%,
      rgba(255,255,255,0) 58%, rgba(255,255,255,.32) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }
  /* 线性 SVG 图标 */
  .ico{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  .hud-title {
    position: absolute;
    top: 18px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: var(--title-txt);
    padding: 10px 32px;
    border-radius: var(--r-pill);
    font-size: 18px; font-weight: 800;
    letter-spacing: 1.5px;
    box-shadow: var(--shadow-1);
    z-index: 40;
    display:flex;align-items:center;gap:10px;
  }
  .hud-title .ico{stroke:var(--title-txt);width:19px;height:19px;}
  .hud-chip{
    position:absolute; top:16px;
    display:flex; align-items:center; gap:10px;
    padding:11px 18px;
    border-radius:var(--r-pill);
    font-size:16px; font-weight:700;
    color:var(--gold-bright);
    z-index:40;
  }
  .hud-chip .ico{ width:19px;height:19px; }
  .hud-chip .lb{opacity:.9;}
  .hud-chip b{color:#fff;font-size:21px;font-weight:900;}
  #chipFw{ left:16px; }
  #chipDust{ left:16px; top:68px; }

  /* 星座图鉴卡 */
  .codex{
    position:absolute; top:16px; right:16px;
    width:172px;
    border-radius:var(--r-md);
    padding:15px 17px;
    z-index:40;
  }
  .codex h4{ font-size:12px; color:var(--gold-bright); letter-spacing:1px; margin-bottom:8px; font-weight:800;}
  .codex .count{ font-size:22px; font-weight:900; color:#fff; }
  .codex .count small{ font-size:12px; color:#9aa3c7; font-weight:700; }
  #codexSvg{ width:100%; height:64px; display:block; margin-top:4px; }

  /* ==================== 可摘星星 ==================== */
  .pick-star{
    position:absolute;
    width:38px; height:38px;
    transform: translate(-50%,-50%);
    z-index:8;
    pointer-events:none;
    animation: starBob 3.4s ease-in-out infinite;
  }
  @keyframes starBob{
    0%,100%{ transform: translate(-50%,-50%) translateY(0); }
    50%    { transform: translate(-50%,-50%) translateY(-8px); }
  }
  .pick-star svg{ width:100%; height:100%; overflow:visible; }
  .pick-star .halo{
    position:absolute; inset:-40%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,224,130,.55), transparent 68%);
    animation: haloPulse 2.2s ease-in-out infinite;
  }
  @keyframes haloPulse{
    0%,100%{ opacity:.6; transform:scale(1); }
    50%    { opacity:1;  transform:scale(1.18); }
  }
  /* 星星被"够到":光晕加速 */
  .pick-star.aiming{ animation: none; }
  .pick-star.aiming .halo{ animation: haloPulse 1s ease-in-out infinite; }
  /* 金色倒计时圈 */
  .aim-ring{
    position:absolute;
    width:78px; height:78px;
    transform: translate(-50%,-50%) rotate(-90deg);
    pointer-events:none;
    z-index:9;
  }
  .aim-ring circle{
    fill:none;
    stroke:var(--gold-bright);
    stroke-width:4;
    stroke-linecap:round;
    filter: drop-shadow(0 0 6px var(--gold));
    stroke-dasharray: 226;
    stroke-dashoffset: 226;
  }
  .aim-ring.run circle{ animation: ringFill 1.5s linear forwards; }
  @keyframes ringFill{ to { stroke-dashoffset: 0; } }

  /* ==================== 烟花(大绽放) ==================== */
  .firework {
    position: absolute;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 9;
    --burst: 30vmin;         /* 绽放半径,普通 */
    animation: fwFade 3.6s ease-out forwards;
  }
  @keyframes fwFade { 0%{opacity:0;} 5%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }
  /* 粒子:向外飞散并缓慢下坠 */
  .firework .particle {
    position: absolute; top: 0; left: 0;
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 12px 3px currentColor;
    animation: fwParticle 3.4s cubic-bezier(.12,.55,.25,1) forwards;
  }
  /* 亮核闪光 */
  .firework::before {
    content: ""; position: absolute; top: 0; left: 0;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.98) 0%, rgba(255,240,190,.55) 35%, transparent 70%);
    transform: translate(-50%, -50%);
    animation: fwCenter 1.1s ease-out forwards;
  }
  @keyframes fwCenter {
    0%{opacity:1;transform:translate(-50%,-50%) scale(.4);}
    55%{opacity:1;transform:translate(-50%,-50%) scale(1.5);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(2.6);}
  }
  @keyframes fwParticle {
    0%   {opacity:1; transform: rotate(var(--rot)) translateY(0) scale(1.3);}
    15%  {opacity:1; transform: rotate(var(--rot)) translateY(calc(var(--burst) * -0.85)) scale(1.1);}
    80%  {opacity:.9;}
    100% {opacity:0; transform: rotate(var(--rot)) translateY(calc(var(--burst) * -1)) translateX(8px) translateY(10px) scale(.4);}
  }
  /* 大烟花(双手高潮) */
  .firework.big{ --burst: 46vmin; }
  .firework.big::before{ width:140px; height:140px; }
  .firework.big .particle{ width:8px; height:8px; }

  /* ==================== Doga 家族群像 ==================== */
  .dogas-row {
    position: absolute;
    left: 0; right: 0;
    bottom: 5%;
    height: 34%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 1.6%;
    z-index: 15;
    pointer-events:none;
  }
  .doga {
    position: relative;
    transform-origin: 50% 100%;
    animation: dogaBreath 4s ease-in-out infinite;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.4));
  }
  .doga img{
    display:block;
    height:100%;
    width:auto;
    /* 背光夜景:整体压暗一点,融进夜色 */
    filter: brightness(.82) saturate(.92);
  }
  @keyframes dogaBreath {
    0%,100%{ transform: translateY(0) scale(1); }
    50%    { transform: translateY(-2px) scale(1.015); }
  }
  /* 庆祝:上跳 + 轻微放大(3D图自带举臂造型) */
  .doga.cheer { animation: dogaJump .7s ease-out; }
  @keyframes dogaJump {
    0%   { transform: translateY(0) scale(1) rotate(0deg); }
    30%  { transform: translateY(-30px) scale(1.08) rotate(-3deg); }
    55%  { transform: translateY(-6px) scale(1.03) rotate(2deg); }
    75%  { transform: translateY(-12px) scale(1.05) rotate(-1deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
  }
  .doga.cheer img{ filter: brightness(1) saturate(1); }
  /* 够星保持:整体上浮微晃(演示"举臂→保持"训练动作) */
  .doga.reach{ animation: reachSway 1.5s ease-in-out infinite; }
  .doga.reach img{ filter: brightness(1.05) saturate(1); }
  @keyframes reachSway{
    0%,100%{ transform: translateY(-4px) scale(1.02); }
    50%    { transform: translateY(-11px) scale(1.04); }
  }
  /* 头顶反应表情 */
  .doga .react{
    position:absolute; top:-10px; left:50%;
    transform:translateX(-50%) scale(0);
    font-size:24px;
    opacity:0;
    z-index:2;
  }
  .doga.cheer .react{ animation: reactPop .8s ease-out; }
  @keyframes reactPop{
    0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.4);}
    40%{opacity:1;transform:translateX(-50%) translateY(-8px) scale(1.1);}
    100%{opacity:0;transform:translateX(-50%) translateY(-22px) scale(.9);}
  }

  /* ==================== 右下角 · 真人点阵脸小窗(与拳击关统一) ==================== */
  .you-cam{
    position:absolute;bottom:5%;right:3%;z-index:30;
    width:168px;height:126px;
    border:3px solid #ffcc00;border-radius:12px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%,#0b0512 0%,#000 100%);
    box-shadow:0 0 22px rgba(255,204,0,.4),0 4px 20px rgba(0,0,0,.6);
  }
  .you-cam video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .you-cam .you-mesh{width:100%;height:100%;display:block;}
  .you-cam .you-label{
    position:absolute;top:8px;right:8px;
    display:flex;align-items:center;gap:5px;
    color:#ff4d5e;font-size:11px;font-weight:900;letter-spacing:2px;
    padding:3px 8px;background:rgba(0,0,0,.55);border-radius:5px;
  }
  .you-cam .you-dot{width:7px;height:7px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e;animation:dotBlink 1.2s infinite;}
  @keyframes dotBlink { 0%,100%{opacity:1;} 50%{opacity:.3;} }

  /* ==================== 举臂高度条(判定同源反馈) ==================== */
  .reach-meter{
    position:absolute;
    left:3.2%; top:50%; transform:translateY(-50%);
    width:58px; height:250px;
    z-index:38;
    border-radius:var(--r-pill);
    padding:12px 8px 10px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    opacity:0; transition:opacity .5s;
  }
  .reach-meter.show{ opacity:1; }
  .reach-meter .rm-top{ width:20px;height:20px;color:var(--gold-bright); }
  .reach-meter .rm-track{
    position:relative;
    flex:1; width:16px;
    border-radius:var(--r-pill);
    background:rgba(255,255,255,.10);
    overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.45);
  }
  .reach-meter .rm-fill{
    position:absolute; left:0; right:0; bottom:0; height:0%;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border-radius:var(--r-pill);
    transition:height .1s linear, background .2s, box-shadow .2s;
  }
  .reach-meter.reached .rm-fill{
    background:linear-gradient(180deg,#fff,var(--gold-bright));
    box-shadow:0 0 16px var(--gold);
  }
  /* 达标刻度线 */
  .reach-meter .rm-mark{
    position:absolute; left:-4px; right:-4px; height:2px;
    background:rgba(255,255,255,.55);
  }
  .reach-meter .rm-mark::after{
    content:""; position:absolute; right:-3px; top:-2px;
    border:3px solid transparent; border-right-color:var(--gold-bright);
  }
  .reach-meter .rm-cap{
    font-size:11px; font-weight:800; letter-spacing:.5px;
    color:rgba(255,255,255,.75); white-space:nowrap;
  }
  .reach-meter.reached .rm-cap{ color:var(--gold-bright); }

  /* 中部引导文案 */
  .coach-tip{
    position:absolute;
    top: 40%; left:50%; transform:translateX(-50%);
    color:var(--gold-bright);
    padding:11px 26px; border-radius:var(--r-pill);
    font-size:16px; font-weight:800; letter-spacing:.5px;
    z-index:38;
    white-space:nowrap;
    opacity:0;
    transition: opacity .5s;
    display:flex;align-items:center;gap:8px;
  }
  .coach-tip .ico{width:16px;height:16px;}

  /* ==================== 开场 / 结算 覆盖层 ==================== */
  .overlay{
    position:absolute;inset:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:16px;padding:24px;
    background:var(--overlay-bg);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .8s;
  }
  .overlay.hide{opacity:0;pointer-events:none;}
  .brand{
    border:1px solid var(--gold);color:var(--gold-bright);
    padding:6px 20px;border-radius:var(--r-pill);
    font-size:13px;font-weight:800;letter-spacing:3px;
    display:flex;align-items:center;gap:8px;
  }
  .brand .ico{width:15px;height:15px;}
  .big-title{
    font-size:var(--fs-display);font-weight:900;letter-spacing:2px;line-height:1.1;
    background:linear-gradient(135deg,#fff 0%,var(--gold-bright) 48%,var(--brand) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .subtitle{font-size:15px;color:rgba(255,255,255,.82);line-height:1.7;max-width:440px;}
  .subtitle b{color:var(--gold-bright);}
  .how-grid{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
  .how-item{
    background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);
    border-radius:var(--r-md);padding:22px 20px;min-width:150px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .how-item .ico{width:40px;height:40px;color:#fff;}
  .how-item .lb{font-size:17px;color:var(--gold-bright);font-weight:800;}
  .how-item .sub2{font-size:13px;color:rgba(255,255,255,.65);}
  .btn{
    margin-top:8px;border:none;cursor:pointer;
    background:var(--brand);
    color:#fff;padding:16px 46px;border-radius:var(--r-pill);
    font-size:18px;font-weight:900;letter-spacing:1.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .12s,filter .12s;
    display:inline-flex;align-items:center;gap:9px;
  }
  .btn .ico{stroke:#fff;}
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn-ghost{
    margin-top:2px;border:none;cursor:pointer;background:transparent;
    color:rgba(255,255,255,.6);font-family:var(--font);
    font-size:14px;font-weight:700;letter-spacing:.5px;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s;
  }
  .btn-ghost:hover{color:var(--gold-bright);}
  .btn-ghost .ico{width:15px;height:15px;stroke:currentColor;}
  .status{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;}

  /* 开场隐私提示 — 打消面部采集顾虑 */
  .privacy-note{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:14px;
    font-size:13px;color:rgba(255,255,255,.62);letter-spacing:.3px;
  }
  .privacy-note svg{width:15px;height:15px;color:#ffcc00;flex-shrink:0;}
  .privacy-note b{color:rgba(255,255,255,.9);font-weight:700;}
  .result-card{
    border-radius:var(--r-lg);padding:26px 34px;
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .result-stat{display:flex;gap:34px;}
  .result-stat .item{text-align:center;}
  .result-stat .num{font-size:var(--fs-num);font-weight:900;color:var(--gold-bright);line-height:1;}
  .result-stat .lb{font-size:13px;color:rgba(255,255,255,.75);margin-top:7px;}
  .result-up{font-size:14px;color:var(--ok);font-weight:700;display:flex;align-items:center;gap:6px;}
  .result-up .ico{width:15px;height:15px;stroke:var(--ok);}

  /* ---- 结算 · 判语 + 星级并排一行 ---- */
  #result{gap:10px;overflow-y:auto;}
  .res-verdict-row{display:flex;align-items:center;gap:14px;}
  .res-verdict{font-size:19px;font-weight:900;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);letter-spacing:.5px;}
  .res-stars{display:inline-flex;gap:7px;filter:drop-shadow(0 3px 10px rgba(255,201,77,.32));}
  .res-stars svg{width:30px;height:30px;opacity:1;transition:opacity .3s;}
  .res-stars svg.dim{opacity:.22;}
  .res-stars svg.lit{animation:starPop .55s ease-out;}
  .res-stars svg.lit:nth-child(1){animation-delay:.10s;}
  .res-stars svg.lit:nth-child(2){animation-delay:.24s;}
  .res-stars svg.lit:nth-child(3){animation-delay:.38s;}
  @keyframes starPop{0%{transform:scale(0) rotate(-160deg);opacity:0;}60%{transform:scale(1.2) rotate(12deg);}100%{transform:scale(1) rotate(0);opacity:1;}}

  /* ---- 练完感觉 ---- */
  .feel-block{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .feel-q{font-size:13px;color:rgba(255,255,255,.68);font-weight:700;letter-spacing:.5px;}
  .feel-row{display:flex;gap:8px;}
  .feel-btn{
    border:2px solid transparent;background:rgba(255,255,255,.07);
    border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font);
    transition:background .18s,border-color .18s;
  }
  .feel-btn:hover{background:rgba(255,255,255,.13);}
  .feel-btn .em{font-size:22px;line-height:1;}
  .feel-btn .fl{font-size:11px;color:rgba(255,255,255,.68);font-weight:700;}
  .feel-btn.on{background:rgba(255,214,107,.16);border-color:var(--gold);}
  .feel-btn.on .fl{color:var(--gold-bright);}

  /* ---- 看完整报告入口(尺寸与主按钮一致,描边区分主次) ---- */
  .btn-report{
    margin-top:2px;border:1px solid rgba(255,214,107,.42);cursor:pointer;
    background:rgba(255,214,107,.08);color:var(--gold-bright);

  .btn-report .ico{width:18px;height:18px;stroke:var(--gold-bright);}

  /* 结算页:按钮组整体下移;两个主按钮固定同宽 */
  #result .btn{margin-top:30px;}
  #result .btn,#result .btn-report{width:300px;justify-content:center;padding-left:0;padding-right:0;}
  #result .feel-block{margin-top:18px;}
  #result .btn-ghost{margin-top:20px;}

  /* ---- 3秒倒计时(参考老拳击版:超大弹跳数字 + 品牌辉光) ---- */
  .countdown{
    position:absolute;inset:0;z-index:70;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 50%, rgba(0,0,0,.35), rgba(0,0,0,.62));
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .countdown.hide{display:none;}
  .countdown .cd-num{
    font-size:150px;font-weight:900;line-height:1;
    color:var(--gold-bright);
    text-shadow:0 0 50px var(--brand),0 0 100px var(--brand),0 8px 20px rgba(0,0,0,.7);
  }
  .countdown .cd-num.go{
    font-size:96px;letter-spacing:6px;
    background:linear-gradient(135deg,#fff,var(--gold-bright));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 40px var(--brand));
  }
  .cd-pop{animation:cdPop 1s ease-out;}
  @keyframes cdPop{
    0%{transform:scale(.35);opacity:0;letter-spacing:24px;}
    28%{transform:scale(1.25);opacity:1;letter-spacing:2px;}
    70%{transform:scale(1);opacity:1;}
    100%{transform:scale(.82);opacity:0;}
  }

  /* ---- 结算页 streak 火苗 +1(多邻国式成就动画) ---- */
  .streak-win{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px;visibility:hidden;}
  .streak-win.go{visibility:visible;}
  .flame-stage{position:relative;width:120px;height:130px;display:flex;align-items:flex-end;justify-content:center;}
  .flame{width:78px;height:96px;transform-origin:50% 100%;
    filter:drop-shadow(0 0 20px rgba(255,152,0,.75)) drop-shadow(0 0 44px rgba(255,152,0,.4));
    animation:flameGrow 1s cubic-bezier(.2,.9,.25,1) both, flameFlicker 1.8s ease-in-out 1s infinite;}
  @keyframes flameGrow{0%{transform:scale(.2) translateY(20px);opacity:0;}45%{transform:scale(1.25) translateY(0);opacity:1;}68%{transform:scale(.92);}100%{transform:scale(1);opacity:1;}}
  @keyframes flameFlicker{0%,100%{transform:scale(1) skewX(0deg);}30%{transform:scale(1.04,.98) skewX(-2deg);}60%{transform:scale(.98,1.03) skewX(2deg);}}
  .flame-plus{position:absolute;top:-6px;left:50%;font-size:34px;font-weight:900;color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.5),0 0 18px #FF9800;
    transform:translateX(-50%) scale(0);animation:plusPop .6s cubic-bezier(.2,.8,.2,1) .55s both;}
  @keyframes plusPop{0%{transform:translateX(-50%) translateY(6px) scale(0);opacity:0;}55%{transform:translateX(-50%) translateY(-10px) scale(1.3);opacity:1;}100%{transform:translateX(-50%) translateY(-14px) scale(1);opacity:1;}}
  .flame-spark{position:absolute;top:40%;left:50%;width:8px;height:8px;border-radius:50%;
    background:#FFD54F;box-shadow:0 0 8px #FFD54F;opacity:0;animation:sparkFly .9s ease-out .5s forwards;}
  @keyframes sparkFly{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(0) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(-70px) scale(.3);}}
  .streak-days{font-size:19px;font-weight:900;color:#FFB74D;letter-spacing:.5px;display:flex;align-items:center;gap:7px;
    opacity:0;animation:daysIn .5s ease-out .9s both;}
  .streak-days .big{font-size:26px;color:#FFD54F;}
  @keyframes daysIn{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
  .streak-sub{font-size:12px;color:rgba(255,255,255,.6);opacity:0;animation:daysIn .5s ease-out 1.1s both;}
</style>
</head>

<script type="module">
import { createPoseBodyKernel } from "./js/pose-body-kernel.js";
import { track } from "./js/telemetry.js";

const stage = document.getElementById('stage');
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ============ URL 旋钮(真机标定用):?reach=&hold=&sm=&debug=&film=&auto= ============ */
const Q=new URLSearchParams(location.search);
const qn=(k,d)=>{ const v=parseFloat(Q.get(k)); return isFinite(v)?v:d; };
const REACH   = qn('reach',120);   // 举臂达标角(度):上臂向量 vs 躯干竖直,过头≈180°
const HOLD_MS = qn('hold',1500);   // 到位后需保持的毫秒
const SM      = qn('sm',0.3);      // 内核 EMA 平滑
const DEBUG   = Q.has('debug');
const FILM    = Q.get('film')==='1' || Q.get('auto')==='1';   // 纯脚本自动演示(无摄像头,供录屏/截图/兜底)

const TARGET   = 8;      // 本局星星数
const BIG_INDEX= 5;      // 第几颗是"双手大烟花"高潮
const REST_MS  = 1500;   // 每颗之间的休息拍(医学:低 BPM + 单动作间歇)
const LOST_TIMEOUT = 8000;  // 仅当"持续检测不到人"这么久才放行(摄像头挂/掉线兜底);有人在画面里则永不自动过关

const dbgEl = document.getElementById('dbgAngle');
if(DEBUG && dbgEl) dbgEl.style.display='block';

/* ============ 闪烁星点(叠在底图星空上,增加"活"的感觉) ============ */
(function genStars(){
  for(let i=0;i<46;i++){
    const s=document.createElement('div');
    s.className='star-static';
    const sz=Math.random()*2+1.2;
    s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*50+'%';   // 只在上半天空区
    s.style.animationDelay=(Math.random()*3)+'s';
    stage.appendChild(s);
  }
})();

/* ============ 可摘星星 ============ */
function starSVG(){
  return `<div class="halo"></div>
  <svg viewBox="0 0 40 40">
    <defs>
      <radialGradient id="sg" cx="50%" cy="42%">
        <stop offset="0%" stop-color="#fffbe6"/>
        <stop offset="55%" stop-color="#ffe08a"/>
        <stop offset="100%" stop-color="#f5b73c"/>
      </radialGradient>
    </defs>
    <path d="M20 2 L24.7 14.5 L38 15.2 L27.6 23.6 L31.2 36.5 L20 29 L8.8 36.5 L12.4 23.6 L2 15.2 L15.3 14.5 Z"
      fill="url(#sg)" stroke="#fff3c4" stroke-width="1"/>
  </svg>`;
}
function placeStar(xPct, yPct){
  const el=document.createElement('div');
  el.className='pick-star';
  el.style.left=xPct+'%';
  el.style.top=yPct+'%';
  el.innerHTML=starSVG();
  stage.appendChild(el);
  return el;
}

/* ============ 星座图鉴 ============ */
const CODEX_PTS=[[18,42],[38,20],[58,34],[80,16],[104,40],[128,24],[75,50]];
let codexCount=0;
function renderCodex(){
  const svg=document.getElementById('codexSvg');
  svg.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  for(let i=0;i<codexCount-1 && i<CODEX_PTS.length-1;i++){
    const l=document.createElementNS(ns,'line');
    l.setAttribute('x1',CODEX_PTS[i][0]); l.setAttribute('y1',CODEX_PTS[i][1]);
    l.setAttribute('x2',CODEX_PTS[i+1][0]); l.setAttribute('y2',CODEX_PTS[i+1][1]);
    l.setAttribute('stroke','rgba(255,214,107,.5)'); l.setAttribute('stroke-width','1');
    svg.appendChild(l);
  }

const SLOTS=[
  {x:30,y:24},  // 0 左
  {x:70,y:21},  // 1 右
  {x:34,y:31},  // 2 左
  {x:66,y:26},  // 3 右

/* ============================================================
 * 上肢姿态桥接(内核 → 游戏侧)+ 键盘兜底
 * ============================================================ */
let kernel=null, camOK=false, playing=false;
let pose={ present:false, elevation:{left:0,right:0}, elevationMax:0, landmarks:null };
let keyHeldUp=false, keyHeldLeft=false, keyHeldRight=false;   // 键盘兜底:↑=双手 ←=左手 →=右手
let activeSide=null;       // 当前该举哪只手:'left' | 'right' | 'both' | null
function syncPose(p){ if(p) pose=p; }

// 是否检测到人(摄像头或键盘任一)——给"检测不到才兜底放行"用
function reachData(){
  let present=false;
  if(camOK && pose.present) present=true;
  if(keyHeldUp||keyHeldLeft||keyHeldRight) present=true;
  return { present };
}

// 按【屏幕左右侧】取该侧手臂的举臂角(度)。核心:不信 MediaPipe 解剖学左右标签,
// 只看手腕落在屏幕中线哪一边(显示镜像后 screenX = 1 - 原始x,<0.5 为左半屏)。
function armReachByScreenSide(side){   // side: 'left' | 'right'
  let best=0;
  const lm=pose.landmarks;
  if(camOK && pose.present && lm){
    // 手腕 15/16 分别配对内核算好的 elevation.left/right
    const arms=[
      { ev:pose.elevation.left||0,  w:lm[15] },
      { ev:pose.elevation.right||0, w:lm[16] },
    ];
    for(const a of arms){
      if(!a.w) continue;
      const onLeft = (1 - a.w.x) < 0.5;         // 该手腕在屏幕左半边?
      if((side==='left') === onLeft) best=Math.max(best, a.ev);
    }
  }
  // 键盘兜底
  if(keyHeldUp) best=Math.max(best, REACH+30);
  if(side==='left'  && keyHeldLeft)  best=Math.max(best, REACH+30);
  if(side==='right' && keyHeldRight) best=Math.max(best, REACH+30);
  return best;
}

// 挑战达标:单侧=该屏幕侧手臂举够;双手=左右屏幕侧各有一只手举够
function isReached(spec){   // spec: 'left' | 'right' | 'both'
  if(spec==='both') return armReachByScreenSide('left')>=REACH && armReachByScreenSide('right')>=REACH;
  return armReachByScreenSide(spec)>=REACH;
}

/* ============ 举臂高度条(判定同源反馈) ============ */
const meterEl=document.getElementById('reachMeter');
const rmFill=document.getElementById('rmFill');
const rmCap=document.getElementById('rmCap');
const rmMark=document.getElementById('rmMark');
// 达标刻度线位置:REACH 在 0..180 量程里的高度
if(rmMark) rmMark.style.bottom=clamp(REACH/180*100,0,100)+'%';
function updateMeter(){
  const present = reachData().present;
  // 高度条跟随"当前该举的那只手";双手时取较低的一只(两只都要够)
  let raw=0;
  if(activeSide==='both') raw=Math.min(armReachByScreenSide('left'), armReachByScreenSide('right'));
  else if(activeSide)     raw=armReachByScreenSide(activeSide);
  else                    raw=Math.max(armReachByScreenSide('left'), armReachByScreenSide('right'));
  const pct = clamp((present?raw:0)/180*100, 0, 100);
  rmFill.style.height=pct+'%';
  const reached = present && raw>=REACH;
  meterEl.classList.toggle('reached', reached);
  if(!present){ rmCap.textContent = camOK?'找不到手':'举臂'; }
  else if(reached){ rmCap.textContent='够到了'; }
  else { rmCap.textContent = activeSide==='left'?'举左手' : activeSide==='right'?'举右手' : activeSide==='both'?'举双手' : '再高些'; }
}

/* ============ 右下角小窗:真人上肢骨架(内联自 you-facecam.js drawSkeleton/drawPoseReal) ============ */
const meshCanvas=document.querySelector('.you-cam .you-mesh');
const meshCtx=meshCanvas?meshCanvas.getContext('2d'):null;
const GOLD_DOT='rgba(255,204,0,0.55)', GOLD_LINE='rgba(255,230,120,0.9)', WHITE='rgba(255,255,255,0.95)';
function mkRnd(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
function fillQuad(dots,a,b,c,d,n,rnd){ if(!a||!b||!c||!d)return; for(let i=0;i<n;i++){ const u=rnd(),v=rnd(); const tx=a.x+(b.x-a.x)*u,ty=a.y+(b.y-a.y)*u, bx=d.x+(c.x-d.x)*u,by=d.y+(c.y-d.y)*u; dots.push([tx+(bx-tx)*v, ty+(by-ty)*v]); } }
function fillDisc(dots,cx,cy,r,n,rnd){ for(let i=0;i<n;i++){ const t=rnd()*Math.PI*2,rr=Math.sqrt(rnd())*r; dots.push([cx+Math.cos(t)*rr,cy+Math.sin(t)*rr]); } }
function addArc(dots,cx,cy,r,n){ n=n||30; for(let i=0;i<n;i++){const t=i/n*Math.PI*2;dots.push([cx+Math.cos(t)*r,cy+Math.sin(t)*r]);} }
function meshBg(){ const W=meshCanvas.width,H=meshCanvas.height; meshCtx.clearRect(0,0,W,H); meshCtx.fillStyle='rgba(255,204,0,0.03)'; meshCtx.fillRect(0,0,W,H); }
function meshHint(text){ meshBg(); meshCtx.fillStyle='rgba(255,204,0,0.4)'; meshCtx.font='12px -apple-system, sans-serif'; meshCtx.textAlign='center'; meshCtx.fillText(text, meshCanvas.width/2, meshCanvas.height/2); }
function drawSkeleton(J){
  meshBg();
  const rnd=mkRnd(20240816);
  const perp=(a,b,w)=>{ const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1; return {x:-dy/L*w,y:dx/L*w}; };
  const limb=(a,b,w,n)=>{ if(!a||!b)return; const p=perp(a,b,w); fillQuad(cloud,{x:a.x+p.x,y:a.y+p.y},{x:b.x+p.x,y:b.y+p.y},{x:b.x-p.x,y:b.y-p.y},{x:a.x-p.x,y:a.y-p.y},n,rnd); };
  const cloud=[];
  if(J.shL&&J.shR&&J.hipL&&J.hipR) fillQuad(cloud,J.shL,J.shR,J.hipR,J.hipL,210,rnd);
  limb(J.shL,J.elL,7.5,52); limb(J.elL,J.wrL,6,44);
  limb(J.shR,J.elR,7.5,52); limb(J.elR,J.wrR,6,44);
  let mid=null, neck=null;
  if(J.shL&&J.shR){ mid={x:(J.shL.x+J.shR.x)/2,y:(J.shL.y+J.shR.y)/2}; if(J.nose) neck=[mid,J.nose]; }
  if(neck) limb(neck[0],neck[1],5,24);
  if(J.nose&&J.headR){ fillDisc(cloud,J.nose.x,J.nose.y,J.headR*0.92,150,rnd); addArc(cloud,J.nose.x,J.nose.y,J.headR,48); }
  if(J.wrL) fillDisc(cloud,J.wrL.x,J.wrL.y,7.5,36,rnd);
  if(J.wrR) fillDisc(cloud,J.wrR.x,J.wrR.y,7.5,36,rnd);
  meshCtx.fillStyle=GOLD_DOT;
  for(let i=0;i<cloud.length;i++){ meshCtx.fillRect(cloud[i][0]-0.5,cloud[i][1]-0.5,1.4,1.4); }
  const bones=[]; const B=(a,b)=>{ if(J[a]&&J[b]) bones.push([J[a],J[b]]); };
  B('shL','shR'); B('shL','elL'); B('elL','wrL'); B('shR','elR'); B('elR','wrR'); B('shL','hipL'); B('shR','hipR'); B('hipL','hipR');
  meshCtx.strokeStyle=GOLD_LINE; meshCtx.lineWidth=0.9;
  for(const [a,b] of bones){ meshCtx.beginPath(); meshCtx.moveTo(a.x,a.y); meshCtx.lineTo(b.x,b.y); meshCtx.stroke(); }
  if(neck){ meshCtx.beginPath(); meshCtx.moveTo(neck[0].x,neck[0].y); meshCtx.lineTo(neck[1].x,neck[1].y); meshCtx.stroke(); }
  if(J.nose&&J.headR){ meshCtx.beginPath(); meshCtx.arc(J.nose.x,J.nose.y,J.headR,0,Math.PI*2); meshCtx.stroke(); }
  meshCtx.fillStyle=WHITE;
  for(const k of ['shL','shR','wrL','wrR']){ if(J[k]){ meshCtx.beginPath(); meshCtx.arc(J[k].x,J[k].y,2.4,0,Math.PI*2); meshCtx.fill(); } }
  meshCtx.fillStyle='rgba(255,255,255,0.6)';
  for(const k of ['elL','elR']){ if(J[k]){ meshCtx.beginPath(); meshCtx.arc(J[k].x,J[k].y,1.7,0,Math.PI*2); meshCtx.fill(); } }
}
function drawPoseReal(lm){
  const W=meshCanvas.width,H=meshCanvas.height;
  const IDX=[0,11,12,13,14,15,16,23,24];
  let minX=1,minY=1,maxX=0,maxY=0,any=false;
  const vis=p=>(p.visibility==null?1:p.visibility);
  for(const i of IDX){ const p=lm[i]; if(!p||vis(p)<0.3)continue; const x=1-p.x,y=p.y; any=true; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  if(!any){ meshHint('SEARCHING…'); return; }
  const bw=Math.max(0.001,maxX-minX), bh=Math.max(0.001,maxY-minY), PAD=22;
  let scale=Math.min((W-2*PAD)/(bw*W),(H-2*PAD)/(bh*H)); scale=Math.min(scale,2.6);
  const offX=(W-bw*W*scale)/2-minX*W*scale, offY=(H-bh*H*scale)/2-minY*H*scale;
  const g=i=>{ const p=lm[i]; if(!p||vis(p)<0.3)return null; return { x:(1-p.x)*W*scale+offX, y:p.y*H*scale+offY }; };
  const shL=g(11),shR=g(12);
  let headR=16; if(shL&&shR) headR=Math.max(12,Math.hypot(shR.x-shL.x,shR.y-shL.y)*0.34);
  drawSkeleton({ nose:g(0), shL, shR, elL:g(13), elR:g(14), wrL:g(15), wrR:g(16), hipL:g(23), hipR:g(24), headR });
}
function drawYou(){
  if(!meshCtx) return;
  if(camOK && pose.landmarks){ drawPoseReal(pose.landmarks); }
  else meshHint(camOK ? 'SEARCHING…' : '键盘模式 · 按住 ↑ 举臂');
}

/* ============================================================
 * 真玩:举臂保持(hold-to-fill)· 单颗挑战驱动
 * ============================================================ */
let challenge=null;

function makeChallenge(i, resolve){
  const big = (i===BIG_INDEX);
  const slot  = SLOTS[i%SLOTS.length];
  const slot2 = big ? SLOTS[(i+3)%SLOTS.length] : null;
  // 单颗星按它在屏幕的左右半边,决定该举哪只手
  const spec = big ? 'both' : (slot.x < 50 ? 'left' : 'right');
  const sideTxt = spec==='left' ? '举左手' : spec==='right' ? '举右手' : '举双手';
  const star  = placeStar(slot.x, slot.y);
  const star2 = big ? placeStar(slot2.x, slot2.y) : null;
  activeSide = spec;
  say(big?'双手一起 · 够两颗星!':(spec==='left'?'举左手 · 够左边的星':'举右手 · 够右边的星'), 'i-hands-up');
  let holding=false, holdStart=0, ring=null, ring2=null, done=false;
  let lostSince=0;   // 持续"检测不到人"的起点(0=当前有人/未开始计)

  function cancelHold(){
    holding=false;
    if(ring){ ring.remove(); ring=null; }
    if(ring2){ ring2.remove(); ring2=null; }
    star.classList.remove('aiming'); if(star2) star2.classList.remove('aiming');
    heroReach(false);
  }
  function finish(soft){
    if(done) return; done=true;
    activeSide=null;
    if(ring){ ring.remove(); ring=null; }
    if(ring2){ ring2.remove(); ring2=null; }
    star.remove(); if(star2) star2.remove();
    if(big){ burstFireworks((slot.x+slot2.x)/2,(slot.y+slot2.y)/2-2, 9, true); say('大烟花!星屑 +10','i-fire'); }
    else   { burstFireworks(slot.x, slot.y, 4, false); say(soft?'够到啦 ✨':'点亮!星屑 +5','i-spark'); }
    heroReach(false);
    dogasCheer();
    addScore(big);
    challenge=null;
    resolve();
  }
  return {
    tick(now){
      const reached=isReached(spec);
      if(reached){
        if(!holding){
          holding=true; holdStart=now;
          star.classList.add('aiming'); if(star2) star2.classList.add('aiming');
          heroReach(true);
          ring=spawnRing(slot.x, slot.y, HOLD_MS);
          if(big) ring2=spawnRing(slot2.x, slot2.y, HOLD_MS);
          say(big?'双手稳住 · 保持 1.5 秒':'稳住 · 保持 1.5 秒','i-spark');
        } else if(now-holdStart>=HOLD_MS){
          finish(false);
        }
      } else {
        if(holding){ cancelHold(); say(big?'双手再举高些':(sideTxt+' · 再举高点'),'i-hands-up'); }
      }
      // 兜底:只在"检测不到人"持续 LOST_TIMEOUT 时才放行(摄像头挂/掉线,别死等)。
      // 摄像头正常、人在画面里时 present=true → 永不自动过关,一直等你举手。
      const present = reachData().present;
      if(present){ lostSince=0; }
      else if(!lostSince){ lostSince=now; }
      else if(now-lostSince>LOST_TIMEOUT){ finish(true); }
    },
    _cleanup(){ cancelHold(); star.remove(); if(star2) star2.remove(); }
  };
}

function runChallenge(i){
  return new Promise(resolve=>{ challenge=makeChallenge(i, resolve); });
}

/* ============ 主循环(全程常驻:供帧 + 画骨架 + 高度条 + 跑挑战) ============ */
let angleVel=0, prevMax=0;
function loop(now){
  requestAnimationFrame(loop);
  now=now||performance.now();
  if(kernel && kernel.ready()){
    syncPose(kernel.tick(now));
    const m=pose.present?pose.elevationMax:0;
    angleVel=Math.abs(m-prevMax); prevMax=m;
  }
  drawYou();
  updateMeter();
  if(challenge) challenge.tick(now);
  if(DEBUG && dbgEl){
    const present = reachData().present;
    dbgEl.textContent=`屏左臂:${armReachByScreenSide('left').toFixed(0)}° 屏右臂:${armReachByScreenSide('right').toFixed(0)}° reach:${REACH} 该举:${activeSide||'-'} present:${present?1:0} cam:${camOK?1:0} hold:${challenge?'run':'-'}`;
  }
}

/* ============ 本局评级(点亮星星比例 → 星星数 + 判语) ============ */
const STAR_TOTAL = 12;
const RANK_TABLE = [
  { min:0.9,  stars:3, verdict:'满天星都被你够到' },
  { min:0.6,  stars:3, verdict:'够到了大半星空' },
  { min:0.3,  stars:2, verdict:'还有几颗没够着' },
  { min:0,    stars:1, verdict:'手再举高一点点' },
];
function gradeRun(){
  const ratio = STAR_TOTAL ? codexCount/STAR_TOTAL : 0;
  return RANK_TABLE.find(t=>ratio>=t.min) || RANK_TABLE[RANK_TABLE.length-1];
}
function pickFeel(el){
  document.querySelectorAll('.feel-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}
window.pickFeel = pickFeel;

function endShow(){
  playing=false;
  if(challenge){ challenge._cleanup&&challenge._cleanup(); challenge=null; }
  if(kernel) kernel.stopCamera();   // 隐私红线:关卡结束立即释放摄像头
  camOK=false; pose={ present:false, elevation:{left:0,right:0}, elevationMax:0, landmarks:null };
  activeSide=null;
  meterEl.classList.remove('show');
  hush();
  document.getElementById('rStars').textContent=codexCount;
  document.getElementById('rFw').textContent=fwCount;

  const g = gradeRun();
  document.getElementById('rVerdict').textContent = g.verdict;
  document.querySelectorAll('#resStars svg').forEach((s,i)=>{
    s.classList.remove('lit','dim');
    s.classList.add(i<g.stars ? 'lit' : 'dim');
  });

  // 试点埋点:一局完成(用于算游玩次数/留存)
  track('level_finish', { level:'star', stars_picked:codexCount, fireworks:fwCount, stars:g.stars });

  document.getElementById('result').classList.remove('hide');
  setTimeout(playStreakFlame,800);
}

/* ============ 3秒倒计时(三关统一) ============ */
function runCountdown(done){
  const cd=document.getElementById('countdown');
  const cdNum=document.getElementById('cdNum');
  cd.classList.remove('hide');
  let n=3;
  (function step(){
    if(n>0){ cdNum.textContent=n; cdNum.className='cd-num cd-pop'; }
    else{ cdNum.textContent='GO!'; cdNum.className='cd-num go cd-pop'; }
    void cdNum.offsetWidth;
    if(n>=0){ n--; setTimeout(step,1000); }
    else{ cd.classList.add('hide'); done&&done(); }
  })();
}

/* ============ 开始 ============ */
async function start(){
  document.getElementById('intro').classList.add('hide');
  document.getElementById('result').classList.add('hide');
  // 重置分数
  fwCount=0; dustCount=0; codexCount=0;
  fwEl.textContent=0; dustEl.textContent=0; renderCodex();
  playing=false;
  activeSide=null;
  if(challenge){ challenge._cleanup&&challenge._cleanup(); challenge=null; }
  const v=document.getElementById('bgvid');
  if(v){ v.currentTime=0; v.play().catch(()=>{}); }

  // 演示/录屏模式:不接摄像头,纯脚本自动播放
  if(FILM){
    meterEl.classList.remove('show');
    runCountdown(runAutoShow);
    return;
  }

  // 真玩:唤起摄像头 + 上肢检测(失败则降级为键盘 ↑,不阻断)
  camOK=false;
  const statusEl=document.querySelector('#intro .status');
  try{
    if(!kernel){
      kernel=createPoseBodyKernel({ video:document.querySelector('.you-cam video'), smooth:SM });
      await kernel.loadModel(txt=>{ if(statusEl && txt) statusEl.textContent=txt; });
    }
    await kernel.startCamera();
    camOK=true;
  }catch(e){
    camOK=false;   // 摄像头被拒/无设备 → 键盘兜底
  }
  meterEl.classList.add('show');
  runCountdown(()=>{ playReal(); });
}
document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('againBtn').addEventListener('click',start);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); if(!playing) start(); return; }
  if(e.code==='ArrowUp'){ e.preventDefault(); keyHeldUp=true; }
  if(e.code==='ArrowLeft'){ e.preventDefault(); keyHeldLeft=true; }
  if(e.code==='ArrowRight'){ e.preventDefault(); keyHeldRight=true; }
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowUp') keyHeldUp=false;
  if(e.code==='ArrowLeft') keyHeldLeft=false;
  if(e.code==='ArrowRight') keyHeldRight=false;
});

// 演示模式 ?film=1 / ?auto=1:进入即自动开始(自动导演,无摄像头,供录屏/截图)
if(FILM){ setTimeout(start,300); }
// end=1 调试入口:直接看结算页(满分演示,走 endShow 填判语+星星)
if(location.search.indexOf('end=1')>=0){
  const introEl=document.getElementById('intro');
  introEl.classList.add('hide'); introEl.style.display='none';
  codexCount=STAR_TOTAL; fwCount=7;
  endShow();
  const r=document.getElementById('result');
  r.style.transition='none'; r.style.opacity='1';
}

</script>
