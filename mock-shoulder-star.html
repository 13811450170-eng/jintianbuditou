<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今天不低头 · 举臂摘星</title>
<style>
  :root {
    /* Doga 家族配色(沿用夜晚关) */
    --joy: #ea3323;
    --max: #5c6470;
    --chill: #f39c1f;
    --blink: #ff7a29;
    --yummy: #1f3fe6;
    --snow: #eb7fa8;

    /* 夜空 */
    --night-sky-top: #070b28;
    --night-sky-mid: #141a4a;
    --night-sky-bot: #2e2a5e;

    /* 海面 */
    --sea-far: #16305a;
    --sea-near: #0d1e3d;

    --gold: #ffd66b;
    --gold-bright: #ffe89b;
    --star-glow: #cad6ff;

    /* ===== 关卡 HUD 设计系统 v1 · 摘星皮肤(深蓝金) ===== */
    --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --fs-display:56px; --fs-num:44px;
    --glass-blur:14px;
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.18);
    --shadow-1:0 2px 8px rgba(0,0,0,.18);
    --shadow-2:0 8px 24px rgba(0,0,0,.28);
    --ok:#6bff9d;
    --brand:#7c86ff;
    --brand-deep:#141a4a;
    --glass-bg:rgba(12,16,44,.5);
    --overlay-bg:radial-gradient(circle at 50% 42%, rgba(26,32,86,.76), rgba(5,6,20,.95));
    --title-txt:#0a1030;

    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html, body {
    height:100%; overflow:hidden;
    font-family:var(--font); color:#e8ecf5;
    background:#04030f;
  }

  /* ==================== 舞台 ==================== */
  #stage {
    position: fixed; inset: 0;
    overflow: hidden;
    background: #04030f;
  }
  /* 视频底层:六只狗蹦跳欢呼(星星烟花由代码层生成) */
  #bgvid {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
  }
  /* 庆祝脉冲:整场景轻微放大回弹 + 一层暖光泛起 */
  #stage.celebrate { animation: stagePulse .7s ease-out; }
  @keyframes stagePulse {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.012); }
    100% { transform: scale(1); }
  }
  #stage.celebrate::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse 60% 40% at 50% 42%, rgba(255,220,150,.16), transparent 70%);
    animation: celebGlow .7s ease-out;
  }
  @keyframes celebGlow{ 0%{opacity:0;} 35%{opacity:1;} 100%{opacity:0;} }

  /* 银河 / 星云带 */
  .galaxy {
    position:absolute;
    top: 4%; left: 50%;
    width: 120%; height: 44%;
    transform: translateX(-50%) rotate(-14deg);
    background:
      radial-gradient(ellipse 60% 40% at 40% 50%, rgba(150,130,255,.16), transparent 70%),
      radial-gradient(ellipse 50% 30% at 65% 45%, rgba(120,180,255,.12), transparent 70%);
    filter: blur(6px);
    pointer-events:none;
    z-index:1;
  }

  /* 背景星点 */
  .star-static {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
    pointer-events: none;
    filter: blur(0.3px);
    z-index:1;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.45; transform: scale(1); }
    50%     { opacity: 1;   transform: scale(1.25); }
  }

  /* 月亮 */
  .moon {
    position: absolute;
    top: 7%; right: 11%;
    width: 84px; height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fffce0 0%, #e6e0bc 60%, rgba(216,212,176,0) 84%);
    box-shadow: 0 0 46px rgba(255,232,155,.42), 0 0 96px rgba(255,232,155,.2);
    z-index: 2;
  }
  .moon::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 62% 66%, rgba(200,195,160,.5), transparent 42%),
               radial-gradient(circle at 44% 40%, rgba(200,195,160,.35), transparent 30%);
    opacity:.5;
  }

  /* ==================== 海面 ==================== */
  .sea {
    position:absolute;
    left:0; right:0;
    top: 52%; height: 20%;
    background: linear-gradient(180deg, var(--sea-far) 0%, var(--sea-near) 100%);
    z-index:2;
    overflow:hidden;
  }
  /* 海平线微光 */
  .sea::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg, transparent, rgba(180,200,255,.5), transparent);
  }
  /* 月光在海面的反光柱 */
  .sea-glint{
    position:absolute;
    top:0; bottom:0;
    right: 12%;
    width: 90px;
    transform: translateX(50%);
    background: linear-gradient(180deg, rgba(255,240,180,.55), rgba(255,240,180,.06) 90%);
    filter: blur(3px);
    z-index:3;
    -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 3px, transparent 3px 8px);
            mask-image: repeating-linear-gradient(180deg, #000 0 3px, transparent 3px 8px);
    animation: glint 4s ease-in-out infinite;
  }
  @keyframes glint {
    0%,100% { opacity:.75; }
    50%     { opacity:1; }
  }

  /* ==================== 草丛栏(海堤上的草) ==================== */
  .grass-belt{
    position:absolute;
    left:0; right:0;
    top: 68%; height: 8%;
    z-index:5;
  }

  /* ==================== 堤道地面 ==================== */
  .promenade{
    position:absolute;
    left:0; right:0; bottom:0;
    height: 26%;
    background: linear-gradient(180deg, #2a2740 0%, #201d33 60%, #17142a 100%);
    z-index:6;
    box-shadow: 0 -10px 30px rgba(0,0,0,.45);
  }
  /* 堤道铺装横缝 */
  .promenade::before{
    content:"";position:absolute;inset:0;
    background: repeating-linear-gradient(90deg, transparent 0 78px, rgba(0,0,0,.28) 78px 80px);
    opacity:.6;
  }
  /* 堤道与草丛的护栏边 */
  .rail{
    position:absolute;
    left:0; right:0;
    top: 74.5%;
    height: 6px;
    background: linear-gradient(180deg, #4a4668, #2c2942);
    z-index:6;
  }

  /* ==================== HUD ==================== */
  /* 通用玻璃面:液态玻璃(通透+提色+边缘镜面光+顶部光泽) */
  .glass{
    position:relative;
    background:
      linear-gradient(135deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.03) 38%, rgba(255,255,255,.07) 100%),
      var(--glass-bg);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.45),
      inset 0 -10px 22px rgba(255,255,255,.04),
      var(--shadow-2);
    backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  }
  .glass::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    padding:1px;
    background:linear-gradient(135deg,
      rgba(255,255,255,.7) 0%, rgba(255,255,255,.08) 34%,
      rgba(255,255,255,0) 58%, rgba(255,255,255,.32) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }
  /* 线性 SVG 图标 */
  .ico{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  .hud-title {
    position: absolute;
    top: 18px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: var(--title-txt);
    padding: 10px 32px;
    border-radius: var(--r-pill);
    font-size: 18px; font-weight: 800;
    letter-spacing: 1.5px;
    box-shadow: var(--shadow-1);
    z-index: 40;
    display:flex;align-items:center;gap:10px;
  }
  .hud-title .ico{stroke:var(--title-txt);width:19px;height:19px;}
  .hud-chip{
    position:absolute; top:16px;
    display:flex; align-items:center; gap:10px;
    padding:11px 18px;
    border-radius:var(--r-pill);
    font-size:16px; font-weight:700;
    color:var(--gold-bright);
    z-index:40;
  }
  .hud-chip .ico{ width:19px;height:19px; }
  .hud-chip .lb{opacity:.9;}
  .hud-chip b{color:#fff;font-size:21px;font-weight:900;}
  #chipFw{ left:16px; }
  #chipDust{ left:16px; top:68px; }

  /* 星座图鉴卡 */
  .codex{
    position:absolute; top:16px; right:16px;
    width:172px;
    border-radius:var(--r-md);
    padding:15px 17px;
    z-index:40;
  }
  .codex h4{ font-size:12px; color:var(--gold-bright); letter-spacing:1px; margin-bottom:8px; font-weight:800;}
  .codex .count{ font-size:22px; font-weight:900; color:#fff; }
  .codex .count small{ font-size:12px; color:#9aa3c7; font-weight:700; }
  #codexSvg{ width:100%; height:64px; display:block; margin-top:4px; }

  /* ==================== 可摘星星 ==================== */
  .pick-star{
    position:absolute;
    width:38px; height:38px;
    transform: translate(-50%,-50%);
    z-index:8;
    pointer-events:none;
    animation: starBob 3.4s ease-in-out infinite;
  }
  @keyframes starBob{
    0%,100%{ transform: translate(-50%,-50%) translateY(0); }
    50%    { transform: translate(-50%,-50%) translateY(-8px); }
  }
  .pick-star svg{ width:100%; height:100%; overflow:visible; }
  .pick-star .halo{
    position:absolute; inset:-40%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,224,130,.55), transparent 68%);
    animation: haloPulse 2.2s ease-in-out infinite;
  }
  @keyframes haloPulse{
    0%,100%{ opacity:.6; transform:scale(1); }
    50%    { opacity:1;  transform:scale(1.18); }
  }
  /* 星星被"够到":光晕加速 */
  .pick-star.aiming{ animation: none; }
  .pick-star.aiming .halo{ animation: haloPulse 1s ease-in-out infinite; }
  /* 金色倒计时圈 */
  .aim-ring{
    position:absolute;
    width:78px; height:78px;
    transform: translate(-50%,-50%) rotate(-90deg);
    pointer-events:none;
    z-index:9;
  }
  .aim-ring circle{
    fill:none;
    stroke:var(--gold-bright);
    stroke-width:4;
    stroke-linecap:round;
    filter: drop-shadow(0 0 6px var(--gold));
    stroke-dasharray: 226;
    stroke-dashoffset: 226;
  }
  .aim-ring.run circle{ animation: ringFill 1.5s linear forwards; }
  @keyframes ringFill{ to { stroke-dashoffset: 0; } }

  /* ==================== 烟花(大绽放) ==================== */
  .firework {
    position: absolute;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 9;
    --burst: 30vmin;         /* 绽放半径,普通 */
    animation: fwFade 3.6s ease-out forwards;
  }
  @keyframes fwFade { 0%{opacity:0;} 5%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }
  /* 粒子:向外飞散并缓慢下坠 */
  .firework .particle {
    position: absolute; top: 0; left: 0;
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 12px 3px currentColor;
    animation: fwParticle 3.4s cubic-bezier(.12,.55,.25,1) forwards;
  }
  /* 亮核闪光 */
  .firework::before {
    content: ""; position: absolute; top: 0; left: 0;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.98) 0%, rgba(255,240,190,.55) 35%, transparent 70%);
    transform: translate(-50%, -50%);
    animation: fwCenter 1.1s ease-out forwards;
  }
  @keyframes fwCenter {
    0%{opacity:1;transform:translate(-50%,-50%) scale(.4);}
    55%{opacity:1;transform:translate(-50%,-50%) scale(1.5);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(2.6);}
  }
  @keyframes fwParticle {
    0%   {opacity:1; transform: rotate(var(--rot)) translateY(0) scale(1.3);}
    15%  {opacity:1; transform: rotate(var(--rot)) translateY(calc(var(--burst) * -0.85)) scale(1.1);}
    80%  {opacity:.9;}
    100% {opacity:0; transform: rotate(var(--rot)) translateY(calc(var(--burst) * -1)) translateX(8px) translateY(10px) scale(.4);}
  }
  /* 大烟花(双手高潮) */
  .firework.big{ --burst: 46vmin; }
  .firework.big::before{ width:140px; height:140px; }
  .firework.big .particle{ width:8px; height:8px; }

  /* ==================== Doga 家族群像 ==================== */
  .dogas-row {
    position: absolute;
    left: 0; right: 0;
    bottom: 5%;
    height: 34%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 1.6%;
    z-index: 15;
    pointer-events:none;
  }
  .doga {
    position: relative;
    transform-origin: 50% 100%;
    animation: dogaBreath 4s ease-in-out infinite;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.4));
  }
  .doga img{
    display:block;
    height:100%;
    width:auto;
    /* 背光夜景:整体压暗一点,融进夜色 */
    filter: brightness(.82) saturate(.92);
  }
  @keyframes dogaBreath {
    0%,100%{ transform: translateY(0) scale(1); }
    50%    { transform: translateY(-2px) scale(1.015); }
  }
  /* 庆祝:上跳 + 轻微放大(3D图自带举臂造型) */
  .doga.cheer { animation: dogaJump .7s ease-out; }
  @keyframes dogaJump {
    0%   { transform: translateY(0) scale(1) rotate(0deg); }
    30%  { transform: translateY(-30px) scale(1.08) rotate(-3deg); }
    55%  { transform: translateY(-6px) scale(1.03) rotate(2deg); }
    75%  { transform: translateY(-12px) scale(1.05) rotate(-1deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
  }
  .doga.cheer img{ filter: brightness(1) saturate(1); }
  /* 够星保持:整体上浮微晃(演示"举臂→保持"训练动作) */
  .doga.reach{ animation: reachSway 1.5s ease-in-out infinite; }
  .doga.reach img{ filter: brightness(1.05) saturate(1); }
  @keyframes reachSway{
    0%,100%{ transform: translateY(-4px) scale(1.02); }
    50%    { transform: translateY(-11px) scale(1.04); }
  }
  /* 头顶反应表情 */
  .doga .react{
    position:absolute; top:-10px; left:50%;
    transform:translateX(-50%) scale(0);
    font-size:24px;
    opacity:0;
    z-index:2;
  }
  .doga.cheer .react{ animation: reactPop .8s ease-out; }
  @keyframes reactPop{
    0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.4);}
    40%{opacity:1;transform:translateX(-50%) translateY(-8px) scale(1.1);}
    100%{opacity:0;transform:translateX(-50%) translateY(-22px) scale(.9);}
  }

  /* ==================== 右下角 · 真人点阵脸小窗(与拳击关统一) ==================== */
  .you-cam{
    position:absolute;bottom:5%;right:3%;z-index:30;
    width:168px;height:126px;
    border:3px solid #ffcc00;border-radius:12px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%,#0b0512 0%,#000 100%);
    box-shadow:0 0 22px rgba(255,204,0,.4),0 4px 20px rgba(0,0,0,.6);
  }
  .you-cam video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .you-cam .you-mesh{width:100%;height:100%;display:block;}
  .you-cam .you-label{
    position:absolute;top:8px;right:8px;
    display:flex;align-items:center;gap:5px;
    color:#ff4d5e;font-size:11px;font-weight:900;letter-spacing:2px;
    padding:3px 8px;background:rgba(0,0,0,.55);border-radius:5px;
  }
  .you-cam .you-dot{width:7px;height:7px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e;animation:dotBlink 1.2s infinite;}
  @keyframes dotBlink { 0%,100%{opacity:1;} 50%{opacity:.3;} }

  /* 中部引导文案 */
  .coach-tip{
    position:absolute;
    top: 40%; left:50%; transform:translateX(-50%);
    color:var(--gold-bright);
    padding:11px 26px; border-radius:var(--r-pill);
    font-size:16px; font-weight:800; letter-spacing:.5px;
    z-index:38;
    white-space:nowrap;
    opacity:0;
    transition: opacity .5s;
    display:flex;align-items:center;gap:8px;
  }
  .coach-tip .ico{width:16px;height:16px;}

  /* ==================== 开场 / 结算 覆盖层 ==================== */
  .overlay{
    position:absolute;inset:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:16px;padding:24px;
    background:var(--overlay-bg);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .8s;
  }
  .overlay.hide{opacity:0;pointer-events:none;}
  .brand{
    border:1px solid var(--gold);color:var(--gold-bright);
    padding:6px 20px;border-radius:var(--r-pill);
    font-size:13px;font-weight:800;letter-spacing:3px;
    display:flex;align-items:center;gap:8px;
  }
  .brand .ico{width:15px;height:15px;}
  .big-title{
    font-size:var(--fs-display);font-weight:900;letter-spacing:2px;line-height:1.1;
    background:linear-gradient(135deg,#fff 0%,var(--gold-bright) 48%,var(--brand) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .subtitle{font-size:15px;color:rgba(255,255,255,.82);line-height:1.7;max-width:440px;}
  .subtitle b{color:var(--gold-bright);}
  .how-grid{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;justify-content:center;}
  .how-item{
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:var(--r-sm);padding:12px 14px;min-width:92px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .how-item .ico{width:22px;height:22px;color:#fff;}
  .how-item .lb{font-size:12px;color:var(--gold-bright);font-weight:700;}
  .how-item .sub2{font-size:10px;color:rgba(255,255,255,.6);}
  .btn{
    margin-top:8px;border:none;cursor:pointer;
    background:var(--brand);
    color:#fff;padding:16px 46px;border-radius:var(--r-pill);
    font-size:18px;font-weight:900;letter-spacing:1.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .12s,filter .12s;
    display:inline-flex;align-items:center;gap:9px;
  }
  .btn .ico{stroke:#fff;}
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn-ghost{
    margin-top:2px;border:none;cursor:pointer;background:transparent;
    color:rgba(255,255,255,.6);font-family:var(--font);
    font-size:14px;font-weight:700;letter-spacing:.5px;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s;
  }
  .btn-ghost:hover{color:var(--gold-bright);}
  .btn-ghost .ico{width:15px;height:15px;stroke:currentColor;}
  .status{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;}
  .result-card{
    border-radius:var(--r-lg);padding:26px 34px;
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .result-stat{display:flex;gap:34px;}
  .result-stat .item{text-align:center;}
  .result-stat .num{font-size:var(--fs-num);font-weight:900;color:var(--gold-bright);line-height:1;}
  .result-stat .lb{font-size:13px;color:rgba(255,255,255,.75);margin-top:7px;}
  .result-up{font-size:14px;color:var(--ok);font-weight:700;display:flex;align-items:center;gap:6px;}
  .result-up .ico{width:15px;height:15px;stroke:var(--ok);}

  /* ---- 3秒倒计时(参考老拳击版:超大弹跳数字 + 品牌辉光) ---- */
  .countdown{
    position:absolute;inset:0;z-index:70;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 50%, rgba(0,0,0,.35), rgba(0,0,0,.62));
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .countdown.hide{display:none;}
  .countdown .cd-num{
    font-size:150px;font-weight:900;line-height:1;
    color:var(--gold-bright);
    text-shadow:0 0 50px var(--brand),0 0 100px var(--brand),0 8px 20px rgba(0,0,0,.7);
  }
  .countdown .cd-num.go{
    font-size:96px;letter-spacing:6px;
    background:linear-gradient(135deg,#fff,var(--gold-bright));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 40px var(--brand));
  }
  .cd-pop{animation:cdPop 1s ease-out;}
  @keyframes cdPop{
    0%{transform:scale(.35);opacity:0;letter-spacing:24px;}
    28%{transform:scale(1.25);opacity:1;letter-spacing:2px;}
    70%{transform:scale(1);opacity:1;}
    100%{transform:scale(.82);opacity:0;}
  }

  /* ---- 结算页 streak 火苗 +1(多邻国式成就动画) ---- */
  .streak-win{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px;visibility:hidden;}
  .streak-win.go{visibility:visible;}
  .flame-stage{position:relative;width:120px;height:130px;display:flex;align-items:flex-end;justify-content:center;}
  .flame{width:78px;height:96px;transform-origin:50% 100%;
    filter:drop-shadow(0 0 20px rgba(255,152,0,.75)) drop-shadow(0 0 44px rgba(255,152,0,.4));
    animation:flameGrow 1s cubic-bezier(.2,.9,.25,1) both, flameFlicker 1.8s ease-in-out 1s infinite;}
  @keyframes flameGrow{0%{transform:scale(.2) translateY(20px);opacity:0;}45%{transform:scale(1.25) translateY(0);opacity:1;}68%{transform:scale(.92);}100%{transform:scale(1);opacity:1;}}
  @keyframes flameFlicker{0%,100%{transform:scale(1) skewX(0deg);}30%{transform:scale(1.04,.98) skewX(-2deg);}60%{transform:scale(.98,1.03) skewX(2deg);}}
  .flame-plus{position:absolute;top:-6px;left:50%;font-size:34px;font-weight:900;color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.5),0 0 18px #FF9800;
    transform:translateX(-50%) scale(0);animation:plusPop .6s cubic-bezier(.2,.8,.2,1) .55s both;}
  @keyframes plusPop{0%{transform:translateX(-50%) translateY(6px) scale(0);opacity:0;}55%{transform:translateX(-50%) translateY(-10px) scale(1.3);opacity:1;}100%{transform:translateX(-50%) translateY(-14px) scale(1);opacity:1;}}
  .flame-spark{position:absolute;top:40%;left:50%;width:8px;height:8px;border-radius:50%;
    background:#FFD54F;box-shadow:0 0 8px #FFD54F;opacity:0;animation:sparkFly .9s ease-out .5s forwards;}
  @keyframes sparkFly{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(0) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(-70px) scale(.3);}}
  .streak-days{font-size:19px;font-weight:900;color:#FFB74D;letter-spacing:.5px;display:flex;align-items:center;gap:7px;
    opacity:0;animation:daysIn .5s ease-out .9s both;}
  .streak-days .big{font-size:26px;color:#FFD54F;}
  @keyframes daysIn{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
  .streak-sub{font-size:12px;color:rgba(255,255,255,.6);opacity:0;animation:daysIn .5s ease-out 1.1s both;}
</style>
</head>
<body>
<div id="stage">
  <!-- 视频底层:六只狗蹦跳欢呼 -->
  <video id="bgvid" src="img/star.mp4" muted loop playsinline autoplay></video>
  <!-- 星空/流星/烟花/HUD 由下方代码层生成,叠在视频上 -->

  <!-- 线性 SVG 图标库 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14a8 8 0 1 1-10-10 6 6 0 0 0 10 10z"/></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 3c1 3-1 4-1 6a3 3 0 0 0 3 3c1-1 1-2 1-3 2 2 3 4 3 6a6 6 0 1 1-12 0c0-3 2-5 3-7 .8 1 1 2 3 2z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 17.8 6.2 21.3l1.6-6.6L2.6 9.8l6.8-.5z"/></symbol>
    <symbol id="i-hands-up" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="2.3"/><path d="M12 8v6M12 9l-3.5-4M12 9l3.5-4M12 14l-3 5M12 14l3 5"/></symbol>
  </svg>

  <!-- HUD -->
  <div class="hud-title"><svg class="ico"><use href="#i-moon"/></svg>举臂摘星 · 星光派对</div>
  <div class="hud-chip glass" id="chipFw"><svg class="ico"><use href="#i-fire"/></svg><span class="lb">烟花</span><b id="fwCount">0</b></div>
  <div class="hud-chip glass" id="chipDust"><svg class="ico"><use href="#i-spark"/></svg><span class="lb">星屑</span><b id="dustCount">0</b></div>
  <div class="codex glass">
    <h4>今日星座</h4>
    <div class="count"><span id="codexNum">0</span><small>/12 颗</small></div>
    <svg id="codexSvg" viewBox="0 0 150 64"></svg>
  </div>

  <div class="coach-tip glass" id="coachTip"><svg class="ico"><use href="#i-hands-up"/></svg>举起双手 · 够向星空</div>

  <!-- 右下角 · 真人点阵脸小窗 -->
  <div class="you-cam" data-track="pose-reach">
    <video autoplay playsinline muted></video>
    <canvas class="you-mesh" width="336" height="252"></canvas>
    <div class="you-label"><span class="you-dot"></span>YOU</div>
  </div>

  <!-- 开场 -->
  <div class="overlay" id="intro">
    <div class="brand"><svg class="ico"><use href="#i-moon"/></svg>JOY · 星光派对</div>
    <div class="big-title">今晚一起摘星</div>
    <div class="subtitle">举起手臂，够向夜空的星星<br>稳稳保持，舒展你的肩膀，赶走圆肩酸痛</div>
    <div class="how-grid">
      <div class="how-item"><svg class="ico"><use href="#i-hands-up"/></svg><div class="lb">举臂过头</div></div>
      <div class="how-item"><svg class="ico"><use href="#i-star"/></svg><div class="lb">够向星星</div></div>
      <div class="how-item"><svg class="ico"><use href="#i-spark"/></svg><div class="lb">稳住保持</div></div>
    </div>
    <button class="btn" id="startBtn"><svg class="ico"><use href="#i-star"/></svg>开始摘星 · STAR TIME!</button>
    <div class="status">演示模式 · 自动播放</div>
  </div>

  <!-- 结算 -->
  <div class="overlay hide" id="result">
    <div class="streak-win" id="streakWin">
        <div class="flame-stage">
          <svg class="flame" viewBox="0 0 78 96">
            <defs>
              <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#FF6D00"/><stop offset="45%" stop-color="#FF9800"/>
                <stop offset="80%" stop-color="#FFB74D"/><stop offset="100%" stop-color="#FFD54F"/>
              </linearGradient>
              <linearGradient id="flameCore" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#FFD54F"/><stop offset="100%" stop-color="#FFF3C4"/>
              </linearGradient>
            </defs>
            <path fill="url(#flameGrad)" d="M39 2 C50 22 68 34 68 60 A29 29 0 0 1 10 60 C10 42 22 40 26 26 C34 34 30 44 36 48 C42 46 40 30 39 2 Z"/>
            <path fill="url(#flameCore)" d="M39 40 C46 50 52 54 52 66 A13 13 0 0 1 26 66 C26 56 34 54 34 44 C38 48 37 52 39 54 Z"/>
          </svg>
          <div class="flame-plus">+1</div>
          <div class="flame-spark" style="--sr:-30deg"></div><div class="flame-spark" style="--sr:-12deg"></div>
          <div class="flame-spark" style="--sr:12deg"></div><div class="flame-spark" style="--sr:30deg"></div>
        </div>
        <div class="streak-days">连续 <span class="big">6</span> 天</div>
        <div class="streak-sub">火苗更旺了 · 别断哦</div>
      </div>

    <div class="result-card glass">
      <div class="result-stat">
        <div class="item"><div class="num" id="rStars">0</div><div class="lb">点亮星星</div></div>
        <div class="item"><div class="num" id="rFw">0</div><div class="lb">绽放烟花</div></div>
        <div class="item"><div class="num">+5°</div><div class="lb">肩部活动度</div></div>
      </div>
      <div class="result-up"><svg class="ico"><use href="#i-spark"/></svg>比上周舒展 5°，肩膀更开阔了</div>
    </div>
    <button class="btn" id="againBtn">再摘一轮</button>
    <button class="btn-ghost" onclick="location.href='zone.html?zone=shoulder'"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M15 19l-7-7 7-7"/></svg>返回肩部训练营</button>
    <div class="status">今天不低头 · 关注你的肩颈健康</div>
  </div>

  <!-- 3秒倒计时 -->
  <div class="countdown hide" id="countdown"><div class="cd-num" id="cdNum">3</div></div>
</div>

<script>
const stage = document.getElementById('stage');

/* ============ 闪烁星点(叠在底图星空上,增加"活"的感觉) ============ */
(function genStars(){
  for(let i=0;i<46;i++){
    const s=document.createElement('div');
    s.className='star-static';
    const sz=Math.random()*2+1.2;
    s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*50+'%';   // 只在上半天空区
    s.style.animationDelay=(Math.random()*3)+'s';
    stage.appendChild(s);
  }
})();

/* ============ 可摘星星 ============ */
function starSVG(){
  return `<div class="halo"></div>
  <svg viewBox="0 0 40 40">
    <defs>
      <radialGradient id="sg" cx="50%" cy="42%">
        <stop offset="0%" stop-color="#fffbe6"/>
        <stop offset="55%" stop-color="#ffe08a"/>
        <stop offset="100%" stop-color="#f5b73c"/>
      </radialGradient>
    </defs>
    <path d="M20 2 L24.7 14.5 L38 15.2 L27.6 23.6 L31.2 36.5 L20 29 L8.8 36.5 L12.4 23.6 L2 15.2 L15.3 14.5 Z"
      fill="url(#sg)" stroke="#fff3c4" stroke-width="1"/>
  </svg>`;
}
// 星星散在中上部(15%~40% 高度区,举到120-140°够得到)
const STAR_SLOTS = [
  {x:26, y:26}, {x:44, y:20}, {x:60, y:28}, {x:74, y:23}, {x:37, y:34}, {x:66, y:38}
];
function placeStar(xPct, yPct){
  const el=document.createElement('div');
  el.className='pick-star';
  el.style.left=xPct+'%';
  el.style.top=yPct+'%';
  el.innerHTML=starSVG();
  stage.appendChild(el);
  return el;
}

/* ============ 星座图鉴 ============ */
const CODEX_PTS=[[18,42],[38,20],[58,34],[80,16],[104,40],[128,24],[75,50]];
let codexCount=0;
function renderCodex(){
  const svg=document.getElementById('codexSvg');
  svg.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  for(let i=0;i<codexCount-1 && i<CODEX_PTS.length-1;i++){
    const l=document.createElementNS(ns,'line');
    l.setAttribute('x1',CODEX_PTS[i][0]); l.setAttribute('y1',CODEX_PTS[i][1]);
    l.setAttribute('x2',CODEX_PTS[i+1][0]); l.setAttribute('y2',CODEX_PTS[i+1][1]);
    l.setAttribute('stroke','rgba(255,214,107,.5)'); l.setAttribute('stroke-width','1');
    svg.appendChild(l);
  }
  for(let i=0;i<CODEX_PTS.length;i++){
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',CODEX_PTS[i][0]); c.setAttribute('cy',CODEX_PTS[i][1]);
    c.setAttribute('r', i<codexCount?2.6:1.4);
    c.setAttribute('fill', i<codexCount?'#ffe89b':'rgba(255,255,255,.25)');
    if(i<codexCount) c.setAttribute('filter','drop-shadow(0 0 4px #ffd66b)');
    svg.appendChild(c);
  }
}
renderCodex();

/* ============ 烟花 ============ */
function spawnFirework(xPct, yPct, big){
  const colors=['#ff9db1','#9bffb0','#ffd66b','#a8d0ff','#ffb0f5','#a4f5ff'];
  const color=colors[Math.floor(Math.random()*colors.length)];
  const fw=document.createElement('div');
  fw.className='firework'+(big?' big':'');
  fw.style.left=xPct+'%'; fw.style.top=yPct+'%';
  const n=big?22:14;
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.color=color; p.style.background=color;
    p.style.setProperty('--rot',(i*360/n)+'deg');
    fw.appendChild(p);
  }
  stage.appendChild(fw);
  setTimeout(()=>fw.remove(),2000);
}

/* 多发爆发:围绕中心点错开时间/位置放 n 朵烟花(演示更盛大) */
function burstFireworks(cx, cy, n, big){
  for(let i=0;i<n;i++){
    const dx=(i===0?0:(Math.random()-0.5)*38);
    const dy=(i===0?0:(Math.random()-0.5)*22);
    const delay=i*180+Math.random()*120;
    setTimeout(()=>spawnFirework(cx+dx, cy+dy, big && i===0 ? true : (Math.random()<0.4)), delay);
  }
}

/* ============ 分数 ============ */
let fwCount=0, dustCount=0;
const fwEl=document.getElementById('fwCount');
const dustEl=document.getElementById('dustCount');
function addScore(big){
  fwCount+=big?2:1;
  dustCount+=big?10:5;
  fwEl.textContent=fwCount;
  dustEl.textContent=dustCount;
  if(codexCount<12){ codexCount++; renderCodex(); }
}

/* 庆祝:场景做一次欢庆脉冲(底图微微一弹 + 屏幕泛光),狗已在底图中静态举手 */
function dogasCheer(){
  stage.classList.remove('celebrate');
  void stage.offsetWidth;
  stage.classList.add('celebrate');
  setTimeout(()=>stage.classList.remove('celebrate'), 700);
}
// 够星保持:此版狗在底图中,无需单独举臂(保留空函数不改状态机结构)
function heroReach(on){ /* no-op: dogs are baked into the background image */ }

/* ============ 倒计时圈 ============ */
function spawnRing(xPct, yPct){
  const r=document.createElement('div');
  r.className='aim-ring';
  r.style.left=xPct+'%'; r.style.top=yPct+'%';
  r.innerHTML='<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/></svg>';
  stage.appendChild(r);
  void r.offsetWidth;
  r.classList.add('run');
  return r;
}

/* ============ 旁白 ============ */
const tipEl=document.getElementById('coachTip');
function say(txt){
  tipEl.innerHTML=`<svg class="ico"><use href="#i-spark"/></svg>${txt}`;
  tipEl.style.opacity='1';
}
function hush(){ tipEl.style.opacity='0'; }

/* ============ 自动播放导演状态机 ============ */
// 星星落点(中上部,举到 120-140° 够得到;不逼顶不逼边)
const SLOTS=[
  {x:30,y:24},{x:46,y:19},{x:62,y:26},{x:72,y:21},
  {x:38,y:31},{x:56,y:22},{x:68,y:33},{x:44,y:27}
];
let round=0;
const HOLD_MS=1500;

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function playRound(){
  const isBig = (round===2);            // 第 3 轮演双手大烟花高潮
  round++;

  if(isBig){
    // 双手够两颗星
    const a=SLOTS[1], b=SLOTS[5];
    say('双手一起 · 够两颗星!');
    const s1=placeStar(a.x,a.y), s2=placeStar(b.x,b.y);
    await sleep(500);
    heroReach(true);
    s1.classList.add('aiming'); s2.classList.add('aiming');
    await sleep(400);
    const r1=spawnRing(a.x,a.y), r2=spawnRing(b.x,b.y);
    await sleep(HOLD_MS);
    r1.remove(); r2.remove();
    s1.remove(); s2.remove();
    // 高潮:满屏多发大烟花
    burstFireworks((a.x+b.x)/2, (a.y+b.y)/2 - 2, 9, true);
    heroReach(false);
    dogasCheer();
    addScore(true);
    say('大烟花!星屑 +10');
    await sleep(2200);
    hush();
    await sleep(700);
  } else {
    // 单手够一颗星
    const slot=SLOTS[(round*3)%SLOTS.length];
    say('举起手 · 够向星星');
    const star=placeStar(slot.x,slot.y);
    await sleep(600);
    heroReach(true);
    star.classList.add('aiming');
    await sleep(350);
    const ring=spawnRing(slot.x,slot.y);
    say('稳住 · 保持 1.5 秒');
    await sleep(HOLD_MS);
    ring.remove();
    star.remove();
    burstFireworks(slot.x, slot.y, 4, false);
    heroReach(false);
    dogasCheer();
    addScore(false);
    say('点亮!星屑 +5');
    await sleep(1400);
    hush();
    await sleep(650);
  }
}

async function runShow(){
  round=0;
  await sleep(600);
  say('今晚一起看星星吧');
  await sleep(1600);
  hush();
  await sleep(400);
  // 有限 6 轮演示,结束进结算
  for(let i=0;i<6;i++){
    await playRound();
  }
  await sleep(300);
  endShow();
}

function playStreakFlame(){
  const win=document.getElementById('streakWin');
  if(!win) return;
  win.querySelectorAll('.flame,.flame-plus,.flame-spark,.streak-days,.streak-sub').forEach(el=>{
    el.style.animation='none';void el.offsetWidth;el.style.animation='';
  });
  win.classList.add('go');
}

function endShow(){
  hush();
  document.getElementById('rStars').textContent=codexCount;
  document.getElementById('rFw').textContent=fwCount;
  document.getElementById('result').classList.remove('hide');
  setTimeout(playStreakFlame,800);   // 数据出现后再点燃火苗
}

/* ============ 3秒倒计时(三关统一) ============ */
function runCountdown(done){
  const cd=document.getElementById('countdown');
  const cdNum=document.getElementById('cdNum');
  cd.classList.remove('hide');
  let n=3;
  (function step(){
    if(n>0){ cdNum.textContent=n; cdNum.className='cd-num cd-pop'; }
    else{ cdNum.textContent='GO!'; cdNum.className='cd-num go cd-pop'; }
    void cdNum.offsetWidth;
    if(n>=0){ n--; setTimeout(step,1000); }
    else{ cd.classList.add('hide'); done&&done(); }
  })();
}

function start(){
  document.getElementById('intro').classList.add('hide');
  document.getElementById('result').classList.add('hide');
  // 重置分数
  fwCount=0; dustCount=0; codexCount=0;
  fwEl.textContent=0; dustEl.textContent=0; renderCodex();
  const v=document.getElementById('bgvid');
  if(v){ v.currentTime=0; v.play().catch(()=>{}); }
  runCountdown(runShow);   // 先 3 秒倒计时,再开始
}
document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('againBtn').addEventListener('click',start);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();start();}});

// 截图/自动演示:带 auto=1 直接开始
if(location.search.indexOf('auto=1')>=0){ setTimeout(start,300); }
// end=1 调试入口:直接看结算页火苗+1
if(location.search.indexOf('end=1')>=0){
  document.getElementById('intro').classList.add('hide');
  document.getElementById('rStars').textContent=6;
  document.getElementById('rFw').textContent=7;
  document.getElementById('result').classList.remove('hide');
  setTimeout(playStreakFlame,600);
}

</script>
<!-- 右下角「● YOU」点阵脸小窗:载入即装饰脸保底,摄像头就绪后自动升级为真脸点云 -->
<script src="js/you-facecam.js"></script>
<!-- 右下角小窗:实写⇄点阵开关(默认实写,悬停黑蒙版,点击切点阵) -->
<script src="js/facecam-toggle.js"></script>
</body>
