<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今天不低头 · 举臂摘星</title>
<style>
  :root {
    /* Doga 家族配色(沿用夜晚关) */
    --joy: #ea3323;
    --max: #5c6470;
    --chill: #f39c1f;
    --blink: #ff7a29;
    --yummy: #1f3fe6;
    --snow: #eb7fa8;

    /* 夜空 */
    --night-sky-top: #070b28;
    --night-sky-mid: #141a4a;
    --night-sky-bot: #2e2a5e;

    /* 海面 */
    --sea-far: #16305a;
    --sea-near: #0d1e3d;

    --gold: #ffd66b;
    --gold-bright: #ffe89b;
    --star-glow: #cad6ff;

    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html, body {
    height:100%; overflow:hidden;
    font-family:var(--font); color:#e8ecf5;
    background:#04030f;
  }

  /* ==================== 舞台 ==================== */
  #stage {
    position: fixed; inset: 0;
    overflow: hidden;
    background: #04030f url('img/bg/star-scene-final.png') center bottom / cover no-repeat;
  }
  /* 庆祝脉冲:整场景轻微放大回弹 + 一层暖光泛起 */
  #stage.celebrate { animation: stagePulse .7s ease-out; }
  @keyframes stagePulse {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.012); }
    100% { transform: scale(1); }
  }
  #stage.celebrate::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse 60% 40% at 50% 42%, rgba(255,220,150,.16), transparent 70%);
    animation: celebGlow .7s ease-out;
  }
  @keyframes celebGlow{ 0%{opacity:0;} 35%{opacity:1;} 100%{opacity:0;} }

  /* 银河 / 星云带 */
  .galaxy {
    position:absolute;
    top: 4%; left: 50%;
    width: 120%; height: 44%;
    transform: translateX(-50%) rotate(-14deg);
    background:
      radial-gradient(ellipse 60% 40% at 40% 50%, rgba(150,130,255,.16), transparent 70%),
      radial-gradient(ellipse 50% 30% at 65% 45%, rgba(120,180,255,.12), transparent 70%);
    filter: blur(6px);
    pointer-events:none;
    z-index:1;
  }

  /* 背景星点 */
  .star-static {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
    pointer-events: none;
    filter: blur(0.3px);
    z-index:1;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.45; transform: scale(1); }
    50%     { opacity: 1;   transform: scale(1.25); }
  }

  /* 月亮 */
  .moon {
    position: absolute;
    top: 7%; right: 11%;
    width: 84px; height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fffce0 0%, #e6e0bc 60%, rgba(216,212,176,0) 84%);
    box-shadow: 0 0 46px rgba(255,232,155,.42), 0 0 96px rgba(255,232,155,.2);
    z-index: 2;
  }
  .moon::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 62% 66%, rgba(200,195,160,.5), transparent 42%),
               radial-gradient(circle at 44% 40%, rgba(200,195,160,.35), transparent 30%);
    opacity:.5;
  }

  /* ==================== 海面 ==================== */
  .sea {
    position:absolute;
    left:0; right:0;
    top: 52%; height: 20%;
    background: linear-gradient(180deg, var(--sea-far) 0%, var(--sea-near) 100%);
    z-index:2;
    overflow:hidden;
  }
  /* 海平线微光 */
  .sea::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg, transparent, rgba(180,200,255,.5), transparent);
  }
  /* 月光在海面的反光柱 */
  .sea-glint{
    position:absolute;
    top:0; bottom:0;
    right: 12%;
    width: 90px;
    transform: translateX(50%);
    background: linear-gradient(180deg, rgba(255,240,180,.55), rgba(255,240,180,.06) 90%);
    filter: blur(3px);
    z-index:3;
    -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 3px, transparent 3px 8px);
            mask-image: repeating-linear-gradient(180deg, #000 0 3px, transparent 3px 8px);
    animation: glint 4s ease-in-out infinite;
  }
  @keyframes glint {
    0%,100% { opacity:.75; }
    50%     { opacity:1; }
  }

  /* ==================== 草丛栏(海堤上的草) ==================== */
  .grass-belt{
    position:absolute;
    left:0; right:0;
    top: 68%; height: 8%;
    z-index:5;
  }

  /* ==================== 堤道地面 ==================== */
  .promenade{
    position:absolute;
    left:0; right:0; bottom:0;
    height: 26%;
    background: linear-gradient(180deg, #2a2740 0%, #201d33 60%, #17142a 100%);
    z-index:6;
    box-shadow: 0 -10px 30px rgba(0,0,0,.45);
  }
  /* 堤道铺装横缝 */
  .promenade::before{
    content:"";position:absolute;inset:0;
    background: repeating-linear-gradient(90deg, transparent 0 78px, rgba(0,0,0,.28) 78px 80px);
    opacity:.6;
  }
  /* 堤道与草丛的护栏边 */
  .rail{
    position:absolute;
    left:0; right:0;
    top: 74.5%;
    height: 6px;
    background: linear-gradient(180deg, #4a4668, #2c2942);
    z-index:6;
  }

  /* ==================== HUD ==================== */
  .hud-title {
    position: absolute;
    top: 20px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    color: #05030d;
    padding: 6px 22px;
    border-radius: 999px;
    font-size: 15px; font-weight: 800;
    letter-spacing: 1px;
    box-shadow: 0 4px 18px rgba(255,214,107,.4);
    z-index: 40;
  }
  .hud-chip{
    position:absolute; top:20px;
    display:flex; align-items:center; gap:7px;
    background: rgba(12,16,44,.72);
    border:1px solid rgba(255,214,107,.4);
    padding:7px 15px;
    border-radius:999px;
    font-size:14px; font-weight:800;
    color:var(--gold-bright);
    z-index:40;
    backdrop-filter: blur(6px);
  }
  .hud-chip .ic{ font-size:15px; }
  #chipFw{ left:20px; }
  #chipDust{ left:20px; top:60px; }

  /* 星座图鉴卡 */
  .codex{
    position:absolute; top:20px; right:20px;
    width:150px;
    background: rgba(12,16,44,.72);
    border:1px solid rgba(255,214,107,.35);
    border-radius:16px;
    padding:12px 14px;
    z-index:40;
    backdrop-filter: blur(6px);
  }
  .codex h4{ font-size:12px; color:var(--gold-bright); letter-spacing:1px; margin-bottom:8px; font-weight:800;}
  .codex .count{ font-size:22px; font-weight:900; color:#fff; }
  .codex .count small{ font-size:12px; color:#9aa3c7; font-weight:700; }
  #codexSvg{ width:100%; height:64px; display:block; margin-top:4px; }

  /* ==================== 可摘星星 ==================== */
  .pick-star{
    position:absolute;
    width:38px; height:38px;
    transform: translate(-50%,-50%);
    z-index:8;
    pointer-events:none;
    animation: starBob 3.4s ease-in-out infinite;
  }
  @keyframes starBob{
    0%,100%{ transform: translate(-50%,-50%) translateY(0); }
    50%    { transform: translate(-50%,-50%) translateY(-8px); }
  }
  .pick-star svg{ width:100%; height:100%; overflow:visible; }
  .pick-star .halo{
    position:absolute; inset:-40%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,224,130,.55), transparent 68%);
    animation: haloPulse 2.2s ease-in-out infinite;
  }
  @keyframes haloPulse{
    0%,100%{ opacity:.6; transform:scale(1); }
    50%    { opacity:1;  transform:scale(1.18); }
  }
  /* 星星被"够到":光晕加速 */
  .pick-star.aiming{ animation: none; }
  .pick-star.aiming .halo{ animation: haloPulse 1s ease-in-out infinite; }
  /* 金色倒计时圈 */
  .aim-ring{
    position:absolute;
    width:78px; height:78px;
    transform: translate(-50%,-50%) rotate(-90deg);
    pointer-events:none;
    z-index:9;
  }
  .aim-ring circle{
    fill:none;
    stroke:var(--gold-bright);
    stroke-width:4;
    stroke-linecap:round;
    filter: drop-shadow(0 0 6px var(--gold));
    stroke-dasharray: 226;
    stroke-dashoffset: 226;
  }
  .aim-ring.run circle{ animation: ringFill 1.5s linear forwards; }
  @keyframes ringFill{ to { stroke-dashoffset: 0; } }

  /* ==================== 烟花(大绽放) ==================== */
  .firework {
    position: absolute;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 9;
    --burst: 30vmin;         /* 绽放半径,普通 */
    animation: fwFade 3.6s ease-out forwards;
  }
  @keyframes fwFade { 0%{opacity:0;} 5%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }
  /* 粒子:向外飞散并缓慢下坠 */
  .firework .particle {
    position: absolute; top: 0; left: 0;
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 12px 3px currentColor;
    animation: fwParticle 3.4s cubic-bezier(.12,.55,.25,1) forwards;
  }
  /* 亮核闪光 */
  .firework::before {
    content: ""; position: absolute; top: 0; left: 0;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.98) 0%, rgba(255,240,190,.55) 35%, transparent 70%);
    transform: translate(-50%, -50%);
    animation: fwCenter 1.1s ease-out forwards;
  }
  @keyframes fwCenter {
    0%{opacity:1;transform:translate(-50%,-50%) scale(.4);}
    55%{opacity:1;transform:translate(-50%,-50%) scale(1.5);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(2.6);}
  }
  @keyframes fwParticle {
    0%   {opacity:1; transform: rotate(var(--rot)) translateY(0) scale(1.3);}
    15%  {opacity:1; transform: rotate(var(--rot)) translateY(calc(var(--burst) * -0.85)) scale(1.1);}
    80%  {opacity:.9;}
    100% {opacity:0; transform: rotate(var(--rot)) translateY(calc(var(--burst) * -1)) translateX(8px) translateY(10px) scale(.4);}
  }
  /* 大烟花(双手高潮) */
  .firework.big{ --burst: 46vmin; }
  .firework.big::before{ width:140px; height:140px; }
  .firework.big .particle{ width:8px; height:8px; }

  /* ==================== Doga 家族群像 ==================== */
  .dogas-row {
    position: absolute;
    left: 0; right: 0;
    bottom: 5%;
    height: 34%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 1.6%;
    z-index: 15;
    pointer-events:none;
  }
  .doga {
    position: relative;
    transform-origin: 50% 100%;
    animation: dogaBreath 4s ease-in-out infinite;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.4));
  }
  .doga img{
    display:block;
    height:100%;
    width:auto;
    /* 背光夜景:整体压暗一点,融进夜色 */
    filter: brightness(.82) saturate(.92);
  }
  @keyframes dogaBreath {
    0%,100%{ transform: translateY(0) scale(1); }
    50%    { transform: translateY(-2px) scale(1.015); }
  }
  /* 庆祝:上跳 + 轻微放大(3D图自带举臂造型) */
  .doga.cheer { animation: dogaJump .7s ease-out; }
  @keyframes dogaJump {
    0%   { transform: translateY(0) scale(1) rotate(0deg); }
    30%  { transform: translateY(-30px) scale(1.08) rotate(-3deg); }
    55%  { transform: translateY(-6px) scale(1.03) rotate(2deg); }
    75%  { transform: translateY(-12px) scale(1.05) rotate(-1deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
  }
  .doga.cheer img{ filter: brightness(1) saturate(1); }
  /* 够星保持:整体上浮微晃(演示"举臂→保持"训练动作) */
  .doga.reach{ animation: reachSway 1.5s ease-in-out infinite; }
  .doga.reach img{ filter: brightness(1.05) saturate(1); }
  @keyframes reachSway{
    0%,100%{ transform: translateY(-4px) scale(1.02); }
    50%    { transform: translateY(-11px) scale(1.04); }
  }
  /* 头顶反应表情 */
  .doga .react{
    position:absolute; top:-10px; left:50%;
    transform:translateX(-50%) scale(0);
    font-size:24px;
    opacity:0;
    z-index:2;
  }
  .doga.cheer .react{ animation: reactPop .8s ease-out; }
  @keyframes reactPop{
    0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.4);}
    40%{opacity:1;transform:translateX(-50%) translateY(-8px) scale(1.1);}
    100%{opacity:0;transform:translateX(-50%) translateY(-22px) scale(.9);}
  }

  /* ==================== 玩家小窗占位 ==================== */
  #cam-preview {
    position: absolute;
    width: 128px; height: 128px;
    bottom: 5%; right: 3%;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--gold);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    z-index: 30;
    background: radial-gradient(circle at 50% 40%, #241f43, #100c26);
    display:flex; align-items:center; justify-content:center;
  }
  #cam-preview .ph-silhouette{ width:78%; height:78%; }
  .face-label {
    position: absolute;
    bottom: -20px; left: 50%; transform: translateX(-50%);
    background: rgba(10,15,46,0.85);
    color: var(--gold-bright);
    padding: 3px 12px; border-radius: 8px;
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    white-space: nowrap;
  }
  .face-dot {
    position: absolute; top: 8px; right: 8px;
    width: 8px; height: 8px; border-radius: 50%;
    background: #6bff9d; box-shadow: 0 0 8px #6bff9d;
    animation: dotBlink 2s ease-in-out infinite; z-index:2;
  }
  @keyframes dotBlink { 0%,100%{opacity:1;} 50%{opacity:.4;} }

  /* 中部引导文案 */
  .coach-tip{
    position:absolute;
    top: 40%; left:50%; transform:translateX(-50%);
    background: rgba(10,15,46,.8);
    border:1px solid rgba(255,214,107,.4);
    color:var(--gold-bright);
    padding:9px 20px; border-radius:999px;
    font-size:14px; font-weight:800; letter-spacing:1px;
    z-index:38;
    backdrop-filter: blur(6px);
    white-space:nowrap;
    opacity:0;
    transition: opacity .5s;
  }
</style>
</head>
<body>
<div id="stage">
  <!-- 场景(星空/海堤/六只狗)已在背景底图 star-scene-final.png 中 -->

  <!-- HUD -->
  <div class="hud-title">举臂摘星 · 星光派对</div>
  <div class="hud-chip" id="chipFw"><span class="ic">🎆</span><span>烟花 <b id="fwCount">0</b></span></div>
  <div class="hud-chip" id="chipDust"><span class="ic">✦</span><span>星屑 <b id="dustCount">0</b></span></div>
  <div class="codex">
    <h4>今日星座</h4>
    <div class="count"><span id="codexNum">0</span><small>/12 颗</small></div>
    <svg id="codexSvg" viewBox="0 0 150 64"></svg>
  </div>

  <div class="coach-tip" id="coachTip">🙌 举起双手 · 够向星空</div>

  <!-- 玩家小窗占位 -->
  <div id="cam-preview">
    <div class="face-dot"></div>
    <svg class="ph-silhouette" viewBox="0 0 100 100">
      <g fill="rgba(255,214,107,.85)">
        <circle cx="50" cy="34" r="17"/>
        <path d="M22 84 Q22 58 50 58 Q78 58 78 84 Z"/>
        <rect x="30" y="30" width="6" height="26" rx="3" transform="rotate(28 33 43)"/>
        <rect x="64" y="30" width="6" height="26" rx="3" transform="rotate(-28 67 43)"/>
      </g>
    </svg>
    <div class="face-label">举臂中 · 演示</div>
  </div>
</div>

<script>
const stage = document.getElementById('stage');

/* ============ 闪烁星点(叠在底图星空上,增加"活"的感觉) ============ */
(function genStars(){
  for(let i=0;i<46;i++){
    const s=document.createElement('div');
    s.className='star-static';
    const sz=Math.random()*2+1.2;
    s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*50+'%';   // 只在上半天空区
    s.style.animationDelay=(Math.random()*3)+'s';
    stage.appendChild(s);
  }
})();

/* ============ 可摘星星 ============ */
function starSVG(){
  return `<div class="halo"></div>
  <svg viewBox="0 0 40 40">
    <defs>
      <radialGradient id="sg" cx="50%" cy="42%">
        <stop offset="0%" stop-color="#fffbe6"/>
        <stop offset="55%" stop-color="#ffe08a"/>
        <stop offset="100%" stop-color="#f5b73c"/>
      </radialGradient>
    </defs>
    <path d="M20 2 L24.7 14.5 L38 15.2 L27.6 23.6 L31.2 36.5 L20 29 L8.8 36.5 L12.4 23.6 L2 15.2 L15.3 14.5 Z"
      fill="url(#sg)" stroke="#fff3c4" stroke-width="1"/>
  </svg>`;
}
// 星星散在中上部(15%~40% 高度区,举到120-140°够得到)
const STAR_SLOTS = [
  {x:26, y:26}, {x:44, y:20}, {x:60, y:28}, {x:74, y:23}, {x:37, y:34}, {x:66, y:38}
];
function placeStar(xPct, yPct){
  const el=document.createElement('div');
  el.className='pick-star';
  el.style.left=xPct+'%';
  el.style.top=yPct+'%';
  el.innerHTML=starSVG();
  stage.appendChild(el);
  return el;
}

/* ============ 星座图鉴 ============ */
const CODEX_PTS=[[18,42],[38,20],[58,34],[80,16],[104,40],[128,24],[75,50]];
let codexCount=0;
function renderCodex(){
  const svg=document.getElementById('codexSvg');
  svg.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  for(let i=0;i<codexCount-1 && i<CODEX_PTS.length-1;i++){
    const l=document.createElementNS(ns,'line');
    l.setAttribute('x1',CODEX_PTS[i][0]); l.setAttribute('y1',CODEX_PTS[i][1]);
    l.setAttribute('x2',CODEX_PTS[i+1][0]); l.setAttribute('y2',CODEX_PTS[i+1][1]);
    l.setAttribute('stroke','rgba(255,214,107,.5)'); l.setAttribute('stroke-width','1');
    svg.appendChild(l);
  }
  for(let i=0;i<CODEX_PTS.length;i++){
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',CODEX_PTS[i][0]); c.setAttribute('cy',CODEX_PTS[i][1]);
    c.setAttribute('r', i<codexCount?2.6:1.4);
    c.setAttribute('fill', i<codexCount?'#ffe89b':'rgba(255,255,255,.25)');
    if(i<codexCount) c.setAttribute('filter','drop-shadow(0 0 4px #ffd66b)');
    svg.appendChild(c);
  }
}
renderCodex();

/* ============ 烟花 ============ */
function spawnFirework(xPct, yPct, big){
  const colors=['#ff9db1','#9bffb0','#ffd66b','#a8d0ff','#ffb0f5','#a4f5ff'];
  const color=colors[Math.floor(Math.random()*colors.length)];
  const fw=document.createElement('div');
  fw.className='firework'+(big?' big':'');
  fw.style.left=xPct+'%'; fw.style.top=yPct+'%';
  const n=big?22:14;
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.color=color; p.style.background=color;
    p.style.setProperty('--rot',(i*360/n)+'deg');
    fw.appendChild(p);
  }
  stage.appendChild(fw);
  setTimeout(()=>fw.remove(),2000);
}

/* 多发爆发:围绕中心点错开时间/位置放 n 朵烟花(演示更盛大) */
function burstFireworks(cx, cy, n, big){
  for(let i=0;i<n;i++){
    const dx=(i===0?0:(Math.random()-0.5)*38);
    const dy=(i===0?0:(Math.random()-0.5)*22);
    const delay=i*180+Math.random()*120;
    setTimeout(()=>spawnFirework(cx+dx, cy+dy, big && i===0 ? true : (Math.random()<0.4)), delay);
  }
}

/* ============ 分数 ============ */
let fwCount=0, dustCount=0;
const fwEl=document.getElementById('fwCount');
const dustEl=document.getElementById('dustCount');
function addScore(big){
  fwCount+=big?2:1;
  dustCount+=big?10:5;
  fwEl.textContent=fwCount;
  dustEl.textContent=dustCount;
  if(codexCount<12){ codexCount++; renderCodex(); }
}

/* 庆祝:场景做一次欢庆脉冲(底图微微一弹 + 屏幕泛光),狗已在底图中静态举手 */
function dogasCheer(){
  stage.classList.remove('celebrate');
  void stage.offsetWidth;
  stage.classList.add('celebrate');
  setTimeout(()=>stage.classList.remove('celebrate'), 700);
}
// 够星保持:此版狗在底图中,无需单独举臂(保留空函数不改状态机结构)
function heroReach(on){ /* no-op: dogs are baked into the background image */ }

/* ============ 倒计时圈 ============ */
function spawnRing(xPct, yPct){
  const r=document.createElement('div');
  r.className='aim-ring';
  r.style.left=xPct+'%'; r.style.top=yPct+'%';
  r.innerHTML='<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/></svg>';
  stage.appendChild(r);
  void r.offsetWidth;
  r.classList.add('run');
  return r;
}

/* ============ 旁白 ============ */
const tipEl=document.getElementById('coachTip');
function say(txt){
  tipEl.textContent=txt;
  tipEl.style.opacity='1';
}
function hush(){ tipEl.style.opacity='0'; }

/* ============ 自动播放导演状态机 ============ */
// 星星落点(中上部,举到 120-140° 够得到;不逼顶不逼边)
const SLOTS=[
  {x:30,y:24},{x:46,y:19},{x:62,y:26},{x:72,y:21},
  {x:38,y:31},{x:56,y:22},{x:68,y:33},{x:44,y:27}
];
let round=0;
const HOLD_MS=1500;

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function playRound(){
  const isBig = (round===2);            // 第 3 轮演双手大烟花高潮
  round++;

  if(isBig){
    // 双手够两颗星
    const a=SLOTS[1], b=SLOTS[5];
    say('🙌 双手一起 · 够两颗星!');
    const s1=placeStar(a.x,a.y), s2=placeStar(b.x,b.y);
    await sleep(500);
    heroReach(true);
    s1.classList.add('aiming'); s2.classList.add('aiming');
    await sleep(400);
    const r1=spawnRing(a.x,a.y), r2=spawnRing(b.x,b.y);
    await sleep(HOLD_MS);
    r1.remove(); r2.remove();
    s1.remove(); s2.remove();
    // 高潮:满屏多发大烟花
    burstFireworks((a.x+b.x)/2, (a.y+b.y)/2 - 2, 9, true);
    heroReach(false);
    dogasCheer();
    addScore(true);
    say('✨ 大烟花!星屑 +10');
    await sleep(2200);
    hush();
    await sleep(700);
  } else {
    // 单手够一颗星
    const slot=SLOTS[(round*3)%SLOTS.length];
    say('🌟 举起手 · 够向星星');
    const star=placeStar(slot.x,slot.y);
    await sleep(600);
    heroReach(true);
    star.classList.add('aiming');
    await sleep(350);
    const ring=spawnRing(slot.x,slot.y);
    say('稳住 · 保持 1.5 秒');
    await sleep(HOLD_MS);
    ring.remove();
    star.remove();
    burstFireworks(slot.x, slot.y, 4, false);
    heroReach(false);
    dogasCheer();
    addScore(false);
    say('🎆 点亮!星屑 +5');
    await sleep(1400);
    hush();
    await sleep(650);
  }
}

async function director(){
  await sleep(800);
  say('🌙 今晚一起看星星吧');
  await sleep(1800);
  hush();
  await sleep(500);
  // 无限循环演示
  while(true){
    await playRound();
  }
}
director();
</script>
