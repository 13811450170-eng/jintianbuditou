<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今天不低头 · 单次报告</title>
<style>
:root {
  --bg:          #EDEDF0;
  --card:        #FFFFFF;
  --card-alt:    #F5F5F7;
  --line:        rgba(10, 10, 15, 0.06);
  --line-hard:   rgba(10, 10, 15, 0.1);

  --ink:         #0A0A0F;
  --ink-2:       #3A3A45;
  --ink-3:       #6B6B7A;
  --ink-4:       #A8A8B3;

  --neck:        #00A3FF;
  --neck-bg:     #E1F2FF;
  --shoulder:    #7C5AFF;
  --shoulder-bg: #EBE5FF;
  --eye:         #4CAF88;
  --eye-bg:      #E1F5EC;

  --gold:        #FFB800;
  --gold-bg:     #FFF6DA;
  --fire:        #FF6B4A;
  --success:     #4CAF88;
  --star:        #FFC94D;
  --jd-red:      #E1251B;

  --shadow-1:    0 2px 8px rgba(10, 10, 15, 0.04);
  --shadow-2:    0 6px 20px rgba(10, 10, 15, 0.06);
  --shadow-3:    0 12px 32px rgba(10, 10, 15, 0.1);

  --font: "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, Inter, sans-serif;

  /* 分支色变量 —— 默认拳击,applyBranch 会覆盖 */
  --accent:      #00A3FF;
  --accent-2:    #FF6B4A;
  --accent-bg:   #E1F2FF;
  --accent-bg-2: #FFF0EB;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}

.page {
  max-width: 1440px;
  height: 100vh;
  margin: 0 auto;
  padding: 22px 40px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ========== 顶栏 ========== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--ink-3);
  font-size: 13px;
  cursor: pointer;
  transition: color .2s;
}
.topbar-left:hover { color: var(--ink); }
.topbar-left svg { width: 16px; height: 16px; }

.topbar-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
}

.topbar-right {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-3);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: color .2s;
}
.topbar-right:hover { color: var(--ink); }
.topbar-right svg { width: 18px; height: 18px; }

/* ========== 主体两栏 ========== */
.main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 0.85fr 1fr;
  gap: 20px;
}

/* 左列:战绩 Hero + 练完感觉,竖排填满左栏 */
.hero-col {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
}
.hero-col .hero { flex: 1; min-height: 280px; }
.hero-col .feel-card { flex-shrink: 0; min-height: 132px; display: flex; flex-direction: column; justify-content: center; }

/* --- 左侧:成就 Hero(浅色分支渐变) --- */
.hero {
  background: var(--card);
  border-radius: 28px;
  overflow: hidden;
  position: relative;
  box-shadow: var(--shadow-2);
  display: flex;
  flex-direction: column;
}

.hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 120% 88% at 50% 20%, rgba(150,26,34,0.62) 0%, transparent 58%),
    radial-gradient(ellipse at 50% 40%, #2f0c11 0%, #1c070a 62%, #120406 100%);
}
.hero-bg::after {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 36%, transparent 46%, rgba(8,2,3,0.55) 100%);
}

/* 撒花粒子背景装饰 */
.confetti {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 2px;
  opacity: 0.85;
  animation: confettiFall linear infinite;
  z-index: 1;
}
@keyframes confettiFall {
  0% { transform: translateY(-40px) rotate(0deg); opacity: 0; }
  10% { opacity: 0.85; }
  90% { opacity: 0.85; }
  100% { transform: translateY(600px) rotate(720deg); opacity: 0; }
}

.hero-inner {
  position: relative;
  z-index: 2;
  padding: 30px 34px;
  color: #fff;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 10px;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 100px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: #fff;
  backdrop-filter: blur(4px);
}
.hero-badge-dot {
  width: 6px; height: 6px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(255,255,255,0.9);
}

.hero-branch {
  font-size: 11px;
  color: rgba(255,255,255,0.72);
  letter-spacing: 1.5px;
  font-weight: 600;
}

.hero-middle {
  text-align: center;
  padding: 8px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.stars {
  display: flex;
  gap: 8px;
  justify-content: center;
  filter: drop-shadow(0 4px 12px rgba(255, 201, 77, 0.3));
}
.stars svg {
  width: 42px; height: 42px;
  transition: opacity .3s, transform .3s;
}
.stars svg.filled {
  animation: starPop 0.6s ease-out backwards;
}
.stars svg.dim {
  opacity: 0.22;
}
.stars svg.filled:nth-child(1) { animation-delay: 0.1s; }
.stars svg.filled:nth-child(2) { animation-delay: 0.25s; }
.stars svg.filled:nth-child(3) { animation-delay: 0.4s; }
@keyframes starPop {
  0% { transform: scale(0) rotate(-180deg); opacity: 0; }
  60% { transform: scale(1.2) rotate(15deg); }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.hero-rating {
  display: inline-flex;
  align-items: baseline;
  gap: 12px;
}
.rating-grade {
  font-size: 96px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.04em;
  color: #fff;
  text-shadow: 0 6px 24px rgba(70,8,14,0.4);
}
.rating-lbl {
  font-size: 13px;
  color: rgba(255,255,255,0.8);
  letter-spacing: 2px;
  font-weight: 700;
}

.hero-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 18px;
  border-top: 1px solid rgba(255,255,255,0.22);
}
.streak-change {
  display: flex;
  align-items: center;
  gap: 10px;
}
.streak-icon-round {
  width: 36px; height: 36px;
  background: linear-gradient(180deg, #FFB74D, var(--fire));
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  filter: drop-shadow(0 4px 8px rgba(255, 107, 74, 0.35));
}
.streak-info { display: flex; flex-direction: column; }
.streak-info-num {
  font-size: 15px;
  font-weight: 800;
  color: #fff;
}
.streak-info-num .arrow { color: #FFD27A; margin: 0 4px; }
.streak-info-num .u { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 500; margin-left: 3px; }
.streak-info-lbl {
  font-size: 11px;
  color: rgba(255,255,255,0.65);
}

.joy-quote {
  padding: 8px 16px;
  background: rgba(255,255,255,0.16);
  border-radius: 100px;
  font-size: 12px;
  color: rgba(255,255,255,0.92);
  border: 1px solid rgba(255,255,255,0.28);
  max-width: 320px;
  line-height: 1.5;
  backdrop-filter: blur(4px);
}
.joy-quote strong { color: #fff; font-weight: 700; margin-right: 4px; }

/* --- 右侧:数据+感受+累计+医学 --- */
.details {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  overflow-y: auto;
}

.card {
  background: var(--card);
  border-radius: 20px;
  padding: 16px 20px;
  border: 1px solid var(--line);
}
.card-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.card-head-icon {
  width: 22px; height: 22px;
  border-radius: 7px;
  background: var(--accent-bg);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.card-head-icon svg { width: 13px; height: 13px; }
.card-head-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-3);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* 本次训练卡:撑高吃掉右列剩余空间,使右列底部与左列战绩栏对齐 */
.data-card {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.data-card .data-grid { flex: 1; align-content: center; }

/* 客观数据 - 4 项网格 */
.data-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 10px;
}
.data-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.data-num {
  font-size: 22px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.02em;
  line-height: 1;
}
.data-num .unit { font-size: 12px; font-weight: 700; color: var(--ink-3); margin-left: 2px; }
.data-num .sub  { font-size: 11px; color: var(--ink-4); font-weight: 500; }
.data-label {
  font-size: 11px;
  color: var(--ink-4);
  font-weight: 500;
}

/* 主观感受 - 5 emoji */
.feeling-row {
  display: flex;
  justify-content: space-between;
  gap: 6px;
}
.feel-btn {
  flex: 1;
  padding: 10px 4px;
  background: var(--card-alt);
  border: 2px solid transparent;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-family: inherit;
}
.feel-btn:hover { background: var(--bg); }
.feel-btn.selected {
  background: var(--accent-bg);
  border-color: var(--accent);
}
.feel-emoji { font-size: 22px; line-height: 1; }
.feel-lbl {
  font-size: 10px;
  color: var(--ink-3);
  font-weight: 500;
}
.feel-btn.selected .feel-lbl { color: var(--accent); font-weight: 700; }

/* 累计动态 - 3 条轻量文案 */
.accumulate-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.acc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--ink-2);
  padding: 3px 0;
}
.acc-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.acc-dot.d1 { background: var(--gold); }
.acc-dot.d2 { background: var(--accent); }
.acc-dot.d3 { background: var(--success); }
.acc-item strong {
  color: var(--ink);
  font-weight: 700;
}

/* 医学小卡 */
.med-card {
  padding: 16px 18px;
  background: var(--card);
  border-radius: 20px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 132px;
}
.med-body { flex: 1; }
.med-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  margin-bottom: 6px;
}
.med-desc {
  font-size: 13px;
  color: var(--ink-3);
  line-height: 1.6;
}
.med-link {
  color: var(--accent);
  cursor: pointer;
  font-weight: 600;
}

/* ========== AI 教练分析卡(Phase 4-B) ========== */
.ai-card { padding: 14px 16px; background: var(--card-alt); border-radius: 14px; }
.ai-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.ai-badge {
  font-size: 10px; font-weight: 700; color: var(--accent);
  background: var(--accent-bg); padding: 3px 8px; border-radius: 999px; flex-shrink: 0;
}
.ai-headline { font-size: 13px; font-weight: 700; color: var(--ink); }
.ai-insights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.ai-insights li {
  font-size: 11px; line-height: 1.5; color: var(--ink-3);
  padding-left: 12px; position: relative;
}
.ai-insights li::before {
  content: ''; position: absolute; left: 0; top: 2px; bottom: 2px;
  width: 3px; border-radius: 3px; background: var(--ink-3);
}
.ai-insights li.good::before { background: #35c26a; }
.ai-insights li.warn::before { background: #f0a020; }
.ai-insights li.todo::before { background: #9aa4b2; }
.ai-advice { margin-top: 10px; font-size: 11px; color: var(--ink); font-weight: 600; line-height: 1.55; }

/* ========== 训练方案卡(练后 · health-coaching) ========== */
.plan-focus { font-size: 12px; color: var(--ink); font-weight: 700; line-height: 1.5; margin-bottom: 10px; }
.plan-moves { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.plan-moves li {
  background: var(--card-alt); border-radius: 12px; padding: 9px 12px;
  font-size: 12px; color: var(--ink-2); line-height: 1.5;
}
.plan-moves li b { color: var(--ink); font-weight: 800; }
.plan-moves li .cue { color: var(--ink-3); }
.plan-breaks { font-size: 11px; color: var(--ink-3); line-height: 1.5; }
.plan-breaks strong { color: var(--ink-2); font-weight: 700; }

/* ========== 商业化推荐卡(真实京东商品) ========== */
.shop-card { background: var(--card); border: 1px solid var(--line); }
.shop-reason { font-size: 14px; font-weight: 800; color: var(--ink); line-height: 1.45; margin-bottom: 12px; }
.shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.shop-item {
  display: flex; gap: 10px; align-items: center; text-decoration: none;
  background: var(--card-alt); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px;
  transition: all 0.22s;
}
.shop-item:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
.shop-thumb { width: 72px; height: 72px; border-radius: 10px; flex-shrink: 0; object-fit: cover; background: #fff; }
.shop-info { flex: 1; min-width: 0; }
.shop-name { font-size: 13px; font-weight: 800; color: var(--ink); line-height: 1.3; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.shop-why { font-size: 11px; color: var(--ink-3); line-height: 1.45; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.shop-bottom { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.shop-price { font-size: 15px; font-weight: 900; color: var(--jd-red); }
.shop-price span { font-size: 10px; margin-right: 1px; font-weight: 700; }
.shop-go { flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; padding: 4px 10px; background: var(--jd-red); color: #fff; border-radius: 100px; font-size: 11px; font-weight: 700; }

/* ========== 底部 CTA ========== */
.actions {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}
.actions .btn-ghost,
.actions .btn-primary {
  width: 200px;
  justify-content: center;
}
.btn-primary {
  background: var(--ink);
  color: #fff;
  border: none;
  padding: 14px 28px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
  font-family: inherit;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(10,10,15,0.2); }
.btn-primary svg { width: 15px; height: 15px; }
.btn-ghost {
  background: var(--card);
  color: var(--ink-2);
  border: 1px solid var(--line-hard);
  padding: 13px 24px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.btn-ghost:hover { color: var(--ink); border-color: var(--ink); }

/* ==================== 手机端适配 ==================== */
@media (max-width: 768px) {
  /* body/html 被移动端底座锁成不可滚,故让 .page 自身成为滚动容器 */
  .page {
    height: calc(var(--app-vh, 1vh) * 100);
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 0;
    gap: 14px;
    overflow-x: hidden;
  }
  /* 两栏 → 上下单列:hero 打分栏在上,details 模块依次在下;
     桌面下 .main 是 flex:1 单屏;手机改为高度随内容,让整段能被 .page 滚动 */
  .main {
    grid-template-columns: 1fr;
    gap: 14px;
    flex: none;
    min-height: auto;
    padding-bottom: 84px;
  }
  /* 右栏关掉内部滚动,高度随内容,交给整页滚 */
  .details {
    overflow-y: visible;
    min-height: auto;
    flex: none;
    gap: 12px;
  }
  /* 打分栏给个稳定高度,别被压扁,让星星/RANK 完整可见 */
  .hero { min-height: 340px; }
  /* 底部火苗+Joy 语录:横排会撑破窄屏,改竖排全宽 */
  .hero-bottom {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }
  .joy-quote { max-width: none; }

  /* 客观数据 4 列 → 2 列,窄屏不挤 */
  .data-grid { grid-template-columns: 1fr 1fr; gap: 14px 10px; }

  /* 底部操作栏:固定在屏幕底,双按钮全宽等分,始终可点 */
  .actions {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    justify-content: stretch;
    gap: 10px;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px);
    background: var(--card);
    border-top: 1px solid var(--line);
    box-shadow: 0 -4px 20px rgba(10,10,15,0.06);
    z-index: 50;
  }
  .actions .btn-ghost,
  .actions .btn-primary {
    flex: 1;
    justify-content: center;
    padding: 15px 12px;
    font-size: 14px;
  }
}
</style>

<body>

<div class="page">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-left" onclick="location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回首页
    </div>
    <div class="topbar-title">训练报告</div>
    <div class="topbar-right" title="分享">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
      </svg>
    </div>
  </header>

  <!-- 主体两栏 -->
  <main class="main">

    <!-- 左列:成就 Hero + 练完感觉 -->
    <div class="hero-col">
    <!-- 左:成就 Hero -->
    <section class="hero">
      <div class="hero-bg"></div>

      <!-- 撒花粒子 -->
      <div class="confetti" style="left: 8%;  top: -10px; background: #FFC94D; animation-duration: 4s; animation-delay: 0s;"></div>
      <div class="confetti" style="left: 22%; top: -10px; background: #FF6B4A; animation-duration: 5s; animation-delay: 0.3s;"></div>
      <div class="confetti" style="left: 38%; top: -10px; background: #00A3FF; animation-duration: 4.5s; animation-delay: 0.8s;"></div>

// 兜底默认值 —— 直接访问 mock-report.html 或 sessionStorage 缺失时展示
const DEFAULT_RUN = {
  branch: 'boxing',
  rank:   'A',
  stats:  { time: 30, completion: 87, maxCombo: 8, special: 12 },
  streak: { prev: 12, now: 13 },
  accumulate: {
    badge: '颈部训练营完成 <strong>6/12</strong> 次,再练 6 次点亮徽章',
    joy:   '你和 <strong>Joy</strong> 已经见了 <strong>18 次</strong>面啦',
    total: '累计训练 <strong>23 次 · 12 小时 30 分</strong>',
  },
};

const STAR_COUNT_BY_RANK = { S: 3, A: 3, B: 2, C: 1 };

function readRun() {
  // 优先 URL ?branch=xxx(演示 + 视觉预览用),其次 sessionStorage,最后兜底
  const urlBranch = new URLSearchParams(location.search).get('branch');
  const raw = sessionStorage.getItem('lastRun');
  let run;
  try { run = raw ? JSON.parse(raw) : null; } catch (e) { run = null; }
  if (!run) run = { ...DEFAULT_RUN };
  if (urlBranch && BRANCH_CONFIG[urlBranch]) run.branch = urlBranch;
  return run;
}

function applyBranch() {
  const run = readRun();
  const cfg = BRANCH_CONFIG[run.branch] || BRANCH_CONFIG.boxing;

  // 分支色注入
  const root = document.documentElement;
  root.style.setProperty('--accent',      cfg.accent);
  root.style.setProperty('--accent-2',    cfg.accent2);
  root.style.setProperty('--accent-bg',   cfg.accentBg);
  root.style.setProperty('--accent-bg-2', cfg.accentBg2);

  // 面包屑 / Rank / quote
  document.getElementById('heroBreadcrumb').textContent = cfg.breadcrumb;
  document.getElementById('rankGrade').textContent = run.rank || 'A';
  const quote = cfg.lines[run.rank] || cfg.lines.A;
  document.getElementById('joyQuote').textContent = quote;

  // 星星按评级动态显示
  const starCount = STAR_COUNT_BY_RANK[run.rank] || 3;
  const stars = document.querySelectorAll('#stars svg');
  stars.forEach((s, i) => {
    s.classList.remove('filled', 'dim');
    s.classList.add(i < starCount ? 'filled' : 'dim');
  });

  // 4 数据
  const st = run.stats || DEFAULT_RUN.stats;
  document.getElementById('statTime').textContent = st.time ?? 30;
  document.getElementById('statCompletion').textContent = st.completion ?? 87;
  document.getElementById('statCombo').textContent = 'x' + (st.maxCombo ?? 8);
  document.getElementById('statSpecial').textContent = st.special ?? 12;
  document.getElementById('statSpecialLbl').textContent = cfg.specialLbl;

  // Streak
  const streak = run.streak || DEFAULT_RUN.streak;
  document.getElementById('streakPrev').textContent = streak.prev;
  document.getElementById('streakNow').textContent = streak.now;

  // 累计动态
  const acc = run.accumulate || DEFAULT_RUN.accumulate;
  document.getElementById('accBadge').innerHTML = acc.badge;
  document.getElementById('accJoy').innerHTML = acc.joy;
  document.getElementById('accTotal').innerHTML = acc.total;

  // 医学卡文案
  document.getElementById('medTitle').textContent = cfg.medTitle;
  document.getElementById('medDesc').textContent = cfg.medDesc;

  // 练后闭环(结论 + 训练方案 + 商业化推荐):向 /api/game-report 要一次。
  // 优先 run.ai(旧的现成结论)渲染结论卡;方案/推荐无论是否有 session 都拉(异步,不阻塞报告主体)。
  if (run.ai) renderAI(run.ai);
  fetchGameReport(run.session || null, run.level || run.branch || null, !run.ai);
}

// 向后端 /api/game-report 拉「结论 + 训练方案 + 商业化推荐」。
// 任何失败(无后端/超时/降级)都静默隐藏对应卡,报告主体不受影响。
// fillConclusion=false 时不覆盖已用 run.ai 渲染好的结论卡。
async function fetchGameReport(session, level, fillConclusion) {
  try {
    const profile = readProfile();
    const data = await postJSONSafe('/api/game-report', { session, level, profile }, { timeout: 8000 });
    if (data && data.degraded) { hideReportCards(fillConclusion); localFallbackReport(fillConclusion); return; }
    if (fillConclusion) renderAI(data.conclusion || null);
    renderPlan(data.plan || null);
    renderShop(data.recommend || null);
  } catch (e) {
    hideReportCards(fillConclusion);   // 无后端 / 超时:先隐藏
    localFallbackReport(fillConclusion); // 本地预览环境用示例数据兜底,便于演示/截图(正式站有后端不会走到这)
  }
}

// 仅本地/预览环境(localhost / file / .local)在后端不可用时,用示例数据填充方案+好物,
// 让本地也能看到完整报告。生产域名不注入,避免示例商品误当真数据。
function isLocalPreview() {
  const h = location.hostname;
  return h === 'localhost' || h === '127.0.0.1' || h === '' || h.endsWith('.local');
}
function localFallbackReport(fillConclusion) {
  if (!isLocalPreview()) return;
  renderShop(SAMPLE_RECOMMEND);
}

function hideReportCards(includeConclusion) {
  if (includeConclusion) document.getElementById('aiCard').style.display = 'none';
  document.getElementById('planCard').style.display = 'none';
  document.getElementById('shopCard').style.display = 'none';
}

// 读统一健康档案。练后 AI 需要把基础资料、练前 ROM/部位评分、疲劳度和近期趋势一起看。
function readProfile() {
  try {
    const p = JSON.parse(localStorage.getItem('health_profile_v1'));
    if (!p) return {};
    return {
      basics: p.profile || {},
      zones: p.zones || {},
      fatigue: p.fatigue || {},
      totalSessions: p.totalSessions || 0,
      recentSessions: p.recentSessions || [],
      updatedAt: p.updatedAt || 0,
    };
  } catch { return {}; }
}

// 渲染训练方案卡。空 → 隐藏。
function renderPlan(plan) {
  const card = document.getElementById('planCard');
  if (!plan || plan.degraded || (!plan.focus && !(plan.moves && plan.moves.length))) {
    card.style.display = 'none';
    return;
  }
  document.getElementById('planFocus').textContent = plan.focus || '';
  const ul = document.getElementById('planMoves');
  ul.innerHTML = '';
  for (const m of (plan.moves || [])) {
    const li = document.createElement('li');
    const b = document.createElement('b'); b.textContent = m.name || '';
    const cue = document.createElement('span'); cue.className = 'cue';
    cue.textContent = m.cue ? ' · ' + m.cue : '';
    li.appendChild(b); li.appendChild(cue);
    ul.appendChild(li);
  }
  const breaks = document.getElementById('planBreaks');
  breaks.innerHTML = '';
  if (plan.breaks) {
    const strong = document.createElement('strong'); strong.textContent = '间歇:';
    breaks.appendChild(strong);
    breaks.appendChild(document.createTextNode(' ' + plan.breaks));
  }
  card.style.display = '';
}

// 渲染商业化推荐卡(真实京东商品)。空 → 隐藏。商品名/推荐语用 textContent 防注入。
function renderShop(rec) {
  const card = document.getElementById('shopCard');
  if (!rec || rec.degraded || !(rec.products && rec.products.length)) {
    card.style.display = 'none';
    return;
  }
  document.getElementById('shopReason').textContent = rec.reason || '';
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  for (const p of rec.products) {
    const a = document.createElement('a');
    a.className = 'shop-item';
    a.href = p.url || '#';
    a.target = '_blank'; a.rel = 'noopener noreferrer';

    const img = document.createElement('img');
    img.className = 'shop-thumb'; img.loading = 'lazy';
    img.src = p.image || ''; img.alt = p.name || '';
    img.onerror = function () { this.style.visibility = 'hidden'; };

    const info = document.createElement('div'); info.className = 'shop-info';
    const name = document.createElement('div'); name.className = 'shop-name'; name.textContent = p.name || '';
    const why = document.createElement('div'); why.className = 'shop-why'; why.textContent = p.reason || '';

    const bottom = document.createElement('div'); bottom.className = 'shop-bottom';
    const price = document.createElement('div'); price.className = 'shop-price';
    const yen = document.createElement('span'); yen.textContent = '¥';
    price.appendChild(yen);
    price.appendChild(document.createTextNode(p.price != null ? String(p.price) : '—'));
    const go = document.createElement('span'); go.className = 'shop-go'; go.textContent = '去看看';
    bottom.appendChild(price); bottom.appendChild(go);

    info.appendChild(name);
    if (p.reason) info.appendChild(why);
    info.appendChild(bottom);

    a.appendChild(img); a.appendChild(info);
    grid.appendChild(a);
  }
  card.style.display = '';
}

// 渲染 AI 结论面板(结论卡)。data 为空 → 隐藏整卡(后端不可用时静默降级,不影响报告主体)
function renderAI(data) {
  const card = document.getElementById('aiCard');
  if (!data || data.degraded || !data.insights || !data.insights.length) {
    card.style.display = 'none';
    return;
  }
  document.getElementById('aiHeadline').textContent = data.headline || '';
  const ul = document.getElementById('aiInsights');
  ul.innerHTML = '';
  for (const ins of data.insights) {
    const li = document.createElement('li');
    li.className = ins.level || '';
    li.textContent = ins.text || '';
    ul.appendChild(li);
  }
  document.getElementById('aiAdvice').textContent = data.advice || '';
  card.style.display = '';
}

function pickFeel(el) {
  document.querySelectorAll('.feel-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function replayLastLevel() {
  const run = readRun();
  const cfg = BRANCH_CONFIG[run.branch] || BRANCH_CONFIG.boxing;
  location.href = cfg.levelUrl;
}

// Inline HTML handlers are retained during the incremental migration.
window.pickFeel = pickFeel;
window.replayLastLevel = replayLastLevel;

applyBranch();
</script>
