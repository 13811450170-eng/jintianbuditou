<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今天不低头 · 河道划船</title>
<style>
  /* ============================================================
     关卡 HUD 设计系统 v1 · 划船皮肤(碧蓝金)
     token + 液态玻璃 + 线性SVG图标,三关共用同一套,只换分支色
  ============================================================ */
  :root{
    --gold:#ffd66b;
    --gold-bright:#ffe89b;
    --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --fs-display:60px; --fs-num:44px;
    --glass-blur:14px;
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.18);
    --shadow-1:0 2px 8px rgba(0,0,0,.18);
    --shadow-2:0 8px 24px rgba(0,0,0,.28);
    --ok:#6bff9d;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

    /* 划船 · 碧蓝金皮肤 */
    --brand:#38b6ff;
    --brand-deep:#0b3b52;
    --ink:#0b3b52;
    --glass-bg:rgba(11,45,64,.4);
    --overlay-bg:radial-gradient(circle at 50% 42%, rgba(13,60,88,.74), rgba(3,14,22,.94));
    --title-txt:#0b3b52;

    /* 判定三态(借拳击) */
    --perfect:#6bff9d;
    --good:#ffd66b;
    --miss:#8a8f99;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;font-family:var(--font);background:#8fd4ff;color:#fff;-webkit-font-smoothing:antialiased;}
  #app{position:fixed;inset:0;overflow:hidden;background:#8fd4ff;}

  /* ===== 底层视频 ===== */
  #bgvid{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    min-width:100%;min-height:100%;width:auto;height:auto;
    object-fit:cover;z-index:1;background:#8fd4ff;
  }
  .vignette{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg, rgba(4,25,40,.35) 0%, rgba(4,25,40,0) 18%, rgba(4,25,40,0) 82%, rgba(4,25,40,.30) 100%);
  }

  /* ============================================================
     通用玻璃面:液态玻璃(通透+提色+边缘镜面光+顶部光泽)
  ============================================================ */
  .glass{
    position:relative;
    background:
      linear-gradient(135deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.03) 38%, rgba(255,255,255,.07) 100%),
      var(--glass-bg);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.45),
      inset 0 -10px 22px rgba(255,255,255,.04),
      var(--shadow-2);
    backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  }
  .glass::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    padding:1px;
    background:linear-gradient(135deg,
      rgba(255,255,255,.7) 0%, rgba(255,255,255,.08) 34%,
      rgba(255,255,255,0) 58%, rgba(255,255,255,.32) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }

  /* 线性 SVG 图标 */
  .ico{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* ==================== HUD(复用拳击最新规范:信息英雄化)==================== */
  /* ==================== 顶部动作队列(预告+当前+汇总 三合一,替代标题)==================== */
  /* 主旨「不低头」:核心信息全部上移到屏幕顶部 */
  .action-queue{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:30;
    display:flex;align-items:center;gap:10px;
    padding:12px 20px;border-radius:var(--r-pill);
  }
  .aq-chip{
    position:relative;width:58px;height:58px;border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);
    color:rgba(255,255,255,.5);font-size:26px;font-weight:900;line-height:1;
    transition:transform .2s, background .25s, border-color .25s, color .25s, box-shadow .25s;
  }
  .aq-chip .ico{width:30px;height:30px;stroke-width:2.2;}
  .aq-chip.upcoming{opacity:.55;}
  .aq-chip.active{
    opacity:1;color:var(--title-txt);
    background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    border-color:var(--gold-bright);
    box-shadow:0 0 18px rgba(255,214,107,.55);
    transform:scale(1.26);
    animation:aqBreath .6s ease-in-out infinite alternate;
  }
  .aq-chip.active .ico{stroke:var(--title-txt);}
  @keyframes aqBreath{from{transform:scale(1.2);}to{transform:scale(1.34);}}
  .aq-chip.perfect{opacity:1;color:#0a2b18;background:var(--perfect);border-color:#eafff2;box-shadow:0 0 10px var(--perfect);}
  .aq-chip.perfect .ico{stroke:#0a2b18;}
  .aq-chip.good{opacity:1;color:var(--title-txt);background:var(--good);border-color:#fff6de;box-shadow:0 0 9px var(--good);}
  .aq-chip.good .ico{stroke:var(--title-txt);}
  .aq-chip.miss{opacity:.5;color:rgba(255,255,255,.6);background:rgba(120,124,132,.35);border-color:rgba(255,255,255,.18);}
  .aq-chip.miss .ico{stroke:rgba(255,255,255,.6);}

  /* ===== 左上英雄:大号扩胸次数(参考 Active Arcade,信息当主角不当角标)===== */
  .hud-left{position:absolute;top:20px;left:20px;z-index:30;
    display:flex;flex-direction:column;gap:12px;align-items:flex-start;}
  .score-hero{
    display:flex;flex-direction:column;align-items:flex-start;gap:4px;
    padding:14px 32px 18px;border-radius:var(--r-lg);min-width:186px;
  }
  .score-hero .sh-label{
    display:flex;align-items:center;gap:8px;
    font-size:17px;font-weight:800;letter-spacing:2px;color:var(--gold-bright);opacity:.9;
  }
  .score-hero .sh-label .ico{width:20px;height:20px;}
  .score-hero .sh-num{
    font-size:82px;font-weight:900;line-height:1;color:#fff;letter-spacing:1px;
    text-shadow:0 2px 10px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;
  }
  .score-hero .sh-num.bump{animation:scoreBump .42s cubic-bezier(.34,1.56,.64,1);}
  @keyframes scoreBump{0%{transform:scale(1);}42%{transform:scale(1.26);color:var(--gold-bright);}100%{transform:scale(1);}}
  /* 连击小胶囊(副信息) */
  .chip{
    display:flex;align-items:center;gap:10px;
    padding:11px 22px;border-radius:var(--r-pill);
    color:var(--gold-bright);font-size:18px;font-weight:800;letter-spacing:.5px;
  }
  .chip .ico{width:22px;height:22px;}
  .chip .lb{opacity:.9;}
  .chip .val{color:#fff;font-size:26px;font-weight:900;min-width:26px;text-align:center;}
  .chip .unit{font-size:15px;opacity:.7;font-weight:700;}
  .combo-chip.hot{border-color:rgba(255,214,107,.4);box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 0 14px rgba(255,214,107,.35),var(--shadow-2);}
  .combo-chip.hot .val{color:var(--gold-bright);}

  /* ===== 右上英雄:大号剩余次数(量级照搬拳击倒计时;划船是计次玩法,不施加时间压力)===== */
  .timer-hero{
    position:absolute;top:20px;right:20px;z-index:30;
    display:flex;flex-direction:column;align-items:flex-end;gap:4px;
    padding:14px 32px 18px;border-radius:var(--r-lg);min-width:186px;
  }
  .timer-hero .th-label{
    display:flex;align-items:center;gap:8px;
    font-size:17px;font-weight:800;letter-spacing:2px;color:var(--gold-bright);opacity:.9;
  }
  .timer-hero .th-label .ico{width:20px;height:20px;}
  .timer-hero .th-num{
    font-size:76px;font-weight:900;line-height:1;color:#fff;letter-spacing:1px;
    text-shadow:0 2px 10px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;transition:color .3s;
  }
  .timer-hero .th-num .th-unit{font-size:30px;font-weight:800;opacity:.7;margin-left:2px;}
  /* 最后一次转暖金提醒(克制,守治愈基调) */
  .timer-hero.ending .th-num{color:var(--gold-bright);}

  /* 判定飘字 · 击打感(屏幕正中,做大做干脆——判语的主舞台)*/
  .floater{
    position:absolute;left:50%;top:40%;transform:translateX(-50%);z-index:28;
    text-align:center;pointer-events:none;font-weight:900;
  }
  .floater .big{
    font-size:150px;letter-spacing:3px;line-height:.9;
    background:linear-gradient(135deg,#fff,var(--gold-bright));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 18px rgba(0,0,0,.8)) drop-shadow(0 0 30px var(--brand));
  }
  .floater .sub{font-size:30px;color:#fff;margin-top:8px;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.85);}
  .floater.play{animation:floatHit 1s cubic-bezier(.15,.9,.2,1) forwards;}
  @keyframes floatHit{
    0%{opacity:0;transform:translateX(-50%) scale(.4);}
    14%{opacity:1;transform:translateX(-50%) scale(1.5);}
    28%{transform:translateX(-50%) scale(1);}
    72%{opacity:1;transform:translateX(-50%) scale(1);}
    100%{opacity:0;transform:translateX(-50%) scale(1.02);}
  }

  /* 右下角 · 真人点阵脸小窗(与拳击关统一) */
  .you-cam{
    position:absolute;bottom:20px;right:20px;z-index:30;
    width:168px;height:126px;
    border:3px solid #ffcc00;border-radius:12px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%,#0b0512 0%,#000 100%);
    box-shadow:0 0 22px rgba(255,204,0,.4),0 4px 20px rgba(0,0,0,.6);
  }
  .you-cam video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .you-cam .you-mesh{width:100%;height:100%;display:block;}
  .you-cam .you-label{
    position:absolute;top:8px;right:8px;
    display:flex;align-items:center;gap:5px;
    color:#ff4d5e;font-size:11px;font-weight:900;letter-spacing:2px;
    padding:3px 8px;background:rgba(0,0,0,.55);border-radius:5px;
  }
  .you-cam .you-dot{width:7px;height:7px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e;animation:youBlink 1.2s infinite;}
  @keyframes youBlink{50%{opacity:.3;}}

  /* 开场隐私提示 — 打消面部采集顾虑 */
  .privacy-note{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:14px;
    font-size:13px;color:rgba(255,255,255,.62);letter-spacing:.3px;
  }
  .privacy-note svg{width:15px;height:15px;color:#ffcc00;flex-shrink:0;}
  .privacy-note b{color:rgba(255,255,255,.9);font-weight:700;}

  /* ==================== 开场 / 结算 ==================== */
  .overlay{
    position:absolute;inset:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:16px;padding:24px;
    background:var(--overlay-bg);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .8s;
  }
  .overlay.hide{opacity:0;pointer-events:none;}
  .brand{
    border:1px solid var(--gold);color:var(--gold-bright);
    padding:6px 20px;border-radius:var(--r-pill);
    font-size:13px;font-weight:800;letter-spacing:3px;
    display:flex;align-items:center;gap:8px;
  }
  .brand .ico{width:15px;height:15px;}
  .big-title{
    font-size:var(--fs-display);font-weight:900;letter-spacing:2px;line-height:1.1;
    background:linear-gradient(135deg,#fff 0%,var(--gold-bright) 48%,var(--brand) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .subtitle{font-size:15px;color:rgba(255,255,255,.82);line-height:1.7;max-width:440px;}
  .subtitle b{color:var(--gold-bright);}
  .how-grid{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
  .how-item{
    background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);
    border-radius:var(--r-md);padding:22px 20px;min-width:150px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .how-item .ico{width:40px;height:40px;color:#fff;}
  .how-item .lb{font-size:17px;color:var(--gold-bright);font-weight:800;}
  .how-item .sub2{font-size:13px;color:rgba(255,255,255,.65);}
  .btn{
    margin-top:8px;border:none;cursor:pointer;
    background:var(--brand);
    color:#fff;padding:16px 46px;border-radius:var(--r-pill);
    font-size:18px;font-weight:900;letter-spacing:1.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .12s,filter .12s;
    display:inline-flex;align-items:center;gap:9px;
  }
  .btn .ico{stroke:#fff;}
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn-ghost{
    margin-top:2px;border:none;cursor:pointer;background:transparent;
    color:rgba(255,255,255,.6);font-family:var(--font);
    font-size:14px;font-weight:700;letter-spacing:.5px;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s;
  }
  .btn-ghost:hover{color:var(--gold-bright);}
  .btn-ghost .ico{width:15px;height:15px;stroke:currentColor;}
  .status{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;}

  .result-card{
    border-radius:var(--r-lg);padding:26px 34px;
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .result-stat{display:flex;gap:34px;}
  .result-stat .item{text-align:center;}
  .result-stat .num{font-size:var(--fs-num);font-weight:900;color:var(--gold-bright);line-height:1;}
  .result-stat .lb{font-size:13px;color:rgba(255,255,255,.75);margin-top:7px;}
  .result-up{font-size:14px;color:var(--ok);font-weight:700;display:flex;align-items:center;gap:6px;}
  .result-up .ico{width:15px;height:15px;stroke:var(--ok);}

  /* ---- 结算 · 判语 + 星级并排一行 ---- */
  #result{gap:10px;overflow-y:auto;}
  .res-verdict-row{display:flex;align-items:center;gap:14px;}
  .res-verdict{font-size:19px;font-weight:900;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);letter-spacing:.5px;}
  .res-stars{display:inline-flex;gap:7px;filter:drop-shadow(0 3px 10px rgba(255,201,77,.32));}
  .res-stars svg{width:30px;height:30px;opacity:1;transition:opacity .3s;}
  .res-stars svg.dim{opacity:.22;}
  .res-stars svg.lit{animation:starPop .55s ease-out;}
  .res-stars svg.lit:nth-child(1){animation-delay:.10s;}
  .res-stars svg.lit:nth-child(2){animation-delay:.24s;}
  .res-stars svg.lit:nth-child(3){animation-delay:.38s;}
  @keyframes starPop{0%{transform:scale(0) rotate(-160deg);opacity:0;}60%{transform:scale(1.2) rotate(12deg);}100%{transform:scale(1) rotate(0);opacity:1;}}

  /* ---- 练完感觉 ---- */
  .feel-block{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .feel-q{font-size:13px;color:rgba(255,255,255,.68);font-weight:700;letter-spacing:.5px;}
  .feel-row{display:flex;gap:8px;}
  .feel-btn{
    border:2px solid transparent;background:rgba(255,255,255,.07);
    border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font);
    transition:background .18s,border-color .18s;
  }
  .feel-btn:hover{background:rgba(255,255,255,.13);}
  .feel-btn .em{font-size:22px;line-height:1;}
  .feel-btn .fl{font-size:11px;color:rgba(255,255,255,.68);font-weight:700;}
  .feel-btn.on{background:rgba(255,214,107,.16);border-color:var(--gold);}
  .feel-btn.on .fl{color:var(--gold-bright);}

  /* ---- 看完整报告入口(尺寸与主按钮一致,描边区分主次) ---- */
  .btn-report{
    margin-top:2px;border:1px solid rgba(255,214,107,.42);cursor:pointer;
    background:rgba(255,214,107,.08);color:var(--gold-bright);
    font-family:var(--font);padding:16px 46px;border-radius:var(--r-pill);
    font-size:18px;font-weight:900;letter-spacing:1.5px;
    display:inline-flex;align-items:center;gap:9px;transition:background .15s;
  }
  .btn-report:hover{background:rgba(255,214,107,.17);}
  .btn-report .ico{width:18px;height:18px;stroke:var(--gold-bright);}

  /* 结算页:按钮组整体下移;两个主按钮固定同宽 */
  #result .btn{margin-top:30px;}
  #result .btn,#result .btn-report{width:300px;justify-content:center;padding-left:0;padding-right:0;}
  #result .feel-block{margin-top:18px;}
  #result .btn-ghost{margin-top:20px;}

  .toast{
    position:absolute;top:78px;left:50%;transform:translateX(-50%) translateY(-10px);
    z-index:35;
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 22px;border-radius:var(--r-pill);
    color:var(--gold-bright);font-size:14px;font-weight:700;letter-spacing:.5px;
    opacity:0;transition:all .5s;
  }
  .toast .ico{width:16px;height:16px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- 3秒倒计时(参考老拳击版:超大弹跳数字 + 品牌辉光) ---- */
  .countdown{
    position:absolute;inset:0;z-index:70;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 50%, rgba(0,0,0,.35), rgba(0,0,0,.62));
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .countdown.hide{display:none;}
  .countdown .cd-num{
    font-size:150px;font-weight:900;line-height:1;
    color:var(--gold-bright);
    text-shadow:0 0 50px var(--brand),0 0 100px var(--brand),0 8px 20px rgba(0,0,0,.7);
  }
  .countdown .cd-num.go{
    font-size:96px;letter-spacing:6px;
    background:linear-gradient(135deg,#fff,var(--gold-bright));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 40px var(--brand));
  }
  .cd-pop{animation:cdPop 1s ease-out;}
  @keyframes cdPop{
    0%{transform:scale(.35);opacity:0;letter-spacing:24px;}
    28%{transform:scale(1.25);opacity:1;letter-spacing:2px;}
    70%{transform:scale(1);opacity:1;}
    100%{transform:scale(.82);opacity:0;}
  }

  /* ============================================================
     扩胸运动 · 真玩层:左右【目标圈】+ 双肘准星 + 判定
     借拳击「硬币目标圈 + 径向读秒环 + 准星锁定」那套视觉,
     动作换成扩胸:肘部向两侧打开,够到该侧的金色目标圈。
  ============================================================ */
  .goal-field{position:absolute;inset:0;z-index:26;pointer-events:none;}
  /* 目标圈:一枚扁平金盘 + 一圈够粗白色径向读秒环(读成"一枚硬币") */
  .goal-orb{
    position:absolute;width:118px;height:118px;
    transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;
  }
  .goal-orb.left{left:14%;top:47%;}
  .goal-orb.right{right:14%;top:47%;left:auto;transform:translate(50%,-50%);}
  .orb-timer{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible;}
  .orb-timer .ot-track{fill:none;stroke:rgba(4,25,40,.28);stroke-width:11;}
  .orb-timer .ot-prog{fill:none;stroke:#fff;stroke-width:11;stroke-linecap:round;}
  .orb-core{
    position:relative;width:92px;height:92px;border-radius:50%;
    background:linear-gradient(180deg,#ffe08a 0%,#ffc63f 55%,#f2ab26 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 12px rgba(0,0,0,.4);transition:box-shadow .15s;
  }
  .orb-core .arrow{font-size:46px;font-weight:900;line-height:1;color:var(--title-txt);}
  .goal-orb .tag{
    position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:15px;font-weight:900;letter-spacing:1px;color:#fff;
    padding:3px 12px;border-radius:var(--r-pill);background:rgba(4,25,40,.55);
    text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  .goal-orb.active .orb-core{animation:orbBreath .7s ease-in-out infinite alternate;}
  .goal-orb:not(.active) .orb-core{opacity:.5;}
  .goal-orb:not(.active) .orb-timer{opacity:.4;}
  @keyframes orbBreath{from{transform:scale(1);}to{transform:scale(1.06);}}
  /* 肘部够到该侧圈:金→绿,读秒环也转绿 */
  .goal-orb.locked .orb-core{box-shadow:0 0 24px var(--perfect),0 3px 12px rgba(0,0,0,.4);}
  .goal-orb.locked .orb-timer .ot-prog{stroke:var(--perfect);}
  /* 命中三态 */
  .goal-orb.hit-perfect .orb-core{
    background:linear-gradient(180deg,#9dffc2,#6bff9d 60%,#3fe07f);
    box-shadow:0 0 24px rgba(107,255,157,.65),0 3px 12px rgba(0,0,0,.4);
    animation:orbBounce .5s ease-out both;
  }
  .goal-orb.hit-perfect .orb-core .arrow{color:#0a2b18;}
  .goal-orb.hit-good .orb-core{
    background:linear-gradient(180deg,#ffe08a,#ffc63f 60%,#f2ab26);
    box-shadow:0 0 20px rgba(255,214,107,.55),0 3px 12px rgba(0,0,0,.4);
    animation:orbBounce .5s ease-out both;
  }
  .goal-orb.hit-miss{opacity:.5;}
  .goal-orb.hit-miss .orb-core{background:linear-gradient(180deg,#b6bac2,#8a8f99);box-shadow:none;animation:orbMissShake .4s ease-in-out both;}
  .goal-orb.hit-miss .orb-core .arrow{color:rgba(255,255,255,.75);}
  .goal-orb.hit-perfect .orb-timer,.goal-orb.hit-good .orb-timer,.goal-orb.hit-miss .orb-timer{opacity:0;transition:opacity .3s;}
  @keyframes orbBounce{0%{transform:scale(1);}42%{transform:scale(1.3);}100%{transform:scale(1);}}
  @keyframes orbMissShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

  /* ===== 双肘准星:你两个肘部的替身,全场"你在哪"的线索 ===== */
  .elbow-ret{
    position:absolute;left:50%;top:50%;width:60px;height:60px;z-index:27;
    transform:translate(-50%,-50%);pointer-events:none;
    transition:opacity .3s,border-color .2s;will-change:transform;
  }
  .elbow-ret .er-halo{position:absolute;inset:-6px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 68%);}
  .elbow-ret .er-ring{position:absolute;inset:0;border-radius:50%;border:3px solid #fff;
    box-shadow:0 0 12px rgba(0,0,0,.55),0 0 6px rgba(255,255,255,.5),inset 0 0 8px rgba(255,255,255,.35);}
  .elbow-ret .er-dot{position:absolute;top:50%;left:50%;width:7px;height:7px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(0,0,0,.55);}
  .elbow-ret .er-lb{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);
    font-size:10px;font-weight:900;color:#fff;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.8);opacity:.85;}
  .elbow-ret.locked{transform:translate(-50%,-50%) scale(1.14);}
  .elbow-ret.locked .er-ring{border-color:var(--perfect);box-shadow:0 0 22px var(--perfect),0 0 8px var(--perfect);}
  .elbow-ret.locked .er-dot{background:var(--perfect);}
  .elbow-ret.locked .er-halo{background:radial-gradient(circle,rgba(107,255,157,.28) 0%,rgba(107,255,157,0) 68%);}
  .elbow-ret.lost{opacity:.28;}

  /* 命中冲击波 */
  .shockwave{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;
    border:2px solid;pointer-events:none;z-index:26;animation:shockwaveExpand .5s ease-out both;}
  .shockwave.perfect{border-color:var(--perfect);}
  .shockwave.good{border-color:var(--good);}
  @keyframes shockwaveExpand{0%{width:20px;height:20px;opacity:.9;}100%{width:190px;height:190px;opacity:0;}}

  /* 旁白提示(底部教练语,信息上移不诱导低头 → 放在中上部) */
  .coach-tip{
    position:absolute;left:50%;top:63%;transform:translateX(-50%);z-index:29;
    display:inline-flex;align-items:center;gap:9px;
    padding:10px 22px;border-radius:var(--r-pill);
    color:var(--gold-bright);font-size:16px;font-weight:800;letter-spacing:.5px;
    opacity:0;transition:opacity .3s;white-space:nowrap;
  }
  .coach-tip .ico{width:19px;height:19px;}

  /* 扩胸幅度条(判定同源反馈:借摘星高度条,横向表示两肘打开程度) */
  .open-meter{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:30;
    width:56px;padding:14px 10px;border-radius:var(--r-md);
    display:flex;flex-direction:column;align-items:center;gap:9px;
    opacity:0;transition:opacity .4s;
  }
  .open-meter.show{opacity:1;}
  .open-meter .om-top{width:20px;height:20px;color:var(--gold-bright);}
  .open-meter .om-track{position:relative;width:14px;height:150px;border-radius:var(--r-pill);
    background:rgba(255,255,255,.16);overflow:hidden;}
  .open-meter .om-fill{position:absolute;left:0;right:0;bottom:0;height:0%;border-radius:var(--r-pill);
    background:linear-gradient(0deg,var(--brand),var(--gold));transition:height .1s linear;}
  .open-meter .om-mark{position:absolute;left:-3px;right:-3px;height:2px;background:var(--gold-bright);
    box-shadow:0 0 6px var(--gold-bright);}
  .open-meter .om-mark::after{content:"";position:absolute;right:-5px;top:-2px;width:0;height:0;
    border:3px solid transparent;border-right-color:var(--gold-bright);}
  .open-meter.reached .om-fill{background:linear-gradient(0deg,var(--gold),var(--gold-bright));}
  .open-meter .om-cap{font-size:11px;font-weight:800;color:rgba(255,255,255,.7);letter-spacing:.5px;text-align:center;}
  .open-meter.reached .om-cap{color:var(--gold-bright);}


  .streak-win{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px;}
  .flame-stage{position:relative;width:120px;height:130px;display:flex;align-items:flex-end;justify-content:center;}
  .flame{width:78px;height:96px;transform-origin:50% 100%;
    filter:drop-shadow(0 0 20px rgba(255,152,0,.75)) drop-shadow(0 0 44px rgba(255,152,0,.4));
    animation:flameGrow 1s cubic-bezier(.2,.9,.25,1) both, flameFlicker 1.8s ease-in-out 1s infinite;}
  @keyframes flameGrow{0%{transform:scale(.2) translateY(20px);opacity:0;}45%{transform:scale(1.25) translateY(0);opacity:1;}68%{transform:scale(.92);}100%{transform:scale(1);opacity:1;}}
  @keyframes flameFlicker{0%,100%{transform:scale(1) skewX(0deg);}30%{transform:scale(1.04,.98) skewX(-2deg);}60%{transform:scale(.98,1.03) skewX(2deg);}}
  .flame-plus{position:absolute;top:-6px;left:50%;font-size:34px;font-weight:900;color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.5),0 0 18px #FF9800;
    transform:translateX(-50%) scale(0);animation:plusPop .6s cubic-bezier(.2,.8,.2,1) .55s both;}
  @keyframes plusPop{0%{transform:translateX(-50%) translateY(6px) scale(0);opacity:0;}55%{transform:translateX(-50%) translateY(-10px) scale(1.3);opacity:1;}100%{transform:translateX(-50%) translateY(-14px) scale(1);opacity:1;}}
  .flame-spark{position:absolute;top:40%;left:50%;width:8px;height:8px;border-radius:50%;
    background:#FFD54F;box-shadow:0 0 8px #FFD54F;opacity:0;animation:sparkFly .9s ease-out .5s forwards;}
  @keyframes sparkFly{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(0) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(-70px) scale(.3);}}
  .streak-days{font-size:19px;font-weight:900;color:#FFB74D;letter-spacing:.5px;display:flex;align-items:center;gap:7px;
    opacity:0;animation:daysIn .5s ease-out .9s both;}
  .streak-days .big{font-size:26px;color:#FFD54F;}
  @keyframes daysIn{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
  .streak-sub{font-size:12px;color:rgba(255,255,255,.6);opacity:0;animation:daysIn .5s ease-out 1.1s both;}
  /* 触发前隐藏,加 .go 才播放 */
  .streak-win{visibility:hidden;}
  .streak-win.go{visibility:visible;}
</style>
</head>

<script type="module">
import { createPoseBodyKernel } from "./js/pose-body-kernel.js";
import { track } from "./js/telemetry.js";

const vid=document.getElementById('bgvid');
const repVal=document.getElementById('repVal');
const comboVal=document.getElementById('comboVal');
const comboChip=document.getElementById('comboChip');
const remainVal=document.getElementById('remainVal');
const timerHero=document.getElementById('timerHero');
const actionQueue=document.getElementById('actionQueue');
const toast=document.getElementById('toast');
const intro=document.getElementById('intro');
const result=document.getElementById('result');
const orbLeft=document.getElementById('orbLeft');
const orbRight=document.getElementById('orbRight');
const progLeft=document.getElementById('progLeft');
const progRight=document.getElementById('progRight');
const retLeft=document.getElementById('retLeft');
const retRight=document.getElementById('retRight');
const goalField=document.getElementById('goalField');
const tipEl=document.getElementById('coachTip');
const meterEl=document.getElementById('openMeter');
const omFill=document.getElementById('omFill');
const omCap=document.getElementById('omCap');
const omMark=document.getElementById('omMark');
const dbgEl=document.getElementById('dbgAngle');

function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function T(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id;}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
let timers=[];

/* ============ URL 旋钮(真机标定):?open=&perfect=&sm=&lock=&debug=&film=&auto=&end= ============ */
const Q=new URLSearchParams(location.search);
const qn=(k,d)=>{ const v=parseFloat(Q.get(k)); return isFinite(v)?v:d; };
const OPEN     = qn('open',62);       // 肘外展达标角(度):上臂 vs 躯干竖直,侧平举≈90°
const PERFECT_MARGIN = qn('perfect',15);  // 再多开这么多度 = Perfect(打得更开)
const SM       = qn('sm',0.35);       // 外展角 EMA 平滑
const LOCKR    = qn('lock',16);       // 准星距圈心多近算够到(%)
const DEBUG    = Q.has('debug');
const FILM     = Q.get('film')==='1' || Q.get('auto')==='1';
if(DEBUG && dbgEl) dbgEl.style.display='block';

const TOTAL_REPS = 8;        // 本局扩胸次数
const STROKE_MS  = 3400;     // 一次扩胸的节拍(舒缓,贴医学慢节奏)
const COIN = { left:{x:14,y:47}, right:{x:86,y:47} };   // 两个目标圈屏幕位置(与 CSS 对齐)

/* ============ 判定参数(借拳击,阈值放宽贴合康复慢节奏) ============ */
const JUDGE = { windowPerfect:650, windowGood:1300 };
const MAX_ABD = 155;   // 护栏:别耸肩夹到耳朵

/* ============================================================
 * 上肢姿态桥接:直接从 landmarks 算「肘外展角」+ 按屏幕左右分桶
 * (不改共享内核;摘星用 elevation,本关用 shoulder→elbow 外展)
 * ============================================================ */
let kernel=null, camOK=false, playing=false;
let pose={ present:false, landmarks:null };
let keyHeldUp=false, keyHeldLeft=false, keyHeldRight=false;   // ↑=双肘 ←=左肘 →=右肘
let smOpen={ left:0, right:0 };     // 平滑后的两侧外展角(判定/准星/幅度条同源)
let retPos={ l:{x:42,y:47}, r:{x:58,y:47} };

function syncPose(p){ if(p) pose={ present:p.present, landmarks:p.landmarks }; }
function vis(p){ return p && (p.visibility==null?1:p.visibility); }
function pt(lm,i){ const p=lm&&lm[i]; return (p&&vis(p)>=0.3)?{x:p.x,y:p.y}:null; }

// 肘外展角(度):上臂向量(肩→肘)与躯干竖直向下的夹角。垂放≈0°,侧平举≈90°。
function abduction(sh,el){
  if(!sh||!el) return 0;
  const ax=el.x-sh.x, ay=el.y-sh.y, mag=Math.hypot(ax,ay);
  if(mag<1e-4) return 0;
  const cos=clamp(ay/mag,-1,1);
  return Math.acos(cos)*180/Math.PI;
}
// 只从画面(不含键盘)算两侧外展角,按【屏幕左右侧】分桶(镜像后 screenX = 1 - 原始x)
function computeOpenRaw(){
  const lm=pose.landmarks; let left=0,right=0;
  if(camOK && pose.present && lm){
    const arms=[ {sh:pt(lm,11),el:pt(lm,13)}, {sh:pt(lm,12),el:pt(lm,14)} ];
    for(const a of arms){
      if(!a.sh||!a.el) continue;
      const ang=abduction(a.sh,a.el);
      const screenX=1-a.el.x;
      if(screenX<0.5) left=Math.max(left,ang); else right=Math.max(right,ang);
    }
  }
  return { left, right };
}
// 含键盘兜底的该侧外展角(判定/准星共用)
function openSide(side){
  let v=side==='left'?smOpen.left:smOpen.right;
  if(keyHeldUp) v=Math.max(v,OPEN+25);
  if(side==='left'&&keyHeldLeft) v=Math.max(v,OPEN+25);
  if(side==='right'&&keyHeldRight) v=Math.max(v,OPEN+25);
  return v;
}
function anyInput(){ return (camOK&&pose.present) || keyHeldUp||keyHeldLeft||keyHeldRight; }

/* ============ 通用飘字/提示 ============ */
function showToast(txt,dur=2400){
  toast.innerHTML=`<svg class="ico"><use href="#i-wave"/></svg>${txt}`;toast.classList.add('show');
  T(()=>toast.classList.remove('show'),dur);
}
function floatBig(big,sub){
  const f=document.createElement('div');
  f.className='floater play';
  f.innerHTML=`<div class="big">${big}</div><div class="sub">${sub}</div>`;
  document.getElementById('app').appendChild(f);

}
function say(txt,icon){ tipEl.innerHTML=`<svg class="ico"><use href="#${icon||'i-arms-open'}"/></svg>${txt}`; tipEl.style.opacity='1'; }
function hush(){ tipEl.style.opacity='0'; }

/* ===== 顶部动作队列(照搬拳击):一次扩胸一个 chip,预告/当前/判定三态 ===== */
function buildQueue(){
  if(!actionQueue) return;
  actionQueue.innerHTML='';
  for(let i=0;i<TOTAL_REPS;i++){
    const c=document.createElement('div');
    c.className='aq-chip upcoming';
    c.innerHTML='<svg class="ico"><use href="#i-arms-open"/></svg>';
    actionQueue.appendChild(c);
  }
}
function setActiveChip(idx){
  if(!actionQueue) return;
  [...actionQueue.children].forEach((c,i)=>{
    if(c.classList.contains('perfect')||c.classList.contains('good')||c.classList.contains('miss')) return;
    c.classList.toggle('active', i===idx);
    c.classList.toggle('upcoming', i!==idx);
  });
}
function markChip(idx,kind){
  if(!actionQueue) return;
  const c=actionQueue.children[idx];
  if(c){ c.className='aq-chip '+kind; c.innerHTML='<svg class="ico"><use href="#i-arms-open"/></svg>'; }
}
/* 右上英雄:剩余次数(计次玩法,量级照搬拳击倒计时)*/
function updateRemain(){
  const left=Math.max(0,TOTAL_REPS-resolvedCount);
  remainVal.innerHTML=left+'<span class="th-unit">次</span>';
  timerHero.classList.toggle('ending', left<=1);
}
function spawnShockwave(xPct,yPct,kind){
  const sw=document.createElement('div');
  sw.className='shockwave '+kind;
  sw.style.left=xPct+'%'; sw.style.top=yPct+'%';
  goalField.appendChild(sw);
  T(()=>sw.remove(),520);
}

/* ============ 幅度条(判定同源:两肘都要打开,取较小的一侧) ============ */
if(omMark) omMark.style.bottom=clamp(OPEN/120*100,0,100)+'%';
function updateMeter(){
  const present=anyInput();
  const raw=Math.min(openSide('left'),openSide('right'));
  const pct=clamp((present?raw:0)/120*100,0,100);
  omFill.style.height=pct+'%';
  const reached=present && raw>=OPEN;
  meterEl.classList.toggle('reached',reached);
  if(!present) omCap.textContent = camOK?'找不到人':'扩胸';
  else if(reached) omCap.textContent='够到了';
  else omCap.textContent='再打开';
}

/* ============ 双肘准星:外展角 → 屏幕横向偏移(向两侧打开)。同源:到 OPEN 即压中圈心 ============ */
function updateReticles(){
  const live=anyInput();
  if(!live){
    retPos.l.x+=(50-retPos.l.x)*0.15; retPos.l.y+=(47-retPos.l.y)*0.15;
    retPos.r.x+=(50-retPos.r.x)*0.15; retPos.r.y+=(47-retPos.r.y)*0.15;
    retLeft.classList.add('lost'); retRight.classList.add('lost');
    retLeft.classList.remove('locked'); retRight.classList.remove('locked');
    orbLeft.classList.remove('locked'); orbRight.classList.remove('locked');
    applyRet(); return;
  }
  retLeft.classList.remove('lost'); retRight.classList.remove('lost');
  const oL=openSide('left'), oR=openSide('right');
  // 左肘:静止 42% → 打开到 OPEN 时 14%(左圈心);右肘:58% → 86%(右圈心)
  const txL=42-(42-COIN.left.x)*clamp(oL/OPEN,0,1.1);
  const txR=58+(COIN.right.x-58)*clamp(oR/OPEN,0,1.1);
  retPos.l.x+=(clamp(txL,10,48)-retPos.l.x)*0.28; retPos.l.y+=(COIN.left.y-retPos.l.y)*0.28;
  retPos.r.x+=(clamp(txR,52,90)-retPos.r.x)*0.28; retPos.r.y+=(COIN.right.y-retPos.r.y)*0.28;
  applyRet();
  const lockL=Math.abs(retPos.l.x-COIN.left.x)<=LOCKR;
  const lockR=Math.abs(retPos.r.x-COIN.right.x)<=LOCKR;
  retLeft.classList.toggle('locked',lockL); orbLeft.classList.toggle('locked',lockL && orbLeft.classList.contains('active'));
  retRight.classList.toggle('locked',lockR); orbRight.classList.toggle('locked',lockR && orbRight.classList.contains('active'));
}
function applyRet(){
  retLeft.style.left=retPos.l.x+'%'; retLeft.style.top=retPos.l.y+'%';
  retRight.style.left=retPos.r.x+'%'; retRight.style.top=retPos.r.y+'%';
}

/* ============ 右下角小窗:真人上肢骨架 / Joy 面具(内联自摘星关) ============ */
const meshCanvas=document.querySelector('.you-cam .you-mesh');
const meshCtx=meshCanvas?meshCanvas.getContext('2d'):null;
const GOLD_DOT='rgba(255,204,0,0.55)', GOLD_LINE='rgba(255,230,120,0.9)', WHITE='rgba(255,255,255,0.95)';
function mkRnd(seed){ let s=(seed>>>0)||1; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
function fillQuad(dots,a,b,c,d,n,rnd){ if(!a||!b||!c||!d)return; for(let i=0;i<n;i++){ const u=rnd(),v=rnd(); const tx=a.x+(b.x-a.x)*u,ty=a.y+(b.y-a.y)*u, bx=d.x+(c.x-d.x)*u,by=d.y+(c.y-d.y)*u; dots.push([tx+(bx-tx)*v, ty+(by-ty)*v]); } }
function fillDisc(dots,cx,cy,r,n,rnd){ for(let i=0;i<n;i++){ const t=rnd()*Math.PI*2,rr=Math.sqrt(rnd())*r; dots.push([cx+Math.cos(t)*rr,cy+Math.sin(t)*rr]); } }
function addArc(dots,cx,cy,r,n){ n=n||30; for(let i=0;i<n;i++){const t=i/n*Math.PI*2;dots.push([cx+Math.cos(t)*r,cy+Math.sin(t)*r]);} }
function meshBg(){ const W=meshCanvas.width,H=meshCanvas.height; meshCtx.clearRect(0,0,W,H); meshCtx.fillStyle='rgba(255,204,0,0.03)'; meshCtx.fillRect(0,0,W,H); }
function meshHint(text){ meshBg(); meshCtx.fillStyle='rgba(255,204,0,0.4)'; meshCtx.font='12px -apple-system, sans-serif'; meshCtx.textAlign='center'; meshCtx.fillText(text, meshCanvas.width/2, meshCanvas.height/2); }
function drawSkeleton(J){
  meshBg();
  const rnd=mkRnd(20240816);
  const perp=(a,b,w)=>{ const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1; return {x:-dy/L*w,y:dx/L*w}; };
  const cloud=[];
  const limb=(a,b,w,n)=>{ if(!a||!b)return; const p=perp(a,b,w); fillQuad(cloud,{x:a.x+p.x,y:a.y+p.y},{x:b.x+p.x,y:b.y+p.y},{x:b.x-p.x,y:b.y-p.y},{x:a.x-p.x,y:a.y-p.y},n,rnd); };
  if(J.shL&&J.shR&&J.hipL&&J.hipR) fillQuad(cloud,J.shL,J.shR,J.hipR,J.hipL,210,rnd);
  limb(J.shL,J.elL,7.5,52); limb(J.elL,J.wrL,6,44);
  limb(J.shR,J.elR,7.5,52); limb(J.elR,J.wrR,6,44);
  let mid=null, neck=null;
  if(J.shL&&J.shR){ mid={x:(J.shL.x+J.shR.x)/2,y:(J.shL.y+J.shR.y)/2}; if(J.nose) neck=[mid,J.nose]; }
  if(neck) limb(neck[0],neck[1],5,24);
  if(J.nose&&J.headR){ fillDisc(cloud,J.nose.x,J.nose.y,J.headR*0.92,150,rnd); addArc(cloud,J.nose.x,J.nose.y,J.headR,48); }
  if(J.wrL) fillDisc(cloud,J.wrL.x,J.wrL.y,7.5,36,rnd);
  if(J.wrR) fillDisc(cloud,J.wrR.x,J.wrR.y,7.5,36,rnd);
  meshCtx.fillStyle=GOLD_DOT;
  for(let i=0;i<cloud.length;i++){ meshCtx.fillRect(cloud[i][0]-0.5,cloud[i][1]-0.5,1.4,1.4); }
  const bones=[]; const B=(a,b)=>{ if(J[a]&&J[b]) bones.push([J[a],J[b]]); };
  B('shL','shR'); B('shL','elL'); B('elL','wrL'); B('shR','elR'); B('elR','wrR'); B('shL','hipL'); B('shR','hipR'); B('hipL','hipR');
  meshCtx.strokeStyle=GOLD_LINE; meshCtx.lineWidth=0.9;
  for(const [a,b] of bones){ meshCtx.beginPath(); meshCtx.moveTo(a.x,a.y); meshCtx.lineTo(b.x,b.y); meshCtx.stroke(); }
  if(neck){ meshCtx.beginPath(); meshCtx.moveTo(neck[0].x,neck[0].y); meshCtx.lineTo(neck[1].x,neck[1].y); meshCtx.stroke(); }
  if(J.nose&&J.headR){ meshCtx.beginPath(); meshCtx.arc(J.nose.x,J.nose.y,J.headR,0,Math.PI*2); meshCtx.stroke(); }
  meshCtx.fillStyle=WHITE;
  for(const k of ['shL','shR','wrL','wrR']){ if(J[k]){ meshCtx.beginPath(); meshCtx.arc(J[k].x,J[k].y,2.4,0,Math.PI*2); meshCtx.fill(); } }
  meshCtx.fillStyle='rgba(255,255,255,0.6)';
  for(const k of ['elL','elR']){ if(J[k]){ meshCtx.beginPath(); meshCtx.arc(J[k].x,J[k].y,1.7,0,Math.PI*2); meshCtx.fill(); } }
}
function drawPoseReal(lm){
  const W=meshCanvas.width,H=meshCanvas.height;
  const IDX=[0,11,12,13,14,15,16,23,24];
  let minX=1,minY=1,maxX=0,maxY=0,any=false;
  const v=p=>(p.visibility==null?1:p.visibility);
  for(const i of IDX){ const p=lm[i]; if(!p||v(p)<0.3)continue; const x=1-p.x,y=p.y; any=true; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  if(!any){ meshHint('SEARCHING…'); return; }
  const bw=Math.max(0.001,maxX-minX), bh=Math.max(0.001,maxY-minY), PAD=22;
  let scale=Math.min((W-2*PAD)/(bw*W),(H-2*PAD)/(bh*H)); scale=Math.min(scale,2.6);
  const offX=(W-bw*W*scale)/2-minX*W*scale, offY=(H-bh*H*scale)/2-minY*H*scale;
  const g=i=>{ const p=lm[i]; if(!p||v(p)<0.3)return null; return { x:(1-p.x)*W*scale+offX, y:p.y*H*scale+offY }; };
  const shL=g(11),shR=g(12);
  let headR=16; if(shL&&shR) headR=Math.max(12,Math.hypot(shR.x-shL.x,shR.y-shL.y)*0.34);
  drawSkeleton({ nose:g(0), shL, shR, elL:g(13), elR:g(14), wrL:g(15), wrR:g(16), hipL:g(23), hipR:g(24), headR });
}
const MASK_MODE=(location.search.indexOf('mesh=1')<0);
function drawJoyMaskPose(lm){
  const W=meshCanvas.width,H=meshCanvas.height;
  const v=p=>(p.visibility==null?1:p.visibility);
  const proj=i=>{ const p=lm[i]; if(!p||v(p)<0.3)return null; return { x:(1-p.x)*W, y:p.y*H }; };
  const nose=proj(0), earR=proj(7), earL=proj(8);
  if(window.JoyMask && earL && earR){ JoyMask.drawByPoints(meshCtx,{nose,earL,earR}); }
  else meshHint('SEARCHING…');
}
function drawYou(){
  if(!meshCtx) return;
  const camBox=meshCanvas.closest('.you-cam');
  const maskMode=(!camBox || camBox.dataset.faceMode!=='mesh') && MASK_MODE;
  if(camOK && pose.landmarks){
    if(maskMode){ meshBg(); drawJoyMaskPose(pose.landmarks); }
    else drawPoseReal(pose.landmarks);
  } else meshHint(camOK ? 'SEARCHING…' : '键盘模式 · 按住 ↑ 扩胸');
}

/* ============================================================
 * 真玩:定拍扩胸 · 一拍两肘同开 · 双侧达标才算一次(借拳击节奏)
 * ============================================================ */
const ORB_R=66, ORB_C=2*Math.PI*ORB_R;
[progLeft,progRight].forEach(p=>{ p.setAttribute('stroke-dasharray',ORB_C); p.style.strokeDashoffset='0'; });

let beats=[], resolvedCount=0, reps=0, combo=0, maxCombo=0, sessionStart=0;

function coinsActive(on){
  [orbLeft,orbRight].forEach(o=>{
    o.classList.remove('hit-perfect','hit-good','hit-miss');
    o.classList.toggle('active',on);
    if(!on) o.classList.remove('locked');
  });
}
function beatStart(beat){
  coinsActive(true);
  setActiveChip(beat.idx);
  const dur=Math.max(400, beat.hitTime-(performance.now()-sessionStart));
  [progLeft,progRight].forEach(p=>{
    p.getAnimations&&p.getAnimations().forEach(a=>a.cancel());
    p.animate([{strokeDashoffset:'0'},{strokeDashoffset:String(ORB_C)}],{duration:dur,easing:'linear',fill:'forwards'});
  });
  say('双肘向两侧打开 · 够到金圈','i-arms-open');
}
function stampBoth(kind){
  [orbLeft,orbRight].forEach(o=>{ o.classList.remove('active','locked'); o.classList.add('hit-'+kind); });
  [retLeft,retRight].forEach(r=>r.classList.remove('locked'));
  if(kind!=='miss'){ spawnShockwave(COIN.left.x,COIN.left.y,kind); spawnShockwave(COIN.right.x,COIN.right.y,kind); }
  T(()=>{ [orbLeft,orbRight].forEach(o=>o.classList.remove('hit-perfect','hit-good','hit-miss')); },900);
}

// 判定:双肘都够 OPEN → good;时机准 + 打得更开 → perfect;超时 = miss(治愈不惩罚,只断连击)
function tickJudge(now){
  const t=now-sessionStart;
  const oL=openSide('left'), oR=openSide('right');
  for(const beat of beats){
    if(beat._judged) continue;
    const dt=t-beat.hitTime;
    if(dt < -JUDGE.windowGood) continue;
    if(dt >  JUDGE.windowGood){ beat._reason='timeout'; resolve(beat,'miss'); continue; }
    const bothOpen = oL>=OPEN && oR>=OPEN;
    if(!bothOpen) continue;
    const depth=Math.min(oL,oR);
    // 护栏:别耸到过头(医学安全),超限当没到位继续等
    if(depth>MAX_ABD) continue;
    const inPerfectWin=Math.abs(dt)<=JUDGE.windowPerfect;
    const isPerfectDepth=depth>=OPEN+PERFECT_MARGIN;
    resolve(beat,(inPerfectWin&&isPerfectDepth)?'perfect':'good');
  }
}
function resolve(beat,kind){
  if(beat._judged) return;
  beat._judged=kind; resolvedCount++;
  if(kind==='perfect'||kind==='good'){
    reps++; combo++; maxCombo=Math.max(maxCombo,combo);
    repVal.textContent=reps; comboVal.textContent=combo;
    repVal.classList.remove('bump'); void repVal.offsetWidth; repVal.classList.add('bump');
    comboChip.classList.toggle('hot', combo>=3);
    floatBig(kind==='perfect'?'PERFECT':'GOOD', kind==='perfect'?'扩胸到位 · 肩胛后收':'扩胸 +1 · 挺胸打开');
  } else {
    combo=0; comboVal.textContent=0; comboChip.classList.remove('hot');
    floatBig('跟上','没关系 · 下一次再打开');
  }
  markChip(beat.idx,kind);
  updateRemain();
  stampBoth(kind);
}

/* ============ 主循环(全程常驻) ============ */
function loop(now){
  requestAnimationFrame(loop);
  now=now||performance.now();
  if(kernel && kernel.ready()) syncPose(kernel.tick(now));
  const raw=computeOpenRaw();
  smOpen.left  += (raw.left  - smOpen.left )*SM;
  smOpen.right += (raw.right - smOpen.right)*SM;
  drawYou();
  updateReticles();
  updateMeter();
  if(playing) tickJudge(now);
  if(DEBUG && dbgEl){
    dbgEl.textContent=`左肘:${openSide('left').toFixed(0)}° 右肘:${openSide('right').toFixed(0)}° open:${OPEN} present:${anyInput()?1:0} cam:${camOK?1:0} retL:${retPos.l.x.toFixed(0)} retR:${retPos.r.x.toFixed(0)}`;
  }
}
requestAnimationFrame(loop);

/* ============ 一局流程 ============ */
function runShow(){
  playing=true;
  reps=0; combo=0; maxCombo=0; resolvedCount=0;
  repVal.textContent=0; comboVal.textContent=0;
  comboChip.classList.remove('hot');
  buildQueue(); updateRemain();
  showToast(camOK?'读秒环缩满时,把两肘打开到金圈':'摄像头没就绪 · 按住 ↑ 扩胸',2800);

  sessionStart=performance.now();
  const clock=1500;
  beats=[];
  for(let i=0;i<TOTAL_REPS;i++){
    const appearAt=clock+i*STROKE_MS;
    const hitTime=appearAt+STROKE_MS*0.5;
    const beat={ idx:i, hitTime, _judged:null, _reason:null };
    beats.push(beat);
    T(()=>beatStart(beat), appearAt);
    // 演示/录屏:用键盘兜底自动"扩胸",复用真判定路径
    if(FILM){
      T(()=>{ keyHeldUp=true; }, appearAt+STROKE_MS*0.34);
      T(()=>{ keyHeldUp=false; }, hitTime+320);
    }
  }
  T(()=>endShow(), clock+TOTAL_REPS*STROKE_MS+900);
}

  win.querySelectorAll('.flame,.flame-plus,.flame-spark,.streak-days,.streak-sub').forEach(el=>{
    el.style.animation='none';void el.offsetWidth;el.style.animation='';

}

/* ============ 本局评级(扩胸次数比例 → 星星 + 判语) ============ */
const RANK_TABLE=[
  { min:0.9, stars:3, verdict:'整条河都是你的' },
  { min:0.6, stars:3, verdict:'肩膀彻底打开了' },
  { min:0.3, stars:2, verdict:'还有几下没打开' },
  { min:0,   stars:1, verdict:'先热个身也不错' },
];
function gradeRun(){ const ratio=TOTAL_REPS?reps/TOTAL_REPS:0; return RANK_TABLE.find(t=>ratio>=t.min)||RANK_TABLE[RANK_TABLE.length-1]; }
function pickFeel(el){ document.querySelectorAll('.feel-btn').forEach(b=>b.classList.remove('on')); el.classList.add('on'); }
window.pickFeel=pickFeel;

function endShow(){
  playing=false;
  clearTimers();
  if(kernel) kernel.stopCamera();   // 隐私红线:结束立即释放摄像头
  camOK=false; pose={ present:false, landmarks:null };
  keyHeldUp=keyHeldLeft=keyHeldRight=false;
  coinsActive(false);
  meterEl.classList.remove('show'); hush();
  document.getElementById('rStrokes').textContent=reps;
  document.getElementById('rHold').textContent=maxCombo;

  const g=gradeRun();
  document.getElementById('rVerdict').textContent=g.verdict;
  document.querySelectorAll('#resStars svg').forEach((s,i)=>{
    s.classList.remove('lit','dim'); s.classList.add(i<g.stars?'lit':'dim');
  });
  track('level_finish',{ level:'rowing', reps, combo:maxCombo, stars:g.stars });

  result.classList.remove('hide');
  setTimeout(playStreakFlame,800);
}

/* ============ 3秒倒计时(三关统一) ============ */
function runCountdown(done){
  const cd=document.getElementById('countdown');
  const cdNum=document.getElementById('cdNum');
  cd.classList.remove('hide');
  let n=3;
  (function step(){
    if(n>0){ cdNum.textContent=n; cdNum.className='cd-num cd-pop'; }
    else{ cdNum.textContent='GO!'; cdNum.className='cd-num go cd-pop'; }
    void cdNum.offsetWidth;
    if(n>=0){ n--; setTimeout(step,1000); }
    else{ cd.classList.add('hide'); done&&done(); }
  })();
}

/* ============ 开始 ============ */
async function start(){
  intro.classList.add('hide');
  result.classList.add('hide');
  clearTimers();
  coinsActive(false);
  playing=false;
  if(vid){ vid.currentTime=0; vid.play().catch(()=>{}); }

  // 演示/录屏:不接摄像头,纯键盘脚本自动扩胸
  if(FILM){
    meterEl.classList.add('show');
    runCountdown(runShow);
    return;
  }

  // 真玩:唤起摄像头 + 上肢检测(失败降级键盘,不阻断)
  camOK=false;
  const statusEl=document.querySelector('#intro .status');
  try{
    if(!kernel){
      kernel=createPoseBodyKernel({ video:document.querySelector('.you-cam video'), smooth:0.3 });
      await kernel.loadModel(txt=>{ if(statusEl && txt) statusEl.textContent=txt; });
    }
    await kernel.startCamera();
    camOK=true;
  }catch(e){ camOK=false; }
  meterEl.classList.add('show');
  runCountdown(()=>runShow());
}
document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('againBtn').addEventListener('click',start);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); if(!playing) start(); return; }
  if(e.code==='ArrowUp'){ e.preventDefault(); keyHeldUp=true; }
  if(e.code==='ArrowLeft'){ e.preventDefault(); keyHeldLeft=true; }
  if(e.code==='ArrowRight'){ e.preventDefault(); keyHeldRight=true; }
});
document.addEventListener('keyup',e=>{
  if(e.code==='ArrowUp') keyHeldUp=false;
  if(e.code==='ArrowLeft') keyHeldLeft=false;
  if(e.code==='ArrowRight') keyHeldRight=false;
});

/* 演示 ?film=1 / ?auto=1:进入即自动开始 */
if(FILM){ setTimeout(start,300); }
/* end=1 调试:直接看结算页(满分,走 endShow) */
if(location.search.indexOf('end=1')>=0){
  intro.classList.add('hide'); intro.style.display='none';
  reps=TOTAL_REPS; maxCombo=TOTAL_REPS;
  endShow();
  result.style.transition='none'; result.style.opacity='1';
}

</script>
