<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今天不低头 · Doga 餐厅</title>
<style>
  /* ============================================================
     关卡 HUD 设计系统 v1 · 餐厅皮肤(暖琥珀金)
     token + 液态玻璃 + 线性SVG图标,四关共用同一套,只换分支色
  ============================================================ */
  :root{
    --gold:#ffd66b;
    --gold-bright:#ffe89b;
    --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --fs-display:60px; --fs-num:44px;
    --glass-blur:14px;
    --shadow-1:0 2px 8px rgba(0,0,0,.18);
    --shadow-2:0 8px 24px rgba(0,0,0,.28);
    --ok:#6bff9d;
    /* 餐厅 · 暖琥珀金皮肤 */
    --brand:#f5a623;
    --brand-deep:#5c3410;
    --ink:#3a2a1a;
    --glass-bg:rgba(42,24,16,.42);
    --overlay-bg:radial-gradient(circle at 50% 42%, rgba(58,36,18,.74), rgba(20,12,4,.94));
    --title-txt:#3a2a1a;
    /* 狗狗气泡描边色 */
    --bubble-bg:#fffdf7;
    --joy:#ea3323; --max:#5c6470; --chill:#f39c1f;
    --blink:#8a5a3c; --yummy:#6b6b6b; --snow:#eb7fa8;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;background:#140d04;font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#140d04;}
  .frame{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    overflow:hidden;
  }
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .layer{position:absolute;inset:0;pointer-events:none;}
  .vignette{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg, rgba(20,12,4,.34) 0%, rgba(20,12,4,0) 18%, rgba(20,12,4,0) 80%, rgba(20,12,4,.32) 100%);
  }

  /* ============================================================
     通用玻璃面:液态玻璃(通透+提色+边缘镜面光+顶部光泽)
  ============================================================ */
  .glass{
    position:relative;
    background:
      linear-gradient(135deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.03) 38%, rgba(255,255,255,.07) 100%),
      var(--glass-bg);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.45),
      inset 0 -10px 22px rgba(255,255,255,.04),
      var(--shadow-2);
    backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  }
  .glass::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    padding:1px;
    background:linear-gradient(135deg,
      rgba(255,255,255,.7) 0%, rgba(255,255,255,.08) 34%,
      rgba(255,255,255,0) 58%, rgba(255,255,255,.32) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }

  /* 线性 SVG 图标 */
  .ico{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* ==================== HUD ==================== */
  .hud-title{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:30;
    background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    color:var(--title-txt);
    padding:10px 32px;border-radius:var(--r-pill);
    font-size:18px;font-weight:800;letter-spacing:1.5px;
    box-shadow:var(--shadow-1);
    display:flex;align-items:center;gap:10px;
  }
  .hud-title .ico{stroke:var(--title-txt);width:19px;height:19px;}

  .hud-left{position:absolute;top:16px;left:16px;z-index:30;
    display:flex;flex-direction:column;gap:9px;}
  .chip{
    display:flex;align-items:center;gap:11px;
    padding:11px 19px;border-radius:var(--r-pill);
    color:var(--gold-bright);font-size:16px;font-weight:700;letter-spacing:.5px;
  }
  .chip .ico{width:20px;height:20px;}
  .chip .lb{opacity:.9;}
  .chip .val{color:#fff;font-size:22px;font-weight:900;min-width:22px;text-align:center;}
  .chip .unit{font-size:13px;opacity:.7;font-weight:700;}

  .progress-wrap{
    position:absolute;top:16px;right:16px;z-index:30;width:205px;
    border-radius:var(--r-md);padding:14px 18px;
  }
  .progress-label{display:flex;justify-content:space-between;align-items:center;
    font-size:13px;color:var(--gold-bright);font-weight:800;letter-spacing:1px;
    margin-bottom:10px;}
  .progress-label .pct{color:#fff;font-size:15px;font-weight:900;}
  .progress-track{height:10px;background:rgba(255,255,255,.16);border-radius:var(--r-pill);overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:var(--r-pill);
    background:linear-gradient(90deg,var(--brand),var(--gold));transition:width .5s;}

  /* 判定飘字 · 命中感 */
  .floater{
    position:absolute;left:50%;top:24%;transform:translateX(-50%);z-index:28;
    text-align:center;pointer-events:none;font-weight:900;
  }
  .floater .big{
    font-size:60px;letter-spacing:2px;
    background:linear-gradient(135deg,#fff,var(--gold-bright));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.6)) drop-shadow(0 0 18px var(--brand));
  }
  .floater .sub{font-size:18px;color:#fff;margin-top:4px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.75);}
  .floater.play{animation:floatHit 1.3s cubic-bezier(.2,.8,.2,1) forwards;}
  @keyframes floatHit{
    0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.5);}
    12%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.42);}
    26%{transform:translateX(-50%) translateY(-3px) scale(1.05);}
    100%{opacity:0;transform:translateX(-50%) translateY(-52px) scale(1);}
  }

  /* ---------- 狗狗说话气泡(外圈=喂食保持进度环) ---------- */
  .bubble{
    position:absolute;transform:translate(-50%,-50%) scale(.5);z-index:22;
    background:rgba(42,24,16,.92);color:#fff;font-weight:800;
    font-size:clamp(13px,1.9vw,24px);letter-spacing:1px;
    padding:.52em .95em;border-radius:16px;white-space:nowrap;opacity:0;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    transition:opacity .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .bubble .bubble-txt{position:relative;z-index:2;}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
    width:0;height:0;border:8px solid transparent;border-top-color:rgba(42,24,16,.92);z-index:1;}
  /* 外圈进度环:conic 从 12 点方向顺时针画金边,--p 0→100 表示喂食保持进度,满=闭合 */
  .bubble .bubble-ring{
    position:absolute;inset:-5px;border-radius:21px;padding:5px;pointer-events:none;z-index:0;
    background:conic-gradient(from -90deg, var(--gold-bright) calc(var(--p,0)*1%), rgba(255,255,255,.16) 0);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0;transition:opacity .2s;
  }
  .bubble.feeding .bubble-ring{opacity:1;filter:drop-shadow(0 0 4px rgba(255,214,107,.7));}
  .bubble.done .bubble-ring{opacity:1;background:var(--gold-bright);
    box-shadow:0 0 12px var(--gold-bright);}
  .bubble.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  /* ---------- 目标盘子高亮圈(对准时亮,提示"送到这") ---------- */
  .plate-hi{position:absolute;transform:translate(-50%,-50%);opacity:0;transition:opacity .25s;z-index:16;
    width:clamp(60px,9vw,120px);height:clamp(38px,5.6vw,74px);
    border:3px dashed rgba(255,232,155,.55);border-radius:50%;pointer-events:none;}
  .plate-hi.on{opacity:1;border-style:solid;border-color:var(--gold-bright);
    box-shadow:0 0 18px rgba(255,214,107,.6),inset 0 0 14px rgba(255,214,107,.3);
    animation:plateHiPulse 1s ease-in-out infinite;}
  @keyframes plateHiPulse{50%{box-shadow:0 0 26px rgba(255,214,107,.85),inset 0 0 18px rgba(255,214,107,.45);}}

  /* ---------- 被头控的菜(初始在中央草垫,转头移动送盘) ---------- */
  .dish{position:absolute;transform:translate(-50%,-50%) scale(1);z-index:25;
    width:clamp(92px,13vw,168px);height:auto;pointer-events:none;opacity:0;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));
    will-change:left,top,transform;transition:opacity .3s;}
  .dish img{width:100%;height:auto;display:block;}
  .dish.in{opacity:1;}
  /* 落盘:平滑移到盘子精确位并缩到 50% */
  .dish.landed{transition:left .45s cubic-bezier(.22,1,.36,1),top .45s cubic-bezier(.22,1,.36,1),transform .45s cubic-bezier(.22,1,.36,1),opacity .4s;}

  /* ---------- 命中星光 ---------- */
  .spark{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:21;
    color:var(--gold-bright);font-weight:900;font-size:clamp(16px,2.4vw,30px);
    opacity:0;text-shadow:0 2px 8px rgba(0,0,0,.5);}

  /* ==================== 开场 / 结算 ==================== */
  .overlay{
    position:absolute;inset:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:16px;padding:24px;
    background:var(--overlay-bg);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .8s;
  }
  .overlay.hide{opacity:0;pointer-events:none;}
  .brand{
    border:1px solid var(--gold);color:var(--gold-bright);
    padding:6px 20px;border-radius:var(--r-pill);
    font-size:13px;font-weight:800;letter-spacing:3px;
    display:flex;align-items:center;gap:8px;
  }
  .brand .ico{width:15px;height:15px;}
  .big-title{
    font-size:var(--fs-display);font-weight:900;letter-spacing:2px;line-height:1.1;
    background:linear-gradient(135deg,#fff 0%,var(--gold-bright) 48%,var(--brand) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .subtitle{font-size:15px;color:rgba(255,255,255,.82);line-height:1.7;max-width:440px;}
  .subtitle b{color:var(--gold-bright);}
  .how-grid{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
  .how-item{
    background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);
    border-radius:var(--r-md);padding:22px 20px;min-width:150px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .how-item .ico{width:40px;height:40px;color:#fff;}
  .how-item .lb{font-size:17px;color:var(--gold-bright);font-weight:800;}
  .how-item .sub2{font-size:13px;color:rgba(255,255,255,.65);}
  .btn{
    margin-top:8px;border:none;cursor:pointer;
    background:var(--brand);
    color:#fff;padding:16px 46px;border-radius:var(--r-pill);
    font-size:18px;font-weight:900;letter-spacing:1.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .12s,filter .12s;
    display:inline-flex;align-items:center;gap:9px;
  }
  .btn .ico{stroke:#fff;}
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn-ghost{
    margin-top:2px;border:none;cursor:pointer;background:transparent;
    color:rgba(255,255,255,.6);font-family:var(--font);
    font-size:14px;font-weight:700;letter-spacing:.5px;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s;
  }
  .btn-ghost:hover{color:var(--gold-bright);}
  .btn-ghost .ico{width:15px;height:15px;stroke:currentColor;}
  .status{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;}

  .result-card{
    border-radius:var(--r-lg);padding:26px 34px;
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .result-stat{display:flex;gap:34px;}
  .result-stat .item{text-align:center;}
  .result-stat .num{font-size:var(--fs-num);font-weight:900;color:var(--gold-bright);line-height:1;}
  .result-stat .lb{font-size:13px;color:rgba(255,255,255,.75);margin-top:7px;}
  .result-up{font-size:14px;color:var(--ok);font-weight:700;display:flex;align-items:center;gap:6px;}
  .result-up .ico{width:15px;height:15px;stroke:var(--ok);}

  /* ---- 结算 · 判语 + 星级并排一行 ---- */
  #result{gap:10px;overflow-y:auto;}
  .res-verdict-row{display:flex;align-items:center;gap:14px;}
  .res-verdict{font-size:19px;font-weight:900;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);letter-spacing:.5px;}
  .res-stars{display:inline-flex;gap:7px;filter:drop-shadow(0 3px 10px rgba(255,201,77,.32));}
  .res-stars svg{width:30px;height:30px;opacity:1;transition:opacity .3s;}
  .res-stars svg.dim{opacity:.22;}
  .res-stars svg.lit{animation:starPop .55s ease-out;}
  .res-stars svg.lit:nth-child(1){animation-delay:.10s;}
  .res-stars svg.lit:nth-child(2){animation-delay:.24s;}
  .res-stars svg.lit:nth-child(3){animation-delay:.38s;}
  @keyframes starPop{0%{transform:scale(0) rotate(-160deg);opacity:0;}60%{transform:scale(1.2) rotate(12deg);}100%{transform:scale(1) rotate(0);opacity:1;}}

  /* ---- 练完感觉 ---- */
  .feel-block{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .feel-q{font-size:13px;color:rgba(255,255,255,.68);font-weight:700;letter-spacing:.5px;}
  .feel-row{display:flex;gap:8px;}
  .feel-btn{
    border:2px solid transparent;background:rgba(255,255,255,.07);
    border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font);
    transition:background .18s,border-color .18s;
  }
  .feel-btn:hover{background:rgba(255,255,255,.13);}
  .feel-btn .em{font-size:22px;line-height:1;}
  .feel-btn .fl{font-size:11px;color:rgba(255,255,255,.68);font-weight:700;}
  .feel-btn.on{background:rgba(255,214,107,.16);border-color:var(--gold);}
  .feel-btn.on .fl{color:var(--gold-bright);}

  /* ---- 看完整报告入口(尺寸与主按钮一致,描边区分主次) ---- */
  .btn-report{
    margin-top:2px;border:1px solid rgba(255,214,107,.42);cursor:pointer;
    background:rgba(255,214,107,.08);color:var(--gold-bright);
    font-family:var(--font);padding:16px 46px;border-radius:var(--r-pill);
    font-size:18px;font-weight:900;letter-spacing:1.5px;
    display:inline-flex;align-items:center;gap:9px;transition:background .15s;
  }
  .btn-report:hover{background:rgba(255,214,107,.17);}
  .btn-report .ico{width:18px;height:18px;stroke:var(--gold-bright);}

  /* 结算页:「再喂一次」这组按钮起整体下移;两个主按钮固定同宽 */
  #result .btn{margin-top:30px;}
  #result .btn,#result .btn-report{width:300px;justify-content:center;padding-left:0;padding-right:0;}
  /* 拉开间距:数据卡↔感受、报告按钮↔返回 */
  #result .feel-block{margin-top:18px;}
  #result .btn-ghost{margin-top:20px;}

  .toast{
    position:absolute;top:78px;left:50%;transform:translateX(-50%) translateY(-10px);
    z-index:35;
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 22px;border-radius:var(--r-pill);
    color:var(--gold-bright);font-size:14px;font-weight:700;letter-spacing:.5px;
    opacity:0;transition:all .5s;
  }
  .toast .ico{width:16px;height:16px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- 3秒倒计时(四关统一) ---- */
  .countdown{
    position:absolute;inset:0;z-index:70;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 50%, rgba(0,0,0,.35), rgba(0,0,0,.62));
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .countdown.hide{display:none;}
  .countdown .cd-num{
    font-size:150px;font-weight:900;line-height:1;
    color:var(--gold-bright);
    text-shadow:0 0 50px var(--brand),0 0 100px var(--brand),0 8px 20px rgba(0,0,0,.7);
  }
  .countdown .cd-num.go{
    font-size:96px;letter-spacing:6px;
    background:linear-gradient(135deg,#fff,var(--gold-bright));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 40px var(--brand));
  }
  .cd-pop{animation:cdPop 1s ease-out;}
  @keyframes cdPop{
    0%{transform:scale(.35);opacity:0;letter-spacing:24px;}
    28%{transform:scale(1.25);opacity:1;letter-spacing:2px;}
    70%{transform:scale(1);opacity:1;}
    100%{transform:scale(.82);opacity:0;}
  }

  /* ---- 结算页 streak 火苗 +1(多邻国式成就动画) ---- */
  .streak-win{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:0;}
  .flame-stage{position:relative;width:100px;height:96px;display:flex;align-items:flex-end;justify-content:center;}
  .flame{width:64px;height:80px;transform-origin:50% 100%;
    filter:drop-shadow(0 0 20px rgba(255,152,0,.75)) drop-shadow(0 0 44px rgba(255,152,0,.4));
    animation:flameGrow 1s cubic-bezier(.2,.9,.25,1) both, flameFlicker 1.8s ease-in-out 1s infinite;}
  @keyframes flameGrow{0%{transform:scale(.2) translateY(20px);opacity:0;}45%{transform:scale(1.25) translateY(0);opacity:1;}68%{transform:scale(.92);}100%{transform:scale(1);opacity:1;}}
  @keyframes flameFlicker{0%,100%{transform:scale(1) skewX(0deg);}30%{transform:scale(1.04,.98) skewX(-2deg);}60%{transform:scale(.98,1.03) skewX(2deg);}}
  .flame-plus{position:absolute;top:-6px;left:50%;font-size:34px;font-weight:900;color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.5),0 0 18px #FF9800;
    transform:translateX(-50%) scale(0);animation:plusPop .6s cubic-bezier(.2,.8,.2,1) .55s both;}
  @keyframes plusPop{0%{transform:translateX(-50%) translateY(6px) scale(0);opacity:0;}55%{transform:translateX(-50%) translateY(-10px) scale(1.3);opacity:1;}100%{transform:translateX(-50%) translateY(-14px) scale(1);opacity:1;}}
  .flame-spark{position:absolute;top:40%;left:50%;width:8px;height:8px;border-radius:50%;
    background:#FFD54F;box-shadow:0 0 8px #FFD54F;opacity:0;animation:sparkFly .9s ease-out .5s forwards;}
  @keyframes sparkFly{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(0) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(-70px) scale(.3);}}
  .streak-days{font-size:19px;font-weight:900;color:#FFB74D;letter-spacing:.5px;display:flex;align-items:center;gap:7px;
    opacity:0;animation:daysIn .5s ease-out .9s both;}
  .streak-days .big{font-size:26px;color:#FFD54F;}
  @keyframes daysIn{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
  .streak-sub{font-size:12px;color:rgba(255,255,255,.6);opacity:0;animation:daysIn .5s ease-out 1.1s both;}
  .streak-win{visibility:hidden;}
  .streak-win.go{visibility:visible;}

  /* 右下角 · 真人点阵脸小窗(与拳击关统一) */
  .you-cam{
    position:absolute;bottom:20px;right:20px;z-index:30;
    width:168px;height:126px;
    border:3px solid #ffcc00;border-radius:12px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%,#0b0512 0%,#000 100%);
    box-shadow:0 0 22px rgba(255,204,0,.4),0 4px 20px rgba(0,0,0,.6);
  }
  .you-cam video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .you-cam .you-mesh{width:100%;height:100%;display:block;}
  .you-cam .you-label{
    position:absolute;top:8px;right:8px;
    display:flex;align-items:center;gap:5px;
    color:#ff4d5e;font-size:11px;font-weight:900;letter-spacing:2px;
    padding:3px 8px;background:rgba(0,0,0,.55);border-radius:5px;
  }
  .you-cam .you-dot{width:7px;height:7px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e;animation:youBlink 1.2s infinite;}

<script type="module">
import { createPoseKernel } from "./js/pose-kernel.js";

// 6 只狗:头顶气泡位置 + 面前盘子位置(plate 为 lunch.mp4 首帧实测盘心 %)
const DOGS = [
  { key:'max',   name:'Max',   c:'var(--max)',   head:[12,28], plate:[12,51], line:'我饿啦' },
  { key:'yummy', name:'Yummy', c:'var(--yummy)', head:[26,22], plate:[27,48], line:'还行吧' },
  { key:'joy',   name:'Joy',   c:'var(--joy)',   head:[42,18], plate:[43,43], line:'我也要！' },
  { key:'chill', name:'Chill', c:'var(--chill)', head:[58,16], plate:[58,43], line:'我饿啦' },
  { key:'snow',  name:'Snow',  c:'var(--snow)',  head:[74,22], plate:[74,48], line:'人家也想吃…' },
  { key:'blink', name:'Blink', c:'var(--blink)', head:[89,28], plate:[88,55], line:'我请客！' },
];
const FOODS = ['food-1.png','food-2.png','food0-3.png','food-4.png','food-5.png'];
const FOOD_DIR = 'img/lunch/';
const TOTAL_FEEDS = DOGS.length;   // 喂饱每一只 = 6 次

// ============ 调参(真机可用 URL 旋钮标定,开发机无摄像头) ============
const _q = new URLSearchParams(location.search);
const _n = (k,d)=>{ const v=parseFloat(_q.get(k)); return isFinite(v)?v:d; };
const AX = { yaw:-1, pitch:1, roll:1 };      // 镜像修正(与拳击/餐厅一致)
const SMOOTH = _n('sm', 0.25);               // 内核角度平滑
const AIM_HOLD_MS   = _n('hold', 1000);      // 送到盘子里保持 1 秒 = 喂成功
const HIT_RADIUS_PX = _n('r', 95);           // 菜心与盘心的碰撞半径(菜大,给宽容度)
const MAP_YAW_RANGE = _n('yaw', 22);         // 转头 22° → 菜到最左/最右
const MAP_PITCH_UP  = _n('up', 18);          // 抬头 18° → 菜到最上排盘子
const MAP_PITCH_DOWN= _n('down', 16);
const HOME_X = 50, HOME_Y = _n('home', 70);  // 菜初始位:桌子中央草垫
const X_SPAN = _n('xspan', 40);              // 左右最大偏移 → 10%~90%
const Y_UP   = _n('yup', 27);                // 抬头最大上移(→ 顶排盘子 44%)
const Y_DOWN = _n('ydown', 12);              // 低头下移(离开所有盘子)
const DISH_SMOOTH = _n('ds', 0.3);           // 菜位置额外平滑
const KEY_STEP = 5;                          // 键盘每次挪动 %
const DEBUG = _q.has('debug');
const AUTO  = _q.get('auto')==='1';           // 演示:自动把菜送到饿狗盘子(录屏用)
const FILM  = _q.get('film')==='1';           // 纯演示视频模式:去 HUD + 不接摄像头 + 自动循环
if(FILM) document.body.classList.add('film');

// ============ DOM ============
const $ = id => document.getElementById(id);
const layer=$('layer'), v=$('v'), frame=$('frame'), intro=$('intro'),
      result=$('result'), toast=$('toast'), fedVal=$('fedVal'),
      comboVal=$('comboVal'), progFill=$('progFill'), progPct=$('progPct'),
      introStatus=$('introStatus');

// 调试读数
let dbg=null;
if(DEBUG){
  dbg=document.createElement('div');
  dbg.style.cssText='position:absolute;left:16px;bottom:16px;z-index:80;background:rgba(0,0,0,.6);color:#8f8;font:12px/1.5 monospace;padding:8px 12px;border-radius:8px;white-space:pre;';
  frame.appendChild(dbg);
}

// ============ pose-kernel 桥接 ============
let kernel=null, camOK=false;
let pose={ facePresent:false, rel:{yaw:0,pitch:0,roll:0}, landmarks:null };
let facePresent=false, latestLandmarks=null;
function syncPose(p){ if(!p) return; pose=p; facePresent=p.facePresent; latestLandmarks=p.landmarks; }
function relAngle(){ return pose.rel; }

// ============ 游戏状态 ============
let fed=0, combo=0, maxCombo=0, roundIdx=0, running=false;
let dishTarget={x:HOME_X,y:HOME_Y}, dishPos={x:HOME_X,y:HOME_Y};
let curDish=null, curBubble=null, curPlateHi=null, curDog=null;
let heldMs=0, roundDone=false, rafT=0;
let timers=[];

function el(cls){ const d=document.createElement('div'); d.className=cls; return d; }
function later(fn,ms){ const t=setTimeout(fn,ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function showToast(txt,dur=2400){
  toast.innerHTML=`<svg class="ico"><use href="#i-bowl"/></svg>${txt}`;
  toast.classList.add('show');
  later(()=>toast.classList.remove('show'),dur);
}
function floatBig(big,sub){
  const f=el('floater play');
  f.innerHTML=`<div class="big">${big}</div><div class="sub">${sub}</div>`;
  frame.appendChild(f);
  later(()=>f.remove(),1300);
}

// ============ 右下角点阵脸(kernel landmarks 每帧绘制,与拳击关一致) ============
const faceMeshCanvas=document.querySelector('.you-cam .you-mesh');
const faceMeshCtx=faceMeshCanvas?faceMeshCanvas.getContext('2d'):null;
const FACE_MESH_TRIS=[
  [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109,10],
  [70,63,105,66,107],[336,296,334,293,300],
  [33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246,33],
  [263,249,390,373,374,380,381,382,362,398,384,385,386,387,388,466,263],
  [168,6,197,195,5,4],
  [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185,61],
];
const MASK_MODE = (location.search.indexOf('mesh=1')<0);   // 默认 Joy 面具;?mesh=1 强制点阵调试
function drawFaceMesh(){
  if(!faceMeshCtx||!faceMeshCanvas) return;
  const w=faceMeshCanvas.width, h=faceMeshCanvas.height;
  const camBox=faceMeshCanvas.closest('.you-cam');
  const maskMode=(!camBox || camBox.dataset.faceMode!=='mesh') && MASK_MODE;
  faceMeshCtx.clearRect(0,0,w,h);
  if(!facePresent||!latestLandmarks||latestLandmarks.length===0){
    if(!maskMode){
      faceMeshCtx.fillStyle='rgba(255,204,0,0.03)'; faceMeshCtx.fillRect(0,0,w,h);
      faceMeshCtx.fillStyle='rgba(255,204,0,0.35)';
      faceMeshCtx.font='11px -apple-system, sans-serif'; faceMeshCtx.textAlign='center';
      faceMeshCtx.fillText(camOK?'SEARCHING…':'键盘模式 ←→↑↓',w/2,h/2);
    }
    return;
  }
  if(maskMode){ if(window.JoyMask) JoyMask.draw(faceMeshCtx, latestLandmarks, w, h); return; }
  const project=p=>({ x:(1-p.x)*w, y:p.y*h });   // 镜像 x,与用户视觉一致
  faceMeshCtx.fillStyle='rgba(255,204,0,0.03)'; faceMeshCtx.fillRect(0,0,w,h);
  faceMeshCtx.fillStyle='rgba(255,204,0,0.55)';
  for(let i=0;i<latestLandmarks.length;i++){ const p=project(latestLandmarks[i]); faceMeshCtx.fillRect(p.x-0.5,p.y-0.5,1.4,1.4); }
  faceMeshCtx.strokeStyle='rgba(255,230,120,0.9)'; faceMeshCtx.lineWidth=1;
  for(const path of FACE_MESH_TRIS){
    faceMeshCtx.beginPath();
    for(let i=0;i<path.length;i++){ const idx=path[i]; if(idx>=latestLandmarks.length)continue; const p=project(latestLandmarks[idx]); i?faceMeshCtx.lineTo(p.x,p.y):faceMeshCtx.moveTo(p.x,p.y); }
    faceMeshCtx.stroke();
  }
  faceMeshCtx.fillStyle='rgba(255,255,255,0.95)';
  for(const idx of [1,33,263]){ if(idx>=latestLandmarks.length)continue; const p=project(latestLandmarks[idx]); faceMeshCtx.beginPath(); faceMeshCtx.arc(p.x,p.y,1.8,0,Math.PI*2); faceMeshCtx.fill(); }
}

// ============ 一轮:中央出一道菜 + 一只狗喊饿(气泡带未闭合环) ============
function startRound(){
  roundDone=false; heldMs=0;
  curDog = DOGS[roundIdx % DOGS.length];
  const food = FOODS[roundIdx % FOODS.length];

  // 1) 菜放在桌子中央草垫(你的大小)
  const d = el('dish'); d.innerHTML = `<img src="${FOOD_DIR}${food}" alt="">`;
  d.style.left=HOME_X+'%'; d.style.top=HOME_Y+'%';
  layer.appendChild(d);
  requestAnimationFrame(()=> d.classList.add('in'));
  curDish=d;
  dishTarget={x:HOME_X,y:HOME_Y}; dishPos={x:HOME_X,y:HOME_Y};

  // 2) 目标盘子高亮(提示"送到这")
  const ph = el('plate-hi');
  ph.style.left=curDog.plate[0]+'%'; ph.style.top=curDog.plate[1]+'%';
  layer.appendChild(ph); curPlateHi=ph;

  // 3) 头顶气泡「我饿啦」,外圈是未闭合的进度环
  const b = el('bubble');
  b.innerHTML = `<span class="bubble-txt">${curDog.line}</span><div class="bubble-ring"></div>`;
  b.style.left=curDog.head[0]+'%'; b.style.top=curDog.head[1]+'%';
  b.style.setProperty('--p','0');
  layer.appendChild(b);
  requestAnimationFrame(()=> b.classList.add('show'));
  curBubble=b;

  showToast(camOK?'转头把菜移到它盘子里 · 稳住 1 秒' : '用 ←→↑↓ 把菜移到它盘子里');
}

// 每帧:碰撞 + 保持进度(环闭合)
function tickFeed(dt){
  if(!curDog||!curDish||roundDone) return;
  const rect=frame.getBoundingClientRect();
  const dxPx=(dishPos.x/100)*rect.width,  dyPx=(dishPos.y/100)*rect.height;
  const pxPx=(curDog.plate[0]/100)*rect.width, pyPx=(curDog.plate[1]/100)*rect.height;
  const dist=Math.hypot(pxPx-dxPx, pyPx-dyPx);
  const inRange = dist<=HIT_RADIUS_PX;
  curPlateHi.classList.toggle('on', inRange);
  if(inRange){
    heldMs += dt;
    curBubble.classList.add('feeding');
    if(heldMs>=AIM_HOLD_MS){ successFeed(); return; }
  }else{
    heldMs = Math.max(0, heldMs - dt*1.6);   // 离开渐退,不瞬清零
    if(heldMs<=0) curBubble.classList.remove('feeding');
  }
  curBubble.style.setProperty('--p', Math.min(100, heldMs/AIM_HOLD_MS*100).toFixed(1));
}

// 喂成功:菜落盘缩 50% + 气泡环闭合变「谢谢」+ 计分 + 下一道
function successFeed(){
  roundDone=true;
  const dog=curDog, dish=curDish, b=curBubble, ph=curPlateHi;

  dish.classList.add('landed');
  dish.style.left=dog.plate[0]+'%'; dish.style.top=dog.plate[1]+'%';
  dish.style.transform='translate(-50%,-50%) scale(.5)';   // 缩小 50%
  ph.classList.remove('on');

  b.classList.add('done'); b.style.setProperty('--p','100');   // 环闭合
  b.querySelector('.bubble-txt').textContent='谢谢！';
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');

  const s=el('spark'); s.textContent='✦'; s.style.left=dog.plate[0]+'%'; s.style.top=dog.plate[1]+'%';
  layer.appendChild(s); s.style.transition='opacity .4s, transform .6s ease-out';
  requestAnimationFrame(()=>{ s.style.opacity='1'; s.style.transform='translate(-50%,-90%) scale(1.4)'; });
  later(()=>{ s.style.opacity='0'; }, 500);

  fed++; combo++; if(combo>maxCombo) maxCombo=combo;
  fedVal.textContent=fed; comboVal.textContent=combo;
  const pr=Math.min(100,Math.round(fed/TOTAL_FEEDS*100));
  progFill.style.width=pr+'%'; progPct.textContent=pr+'%';
  floatBig('喂饱啦！', combo>1?`连击 ×${combo}`:'转头喂到 +1');

  later(()=>{
    [dish,b,ph].forEach(n=>{ if(n) n.style.opacity='0'; });
    later(()=>{ [dish,b,ph].forEach(n=>n&&n.remove()); layer.querySelectorAll('.spark').forEach(n=>n.remove()); },400);
    curDish=curBubble=curPlateHi=curDog=null;
    roundIdx++;
    if(roundIdx<TOTAL_FEEDS) startRound();
    else later(endShow,600);
  }, 1100);
}

// ============ 头姿 → 菜的目标位 ============
function updateDishFromHead(){
  const rel=relAngle();   // 已应用 AX / 校准基线
  const yawN   = Math.max(-1, Math.min(1, rel.yaw / MAP_YAW_RANGE));
  const pitchN = rel.pitch<0
      ? Math.max(-1, rel.pitch / MAP_PITCH_UP)     // 抬头(负)
      : Math.min(1,  rel.pitch / MAP_PITCH_DOWN);  // 低头(正)
  dishTarget.x = HOME_X + yawN * X_SPAN;
  dishTarget.y = HOME_Y + (rel.pitch<0 ? pitchN*Y_UP : pitchN*Y_DOWN); // 抬头→上移接近盘子
}

// ============ 主循环:刷头姿 + 画点阵 + 驱动菜 + 判定 ============
function loop(now){
  requestAnimationFrame(loop);
  now = now || performance.now();
  const dt = rafT ? Math.min(50, now-rafT) : 16; rafT=now;
  if(kernel && kernel.ready()) syncPose(kernel.tick(now));
  drawFaceMesh();
  if(running){
    if((AUTO||FILM) && curDog && !roundDone){ dishTarget.x=curDog.plate[0]; dishTarget.y=curDog.plate[1]; }
    else if(camOK && facePresent) updateDishFromHead();
    // 无摄像头:dishTarget 由键盘设置,不覆盖
    dishPos.x += (dishTarget.x - dishPos.x) * DISH_SMOOTH;
    dishPos.y += (dishTarget.y - dishPos.y) * DISH_SMOOTH;
    if(curDish && !roundDone){ curDish.style.left=dishPos.x+'%'; curDish.style.top=dishPos.y+'%'; }
    tickFeed(dt);
  }
  if(DEBUG && dbg){
    const r=relAngle();
    dbg.textContent=`yaw ${r.yaw.toFixed(1)}  pitch ${r.pitch.toFixed(1)}  face ${facePresent?1:0} cam ${camOK?1:0}\ndish ${dishPos.x.toFixed(0)},${dishPos.y.toFixed(0)}  held ${heldMs|0}`;
  }
  if(_q.has('probe')) document.title=`fed=${fed} round=${roundIdx} held=${heldMs|0} dish=${dishPos.x.toFixed(0)},${dishPos.y.toFixed(0)} run=${running?1:0}`;
}
requestAnimationFrame(loop);

// 调试探针:?probe 时暴露内部函数,便于自动化验证收尾态
if(_q.has('probe')){ window.__game={ startRound, successFeed, get roundDone(){return roundDone;}, get fed(){return fed;} }; }

// 键盘兜底:无摄像头时用方向键把菜挪进盘子
document.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); if(!running) start(); return; }
  if(!running || roundDone) return;
  let ok=true;
  if(e.code==='ArrowLeft')       dishTarget.x=Math.max(6,  dishTarget.x-KEY_STEP);
  else if(e.code==='ArrowRight') dishTarget.x=Math.min(94, dishTarget.x+KEY_STEP);
  else if(e.code==='ArrowUp')    dishTarget.y=Math.max(40, dishTarget.y-KEY_STEP);
  else if(e.code==='ArrowDown')  dishTarget.y=Math.min(82, dishTarget.y+KEY_STEP);
  else ok=false;
  if(ok) e.preventDefault();
});

/* ============ 结算页 streak 火苗 +1 ============ */
function playStreakFlame(){
  const win=$('streakWin'); if(!win) return;
  win.querySelectorAll('.flame,.flame-plus,.flame-spark,.streak-days,.streak-sub').forEach(e=>{
    e.style.animation='none'; void e.offsetWidth; e.style.animation='';
  });
  win.classList.add('go');
}

/* ============ 本局评级(喂饱比例 → 星星数 + 判语) ============ */
const RANK_TABLE = [
  { min:1.0,  stars:3, verdict:'全场吃饱 · 满星！' },
  { min:0.66, stars:3, verdict:'喂饱了大半桌 Doga' },
  { min:0.33, stars:2, verdict:'还有几只没吃上' },
  { min:0,    stars:1, verdict:'桌子快空了' },
];
function gradeRun(){
  const ratio = TOTAL_FEEDS ? fed/TOTAL_FEEDS : 0;
  return RANK_TABLE.find(t=>ratio>=t.min) || RANK_TABLE[RANK_TABLE.length-1];
}
function pickFeel(el){
  document.querySelectorAll('.feel-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}
window.pickFeel = pickFeel;

function endShow(){
  running=false;
  if(kernel) kernel.stopCamera();   // 隐私红线:结束立即释放摄像头
  camOK=false; facePresent=false; latestLandmarks=null;
  $('rFed').textContent = fed + '/' + TOTAL_FEEDS;
  $('rCombo').textContent = '×' + maxCombo;

  // 判语 + 星级:按喂饱比例点亮
  const g = gradeRun();
  $('rVerdict').textContent = g.verdict;
  document.querySelectorAll('#resStars svg').forEach((s,i)=>{
    s.classList.remove('lit','dim');
    s.classList.add(i<g.stars ? 'lit' : 'dim');
  });

  result.classList.remove('hide');
  setTimeout(playStreakFlame,800);
}

/* ============ 3秒倒计时(四关统一) ============ */
function runCountdown(done){
  const cd=$('countdown'), cdNum=$('cdNum');
  cd.classList.remove('hide');
  let n=3;
  (function step(){
    if(n>0){ cdNum.textContent=n; cdNum.className='cd-num cd-pop'; }
    else{ cdNum.textContent='GO!'; cdNum.className='cd-num go cd-pop'; }
    void cdNum.offsetWidth;
    if(n>=0){ n--; setTimeout(step,1000); }
    else{ cd.classList.add('hide'); done&&done(); }
  })();
}

async function start(){
  intro.classList.add('hide'); result.classList.add('hide');
  $('streakWin').classList.remove('go');
  clearTimers();
  layer.innerHTML='';
  fed=0; combo=0; maxCombo=0; roundIdx=0; running=false;
  fedVal.textContent=0; comboVal.textContent=0;
  progFill.style.width='0%'; progPct.textContent='0%';
  v.currentTime=0; v.play().catch(()=>{});

  // 唤起摄像头 + 头姿检测(失败→键盘兜底,不阻断)
  camOK=false;
  try{
    if(!kernel){
      kernel=createPoseKernel({ video:document.querySelector('.you-cam video'), axis:AX, smooth:SMOOTH });
      await kernel.loadModel(txt=>{ if(introStatus && txt) introStatus.textContent=txt; });
    }
    await kernel.startCamera();
    kernel.beginCalibration();          // 用倒计时这几秒采基线(坐直看屏幕)
    camOK=true;
  }catch(e){ camOK=false; }

  runCountdown(()=>{
    if(camOK && kernel) kernel.endCalibration();
    dishTarget={x:HOME_X,y:HOME_Y}; dishPos={x:HOME_X,y:HOME_Y};
    running=true; roundIdx=0;
    startRound();
  });
}

$('startBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);

// 调试入口:?end=1 直接看结算火苗
v.play().catch(()=>{});
if(_q.get('end')==='1'){
  fed=TOTAL_FEEDS; maxCombo=TOTAL_FEEDS;
  intro.classList.add('hide'); intro.style.display='none';
  endShow();
  result.style.transition='none'; result.style.opacity='1';   // 调试直达:跳过淡入,秒看结算
}else if(AUTO){
  start();
}
</script>
