<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今天不低头 · Doga 餐厅</title>
<style>
  /* ============================================================
     关卡 HUD 设计系统 v1 · 餐厅皮肤(暖琥珀金)
     token + 液态玻璃 + 线性SVG图标,四关共用同一套,只换分支色
  ============================================================ */
  :root{
    --gold:#ffd66b;
    --gold-bright:#ffe89b;
    --r-sm:12px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --fs-display:60px; --fs-num:44px;
    --glass-blur:14px;
    --shadow-1:0 2px 8px rgba(0,0,0,.18);
    --shadow-2:0 8px 24px rgba(0,0,0,.28);
    --ok:#6bff9d;
    /* 餐厅 · 暖琥珀金皮肤 */
    --brand:#f5a623;
    --brand-deep:#5c3410;
    --ink:#3a2a1a;
    --glass-bg:rgba(42,24,16,.42);
    --overlay-bg:radial-gradient(circle at 50% 42%, rgba(58,36,18,.74), rgba(20,12,4,.94));
    --title-txt:#3a2a1a;
    /* 狗狗气泡描边色 */
    --bubble-bg:#fffdf7;
    --joy:#ea3323; --max:#5c6470; --chill:#f39c1f;
    --blink:#8a5a3c; --yummy:#6b6b6b; --snow:#eb7fa8;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;background:#140d04;font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#140d04;}
  .frame{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    overflow:hidden;
  }
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .layer{position:absolute;inset:0;pointer-events:none;}
  .vignette{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg, rgba(20,12,4,.34) 0%, rgba(20,12,4,0) 18%, rgba(20,12,4,0) 80%, rgba(20,12,4,.32) 100%);
  }

  /* ============================================================
     通用玻璃面:液态玻璃(通透+提色+边缘镜面光+顶部光泽)
  ============================================================ */
  .glass{
    position:relative;
    background:
      linear-gradient(135deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.03) 38%, rgba(255,255,255,.07) 100%),
      var(--glass-bg);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.45),
      inset 0 -10px 22px rgba(255,255,255,.04),
      var(--shadow-2);
    backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  }
  .glass::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    padding:1px;
    background:linear-gradient(135deg,
      rgba(255,255,255,.7) 0%, rgba(255,255,255,.08) 34%,
      rgba(255,255,255,0) 58%, rgba(255,255,255,.32) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
  }

  /* 线性 SVG 图标 */
  .ico{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* ==================== HUD ==================== */
  .hud-title{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:30;
    background:linear-gradient(135deg,var(--gold-bright),var(--gold));
    color:var(--title-txt);
    padding:10px 32px;border-radius:var(--r-pill);
    font-size:18px;font-weight:800;letter-spacing:1.5px;
    box-shadow:var(--shadow-1);
    display:flex;align-items:center;gap:10px;
  }
  .hud-title .ico{stroke:var(--title-txt);width:19px;height:19px;}

  .hud-left{position:absolute;top:16px;left:16px;z-index:30;
    display:flex;flex-direction:column;gap:9px;}
  .chip{
    display:flex;align-items:center;gap:11px;
    padding:11px 19px;border-radius:var(--r-pill);
    color:var(--gold-bright);font-size:16px;font-weight:700;letter-spacing:.5px;
  }
  .chip .ico{width:20px;height:20px;}
  .chip .lb{opacity:.9;}
  .chip .val{color:#fff;font-size:22px;font-weight:900;min-width:22px;text-align:center;}
  .chip .unit{font-size:13px;opacity:.7;font-weight:700;}

  .progress-wrap{
    position:absolute;top:16px;right:16px;z-index:30;width:205px;
    border-radius:var(--r-md);padding:14px 18px;
  }
  .progress-label{display:flex;justify-content:space-between;align-items:center;
    font-size:13px;color:var(--gold-bright);font-weight:800;letter-spacing:1px;
    margin-bottom:10px;}
  .progress-label .pct{color:#fff;font-size:15px;font-weight:900;}
  .progress-track{height:10px;background:rgba(255,255,255,.16);border-radius:var(--r-pill);overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:var(--r-pill);
    background:linear-gradient(90deg,var(--brand),var(--gold));transition:width .5s;}

  /* 判定飘字 · 命中感 */
  .floater{
    position:absolute;left:50%;top:24%;transform:translateX(-50%);z-index:28;
    text-align:center;pointer-events:none;font-weight:900;
  }
  .floater .big{
    font-size:60px;letter-spacing:2px;
    background:linear-gradient(135deg,#fff,var(--gold-bright));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.6)) drop-shadow(0 0 18px var(--brand));
  }
  .floater .sub{font-size:18px;color:#fff;margin-top:4px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.75);}
  .floater.play{animation:floatHit 1.3s cubic-bezier(.2,.8,.2,1) forwards;}
  @keyframes floatHit{
    0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.5);}
    12%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.42);}
    26%{transform:translateX(-50%) translateY(-3px) scale(1.05);}
    100%{opacity:0;transform:translateX(-50%) translateY(-52px) scale(1);}
  }

  /* ---------- 狗狗说话气泡(外圈=喂食保持进度环) ---------- */
  .bubble{
    position:absolute;transform:translate(-50%,-50%) scale(.5);z-index:22;
    background:rgba(42,24,16,.92);color:#fff;font-weight:800;
    font-size:clamp(13px,1.9vw,24px);letter-spacing:1px;
    padding:.52em .95em;border-radius:16px;white-space:nowrap;opacity:0;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    transition:opacity .25s ease, transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .bubble .bubble-txt{position:relative;z-index:2;}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
    width:0;height:0;border:8px solid transparent;border-top-color:rgba(42,24,16,.92);z-index:1;}
  /* 外圈进度环:conic 从 12 点方向顺时针画金边,--p 0→100 表示喂食保持进度,满=闭合 */
  .bubble .bubble-ring{
    position:absolute;inset:-3px;border-radius:19px;padding:3px;pointer-events:none;z-index:0;
    background:conic-gradient(from -90deg, var(--gold-bright) calc(var(--p,0)*1%), rgba(255,255,255,.14) 0);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0;transition:opacity .2s;
  }
  .bubble.feeding .bubble-ring{opacity:1;}
  .bubble.done .bubble-ring{opacity:1;background:var(--gold-bright);
    box-shadow:0 0 12px var(--gold-bright);}
  .bubble.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  /* ---------- 目标盘子高亮圈(对准时亮,提示"送到这") ---------- */
  .plate-hi{position:absolute;transform:translate(-50%,-50%);opacity:0;transition:opacity .25s;z-index:16;
    width:clamp(60px,9vw,120px);height:clamp(38px,5.6vw,74px);
    border:3px dashed rgba(255,232,155,.55);border-radius:50%;pointer-events:none;}
  .plate-hi.on{opacity:1;border-style:solid;border-color:var(--gold-bright);
    box-shadow:0 0 18px rgba(255,214,107,.6),inset 0 0 14px rgba(255,214,107,.3);
    animation:plateHiPulse 1s ease-in-out infinite;}
  @keyframes plateHiPulse{50%{box-shadow:0 0 26px rgba(255,214,107,.85),inset 0 0 18px rgba(255,214,107,.45);}}

  /* ---------- 被头控的菜(初始在中央草垫,转头移动送盘) ---------- */
  .dish{position:absolute;transform:translate(-50%,-50%) scale(1);z-index:25;
    width:clamp(92px,13vw,168px);height:auto;pointer-events:none;opacity:0;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));
    will-change:left,top,transform;transition:opacity .3s;}
  .dish img{width:100%;height:auto;display:block;}
  .dish.in{opacity:1;}
  /* 落盘:平滑移到盘子精确位并缩到 50% */
  .dish.landed{transition:left .45s cubic-bezier(.22,1,.36,1),top .45s cubic-bezier(.22,1,.36,1),transform .45s cubic-bezier(.22,1,.36,1),opacity .4s;}

  /* ---------- 命中星光 ---------- */
  .spark{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:21;
    color:var(--gold-bright);font-weight:900;font-size:clamp(16px,2.4vw,30px);
    opacity:0;text-shadow:0 2px 8px rgba(0,0,0,.5);}

  /* ==================== 开场 / 结算 ==================== */
  .overlay{
    position:absolute;inset:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:16px;padding:24px;
    background:var(--overlay-bg);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .8s;
  }
  .overlay.hide{opacity:0;pointer-events:none;}
  .brand{
    border:1px solid var(--gold);color:var(--gold-bright);
    padding:6px 20px;border-radius:var(--r-pill);
    font-size:13px;font-weight:800;letter-spacing:3px;
    display:flex;align-items:center;gap:8px;
  }
  .brand .ico{width:15px;height:15px;}
  .big-title{
    font-size:var(--fs-display);font-weight:900;letter-spacing:2px;line-height:1.1;
    background:linear-gradient(135deg,#fff 0%,var(--gold-bright) 48%,var(--brand) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .subtitle{font-size:15px;color:rgba(255,255,255,.82);line-height:1.7;max-width:440px;}
  .subtitle b{color:var(--gold-bright);}
  .how-grid{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;justify-content:center;}
  .how-item{
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    border-radius:var(--r-sm);padding:12px 14px;min-width:92px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .how-item .ico{width:22px;height:22px;color:#fff;}
  .how-item .lb{font-size:12px;color:var(--gold-bright);font-weight:700;}
  .btn{
    margin-top:8px;border:none;cursor:pointer;
    background:var(--brand);
    color:#fff;padding:16px 46px;border-radius:var(--r-pill);
    font-size:18px;font-weight:900;letter-spacing:1.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .12s,filter .12s;
    display:inline-flex;align-items:center;gap:9px;
  }
  .btn .ico{stroke:#fff;}
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn-ghost{
    margin-top:2px;border:none;cursor:pointer;background:transparent;
    color:rgba(255,255,255,.6);font-family:var(--font);
    font-size:14px;font-weight:700;letter-spacing:.5px;
    display:inline-flex;align-items:center;gap:6px;transition:color .15s;
  }
  .btn-ghost:hover{color:var(--gold-bright);}
  .btn-ghost .ico{width:15px;height:15px;stroke:currentColor;}
  .status{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;}

  .result-card{
    border-radius:var(--r-lg);padding:26px 34px;
    display:flex;flex-direction:column;gap:16px;align-items:center;
  }
  .result-stat{display:flex;gap:34px;}
  .result-stat .item{text-align:center;}
  .result-stat .num{font-size:var(--fs-num);font-weight:900;color:var(--gold-bright);line-height:1;}
  .result-stat .lb{font-size:13px;color:rgba(255,255,255,.75);margin-top:7px;}
  .result-up{font-size:14px;color:var(--ok);font-weight:700;display:flex;align-items:center;gap:6px;}
  .result-up .ico{width:15px;height:15px;stroke:var(--ok);}

  .toast{
    position:absolute;top:78px;left:50%;transform:translateX(-50%) translateY(-10px);
    z-index:35;
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 22px;border-radius:var(--r-pill);
    color:var(--gold-bright);font-size:14px;font-weight:700;letter-spacing:.5px;
    opacity:0;transition:all .5s;
  }
  .toast .ico{width:16px;height:16px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- 3秒倒计时(四关统一) ---- */
  .countdown{
    position:absolute;inset:0;z-index:70;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 50%, rgba(0,0,0,.35), rgba(0,0,0,.62));
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .countdown.hide{display:none;}
  .countdown .cd-num{
    font-size:150px;font-weight:900;line-height:1;
    color:var(--gold-bright);
    text-shadow:0 0 50px var(--brand),0 0 100px var(--brand),0 8px 20px rgba(0,0,0,.7);
  }
  .countdown .cd-num.go{
    font-size:96px;letter-spacing:6px;
    background:linear-gradient(135deg,#fff,var(--gold-bright));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 40px var(--brand));
  }
  .cd-pop{animation:cdPop 1s ease-out;}
  @keyframes cdPop{
    0%{transform:scale(.35);opacity:0;letter-spacing:24px;}
    28%{transform:scale(1.25);opacity:1;letter-spacing:2px;}
    70%{transform:scale(1);opacity:1;}
    100%{transform:scale(.82);opacity:0;}
  }

  /* ---- 结算页 streak 火苗 +1(多邻国式成就动画) ---- */
  .streak-win{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px;}
  .flame-stage{position:relative;width:120px;height:130px;display:flex;align-items:flex-end;justify-content:center;}
  .flame{width:78px;height:96px;transform-origin:50% 100%;
    filter:drop-shadow(0 0 20px rgba(255,152,0,.75)) drop-shadow(0 0 44px rgba(255,152,0,.4));
    animation:flameGrow 1s cubic-bezier(.2,.9,.25,1) both, flameFlicker 1.8s ease-in-out 1s infinite;}
  @keyframes flameGrow{0%{transform:scale(.2) translateY(20px);opacity:0;}45%{transform:scale(1.25) translateY(0);opacity:1;}68%{transform:scale(.92);}100%{transform:scale(1);opacity:1;}}
  @keyframes flameFlicker{0%,100%{transform:scale(1) skewX(0deg);}30%{transform:scale(1.04,.98) skewX(-2deg);}60%{transform:scale(.98,1.03) skewX(2deg);}}
  .flame-plus{position:absolute;top:-6px;left:50%;font-size:34px;font-weight:900;color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.5),0 0 18px #FF9800;
    transform:translateX(-50%) scale(0);animation:plusPop .6s cubic-bezier(.2,.8,.2,1) .55s both;}
  @keyframes plusPop{0%{transform:translateX(-50%) translateY(6px) scale(0);opacity:0;}55%{transform:translateX(-50%) translateY(-10px) scale(1.3);opacity:1;}100%{transform:translateX(-50%) translateY(-14px) scale(1);opacity:1;}}
  .flame-spark{position:absolute;top:40%;left:50%;width:8px;height:8px;border-radius:50%;
    background:#FFD54F;box-shadow:0 0 8px #FFD54F;opacity:0;animation:sparkFly .9s ease-out .5s forwards;}
  @keyframes sparkFly{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(0) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--sr)) translateY(-70px) scale(.3);}}
  .streak-days{font-size:19px;font-weight:900;color:#FFB74D;letter-spacing:.5px;display:flex;align-items:center;gap:7px;
    opacity:0;animation:daysIn .5s ease-out .9s both;}
  .streak-days .big{font-size:26px;color:#FFD54F;}
  @keyframes daysIn{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
  .streak-sub{font-size:12px;color:rgba(255,255,255,.6);opacity:0;animation:daysIn .5s ease-out 1.1s both;}
  .streak-win{visibility:hidden;}
  .streak-win.go{visibility:visible;}

  /* 右下角 · 真人点阵脸小窗(与拳击关统一) */
  .you-cam{
    position:absolute;bottom:20px;right:20px;z-index:30;
    width:168px;height:126px;
    border:3px solid #ffcc00;border-radius:12px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%,#0b0512 0%,#000 100%);
    box-shadow:0 0 22px rgba(255,204,0,.4),0 4px 20px rgba(0,0,0,.6);
  }
  .you-cam video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .you-cam .you-mesh{width:100%;height:100%;display:block;}
  .you-cam .you-label{
    position:absolute;top:8px;right:8px;
    display:flex;align-items:center;gap:5px;
    color:#ff4d5e;font-size:11px;font-weight:900;letter-spacing:2px;
    padding:3px 8px;background:rgba(0,0,0,.55);border-radius:5px;
  }
  .you-cam .you-dot{width:7px;height:7px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e;animation:youBlink 1.2s infinite;}
  @keyframes youBlink{50%{opacity:.3;}}
</style>

<div id="stage">
  <div class="frame" id="frame">

    <!-- 线性 SVG 图标库 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-bowl" viewBox="0 0 24 24"><path d="M3 11h18M5 11l1.4 6.2A2 2 0 0 0 8.3 19h7.4a2 2 0 0 0 1.9-1.8L19 11M8.5 8c0-1.6 1.6-2.5 3.5-2.5S15.5 6.4 15.5 8"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 3c1 3-1 4-1 6a3 3 0 0 0 3 3c1-1 1-2 1-3 2 2 3 4 3 6a6 6 0 1 1-12 0c0-3 2-5 3-7 .8 1 1 2 3 2z"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></symbol>
    </svg>

    <!-- 底层视频 -->
    <video id="v" src="img/lunch.mp4" autoplay muted loop playsinline></video>
    <div class="vignette"></div>
    <div class="layer" id="layer"></div>

    <!-- HUD -->
    <div class="hud-title"><svg class="ico"><use href="#i-bowl"/></svg>今天不低头 · Doga 餐厅</div>
    <div class="hud-left">
      <div class="chip glass"><svg class="ico"><use href="#i-bowl"/></svg><span class="lb">喂食</span><span class="val" id="fedVal">0</span><span class="unit">只</span></div>
      <div class="chip glass"><svg class="ico"><use href="#i-fire"/></svg><span class="lb">连击</span><span class="val" id="comboVal">0</span></div>
    </div>
    <div class="progress-wrap glass">
      <div class="progress-label"><span>喂饱进度</span><span class="pct" id="progPct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    </div>

    <!-- 右下角 · 真人点阵脸小窗 -->
    <div class="you-cam">
      <video autoplay playsinline muted></video>
      <canvas class="you-mesh" width="336" height="252"></canvas>
      <div class="you-label"><span class="you-dot"></span>YOU</div>
    </div>

    <!-- 开场 -->
    <div class="overlay" id="intro">
      <div class="brand"><svg class="ico"><use href="#i-bowl"/></svg>JOY · Doga 餐厅</div>
      <div class="big-title">Doga 们饿啦</div>
      <div class="subtitle">转头对准饿了的 Doga，让金勺<b>圈闭合 1 秒</b><br>一只只喂饱它们，顺便活动一下你的颈椎</div>
      <div class="how-grid">
        <div class="how-item"><svg class="ico"><use href="#i-target"/></svg><div class="lb">转头对准</div></div>
        <div class="how-item"><svg class="ico"><use href="#i-clock"/></svg><div class="lb">保持一秒</div></div>
        <div class="how-item"><svg class="ico"><use href="#i-bowl"/></svg><div class="lb">喂饱每只</div></div>
      </div>
      <button class="btn" id="startBtn"><svg class="ico"><use href="#i-bowl"/></svg>开始喂食 · FEED TIME!</button>
      <button class="btn-ghost" style="margin-top:18px;" onclick="location.href='zone.html?zone=neck'"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M15 19l-7-7 7-7"/></svg>返回颈部训练营</button>
      <div class="status" id="introStatus">真头控 · 无摄像头可用 ←→↑↓ 键</div>
    </div>

    <!-- 结算 -->
    <div class="overlay hide" id="result">
      <div class="streak-win" id="streakWin">
        <div class="flame-stage">
          <svg class="flame" viewBox="0 0 78 96">
            <defs>
              <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#FF6D00"/><stop offset="45%" stop-color="#FF9800"/>
                <stop offset="80%" stop-color="#FFB74D"/><stop offset="100%" stop-color="#FFD54F"/>
              </linearGradient>
              <linearGradient id="flameCore" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#FFD54F"/><stop offset="100%" stop-color="#FFF3C4"/>
              </linearGradient>
            </defs>
            <path fill="url(#flameGrad)" d="M39 2 C50 22 68 34 68 60 A29 29 0 0 1 10 60 C10 42 22 40 26 26 C34 34 30 44 36 48 C42 46 40 30 39 2 Z"/>
            <path fill="url(#flameCore)" d="M39 40 C46 50 52 54 52 66 A13 13 0 0 1 26 66 C26 56 34 54 34 44 C38 48 37 52 39 54 Z"/>
          </svg>
          <div class="flame-plus">+1</div>
          <div class="flame-spark" style="--sr:-30deg"></div><div class="flame-spark" style="--sr:-12deg"></div>
          <div class="flame-spark" style="--sr:12deg"></div><div class="flame-spark" style="--sr:30deg"></div>
        </div>
        <div class="streak-days">连续 <span class="big">6</span> 天</div>
        <div class="streak-sub">火苗更旺了 · 别断哦</div>
      </div>

      <div class="result-card glass">
        <div class="result-stat">
          <div class="item"><div class="num" id="rFed">0</div><div class="lb">喂饱只数</div></div>
          <div class="item"><div class="num" id="rCombo">0</div><div class="lb">最高连击</div></div>
          <div class="item"><div class="num">+6°</div><div class="lb">颈部转动度</div></div>
        </div>
        <div class="result-up"><svg class="ico"><use href="#i-spark"/></svg>转头追踪 +6° · 颈部更灵活了</div>
      </div>
      <button class="btn" id="againBtn"><svg class="ico"><use href="#i-bowl"/></svg>再喂一次</button>
      <button class="btn-ghost" onclick="location.href='zone.html?zone=neck'"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M15 19l-7-7 7-7"/></svg>返回颈部训练营</button>
      <div class="status">今天不低头 · 关注你的颈椎健康</div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 3秒倒计时 -->
    <div class="countdown hide" id="countdown"><div class="cd-num" id="cdNum">3</div></div>

  </div>
</div>

<script>
// 6 只狗:头顶(气泡+环)位置 + 面前盘子位置(百分比,基于 1382x768 帧构图)
const DOGS = [
  { key:'max',   name:'Max',   c:'var(--max)',   head:[12,30], plate:[15,58], line:'我饿啦' },
  { key:'yummy', name:'Yummy', c:'var(--yummy)', head:[27,22], plate:[26,50], line:'还行吧' },
  { key:'joy',   name:'Joy',   c:'var(--joy)',   head:[41,20], plate:[40,47], line:'我也要！' },
  { key:'chill', name:'Chill', c:'var(--chill)', head:[59,17], plate:[58,47], line:'我饿啦' },
  { key:'snow',  name:'Snow',  c:'var(--snow)',  head:[75,22], plate:[72,50], line:'人家也想吃…' },
  { key:'blink', name:'Blink', c:'var(--blink)', head:[90,30], plate:[85,58], line:'我请客！' },
];
const FOODS = ['food-1.png','food-2.png','food0-3.png','food-4.png','food-5.png'];
const FOOD_DIR = 'img/lunch/';
const TOTAL_FEEDS = DOGS.length;   // 喂饱每一只 = 6 次

const layer   = document.getElementById('layer');
const v       = document.getElementById('v');
const frame   = document.getElementById('frame');
const intro   = document.getElementById('intro');
const result  = document.getElementById('result');
const toast   = document.getElementById('toast');
const fedVal  = document.getElementById('fedVal');
const comboVal= document.getElementById('comboVal');
const progFill= document.getElementById('progFill');
const progPct = document.getElementById('progPct');

let foodIdx = 0, dogIdx = 0, fed = 0, combo = 0, maxCombo = 0, roundCount = 0;
let timers = [];

const pct = (arr)=>({left:arr[0]+'%', top:arr[1]+'%'});
function el(cls){ const d=document.createElement('div'); d.className=cls; return d; }
function later(fn,ms){ const t=setTimeout(fn,ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

function showToast(txt,dur=2200){
  toast.innerHTML=`<svg class="ico"><use href="#i-bowl"/></svg>${txt}`;
  toast.classList.add('show');
  later(()=>toast.classList.remove('show'),dur);
}
function floatBig(big,sub){
  const f=el('floater play');
  f.innerHTML=`<div class="big">${big}</div><div class="sub">${sub}</div>`;
  frame.appendChild(f);
  later(()=>f.remove(),1300);
}

// 一轮喂食:气泡"我饿啦" -> 金环倒计时(保持) -> 菜飞入盘 -> 命中计数 -> 收尾
function feedRound(dog, food){
  // 1) 我饿啦气泡
  const b = el('bubble'); b.textContent = dog.line; b.style.setProperty('--c',dog.c);
  Object.assign(b.style, pct(dog.head)); layer.appendChild(b);
  requestAnimationFrame(()=> b.classList.add('show'));

  // 2) 金色倒计时环(1.4s)—— 套在狗面前的盘子上,表示"正在喂这只(保持)"
  const HOLD=1400;
  const ring = el('ring'); Object.assign(ring.style, pct(dog.plate));
  ring.innerHTML = `<svg viewBox="0 0 100 100">
    <circle class="track" cx="50" cy="50" r="45"/>
    <circle class="prog"  cx="50" cy="50" r="45"/></svg>`;
  const rsz = Math.round(Math.min(frame.clientWidth*0.07, 96));
  const svg = ring.querySelector('svg'); svg.setAttribute('width',rsz); svg.setAttribute('height',rsz);
  layer.appendChild(ring);
  later(()=>{
    ring.classList.add('show');
    const prog = ring.querySelector('.prog');
    prog.style.transition = `stroke-dashoffset ${HOLD}ms linear`;
    requestAnimationFrame(()=> prog.style.strokeDashoffset = '0');
  }, 260);

  // 3) 环走完 -> 菜从下方飞入盘子 + 命中计数
  later(()=>{
    ring.classList.remove('show');
    const f = el('food'); f.innerHTML = `<img src="${FOOD_DIR}${food}" alt="">`;
    f.style.left = dog.plate[0]+'%'; f.style.top = '110%';
    layer.appendChild(f);
    requestAnimationFrame(()=>{
      f.style.transition = 'top .5s cubic-bezier(.22,1,.36,1), opacity .3s, transform .5s cubic-bezier(.22,1,.36,1)';
      f.style.opacity = '1';
      f.style.top = dog.plate[1]+'%';
      f.style.transform = 'translate(-50%,-50%) scale(1)';
    });
    // 命中:星光 + 计数 + 飘字 + 气泡变谢谢
    later(()=>{
      const s = el('spark'); s.textContent='✦'; Object.assign(s.style, pct(dog.plate));
      layer.appendChild(s);
      s.style.transition='opacity .4s, transform .6s ease-out';
      requestAnimationFrame(()=>{ s.style.opacity='1'; s.style.transform='translate(-50%,-90%) scale(1.4)'; });
      later(()=>{ s.style.opacity='0'; }, 500);

      fed++; combo++; if(combo>maxCombo) maxCombo=combo;
      fedVal.textContent=fed; comboVal.textContent=combo;
      const p=Math.min(100,Math.round(fed/TOTAL_FEEDS*100));
      progFill.style.width=p+'%'; progPct.textContent=p+'%';
      floatBig('喂饱啦！', combo>1?`连击 ×${combo}`:'转头命中 +1');

      b.textContent = '谢谢！'; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    }, 520);
  }, 260+HOLD);

  // 4) 收尾:淡出气泡和菜
  later(()=>{
    b.classList.remove('show');
    const f = layer.querySelector('.food:last-of-type');
    if(f){ f.style.opacity='0'; f.style.transform='translate(-50%,-50%) scale(1.15)'; }
    later(()=>{ layer.querySelectorAll('.bubble,.ring,.food,.spark').forEach(n=>n.remove()); }, 500);
  }, 260+HOLD+1400);
}

const ROUND_MS = 260+1400+1400+700; // 一轮总时长 ~3.76s

function loop(){
  const dog = DOGS[dogIdx % DOGS.length];
  const food = FOODS[foodIdx % FOODS.length];
  feedRound(dog, food);
  dogIdx++; foodIdx++; roundCount++;
  if(roundCount < TOTAL_FEEDS) later(loop, ROUND_MS);
  else later(endShow, ROUND_MS+400);
}

function runShow(){
  fed=0; combo=0; maxCombo=0; roundCount=0; dogIdx=0; foodIdx=0;
  fedVal.textContent=0; comboVal.textContent=0;
  progFill.style.width='0%'; progPct.textContent='0%';
  layer.innerHTML='';
  later(()=>showToast('转头对准饿了的 Doga，喂饱它'),400);
  later(loop, 1400);
}

/* ============ 结算页 streak 火苗 +1(数据出现后延迟触发) ============ */
function playStreakFlame(){
  const win=document.getElementById('streakWin');
  if(!win) return;
  win.querySelectorAll('.flame,.flame-plus,.flame-spark,.streak-days,.streak-sub').forEach(el=>{
    el.style.animation='none';void el.offsetWidth;el.style.animation='';
  });
  win.classList.add('go');
}

function endShow(){
  document.getElementById('rFed').textContent = fed + '/' + TOTAL_FEEDS;
  document.getElementById('rCombo').textContent = '×' + maxCombo;
  result.classList.remove('hide');
  setTimeout(playStreakFlame,800);
}

/* ============ 3秒倒计时(四关统一) ============ */
function runCountdown(done){
  const cd=document.getElementById('countdown');
  const cdNum=document.getElementById('cdNum');
  cd.classList.remove('hide');
  let n=3;
  (function step(){
    if(n>0){ cdNum.textContent=n; cdNum.className='cd-num cd-pop'; }
    else{ cdNum.textContent='GO!'; cdNum.className='cd-num go cd-pop'; }
    void cdNum.offsetWidth;
    if(n>=0){ n--; setTimeout(step,1000); }
    else{ cd.classList.add('hide'); done&&done(); }
  })();
}

function start(){
  intro.classList.add('hide');
  result.classList.add('hide');
  document.getElementById('streakWin').classList.remove('go');
  clearTimers();
  v.currentTime=0; v.play().catch(()=>{});
  runCountdown(runShow);   // 先 3 秒倒计时,再开始喂食
}

document.getElementById('startBtn').addEventListener('click',start);
document.getElementById('againBtn').addEventListener('click',start);

// 调试/演示入口:?end=1 直接看结算火苗;?auto=1 自动跑完整流程
const params = new URLSearchParams(location.search);
v.play().catch(()=>{});
if(params.get('end')==='1'){
  fed=TOTAL_FEEDS; maxCombo=TOTAL_FEEDS;
  intro.classList.add('hide');
  endShow();
}else if(params.get('auto')==='1'){
  start();
}
</script>
